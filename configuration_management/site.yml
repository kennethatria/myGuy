# site.yml - Base provisioning: packages, runtime dependencies, VPC networking

---
- name: Configure app instance base
  hosts: "{{ target | default('app') }}"
  become: yes

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Enable universe repository
      ansible.builtin.apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_facts['distribution_release'] }} universe"
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Update apt cache after enabling universe
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Install packages
      ansible.builtin.apt:
        name:
          - git
          - curl
          - podman
          - podman-compose
          - nginx
          - certbot
          - python3-certbot-nginx
          - libnginx-mod-http-modsecurity
          # Each request's country in the access log (tasks/geoip.yml)
          - libnginx-mod-http-geoip2
        state: present

    # --- Visitor countries (nginx logs each request's country) ---

    - name: Install the IP-to-country database
      ansible.builtin.include_tasks: tasks/geoip.yml

    # --- VPC Network Interface ---

    # --- Journal size ---
    # Uncapped, journald grows its files (and their memory mappings) to ~10%
    # of the disk; on a 1 GB server that memory matters more than old logs.

    - name: Create journald drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"
      become: yes

    - name: Cap systemd journal size
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/size.conf
        mode: "0644"
        content: |
          [Journal]
          SystemMaxUse=100M
          SystemMaxFileSize=20M
      become: yes
      register: journald_conf

    - name: Apply journal cap now
      when: journald_conf.changed
      become: yes
      block:
        - name: Restart journald
          ansible.builtin.systemd:
            name: systemd-journald
            state: restarted

        - name: Trim existing journal files to the cap
          ansible.builtin.command:
            cmd: journalctl --vacuum-size=100M

    - name: Write VPC netplan config
      ansible.builtin.copy:
        dest: /etc/netplan/05-vpc.yaml
        mode: "0600"
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              eth1:
                dhcp4: false
                addresses:
                  - {{ vpc_ip }}/24

    - name: Apply netplan configuration
      ansible.builtin.command:
        cmd: netplan apply
      changed_when: false
