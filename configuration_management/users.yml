# users.yml - Phase 1 & 3: IAM bootstrap for app and monitoring instances
#
# Always connects as root (remote_user overrides inventory) so this can run
# on a brand-new server before myguy exists.  After this playbook completes:
#   - myguy user is provisioned with SSH key and tight sudoers
#   - node_exporter and promtail have dedicated no-login system accounts
#   - PermitRootLogin is disabled — all subsequent plays SSH as myguy
#
# Required extra vars (passed from CI/CD):
#   ci_cd_public_key  - SSH public key that the runner will use to auth as myguy

---
- name: Bootstrap app instance users and SSH hardening
  hosts: "{{ target | default('app') }}"
  remote_user: root   # always bootstrap as root regardless of inventory ansible_user
  become: yes

  vars:
    app_user: myguy

  tasks:
    # --- myguy application user ---

    - name: Create myguy group
      ansible.builtin.group:
        name: "{{ app_user }}"
        state: present

    - name: Create myguy user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_user }}"
        groups:
          - systemd-journal   # read journald logs without sudo
        append: yes
        shell: /bin/bash
        home: "/home/{{ app_user }}"
        create_home: yes
        password: "!"         # locked — SSH key only
        state: present

    - name: Authorize CI/CD SSH public key for myguy
      ansible.posix.authorized_key:
        user: "{{ app_user }}"
        key: "{{ ci_cd_public_key }}"
        state: present

    # --- Rootless Podman prerequisites ---

    - name: Configure subuid for rootless Podman
      ansible.builtin.lineinfile:
        path: /etc/subuid
        regexp: "^{{ app_user }}:"
        line: "{{ app_user }}:100000:65536"
        create: yes

    - name: Configure subgid for rootless Podman
      ansible.builtin.lineinfile:
        path: /etc/subgid
        regexp: "^{{ app_user }}:"
        line: "{{ app_user }}:100000:65536"
        create: yes

    - name: Enable systemd linger for myguy
      # Keeps the user's systemd session alive after logout so rootless
      # containers with restart policies auto-start on boot.
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ app_user }}
      changed_when: false

    # --- Sudoers ---
    # myguy needs sudo only for Ansible provisioning tasks (apt, systemctl,
    # nginx, certbot, etc.).  App container operations run rootlessly and
    # require no sudo at all.
    #
    # We deliberately deny interactive shells so an attacker who compromises
    # the SSH key cannot do `sudo bash` to get a root shell.

    - name: Write sudoers file for myguy
      ansible.builtin.copy:
        dest: /etc/sudoers.d/myguy
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        content: |
          Defaults:{{ app_user }} !requiretty
          Cmnd_Alias SHELLS = /bin/bash, /bin/sh, /bin/dash, /bin/zsh, \
                              /usr/bin/bash, /usr/bin/sh, /usr/bin/zsh, /usr/bin/dash
          {{ app_user }} ALL=(ALL) NOPASSWD: ALL, !SHELLS

    # --- Dedicated service accounts (Phase 3) ---

    - name: Create node_exporter system user
      ansible.builtin.user:
        name: node_exporter
        system: yes
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: no
        state: present

    - name: Create promtail system user
      ansible.builtin.user:
        name: promtail
        system: yes
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: no
        groups:
          - systemd-journal   # read journald
          - adm               # read /var/log/nginx/ on Ubuntu
        append: yes
        state: present

    # --- ops troubleshooting user (app instance) ---

    - name: Create ops group
      ansible.builtin.group:
        name: ops
        state: present

    - name: Create ops user
      ansible.builtin.user:
        name: ops
        group: ops
        groups:
          - systemd-journal   # read journald logs without sudo
        append: yes
        shell: /bin/bash
        home: /home/ops
        create_home: yes
        password: "!"         # locked — SSH key only
        state: present

    - name: Authorize ops SSH public key
      ansible.posix.authorized_key:
        user: ops
        key: "{{ ops_ssh_public_key }}"
        state: present

    - name: Install appctl wrapper script
      # appctl runs podman commands inside myguy's rootless context.
      # It validates the subcommand itself so the sudoers rule stays simple.
      ansible.builtin.copy:
        dest: /usr/local/bin/appctl
        mode: "0755"
        owner: root
        group: root
        content: |
          #!/bin/bash
          # appctl - container management wrapper for the ops user.
          # Runs podman commands inside myguy's rootless Podman context.
          # Allowed subcommands: ps, logs, inspect, stats, restart

          MYGUY_UID=$(id -u myguy 2>/dev/null)
          if [[ -z "$MYGUY_UID" ]]; then
            echo "Error: myguy user not found" >&2
            exit 1
          fi

          XDG="/run/user/$MYGUY_UID"
          CMD="${1:-}"

          case "$CMD" in
            ps|stats)
              exec runuser -u myguy -- env XDG_RUNTIME_DIR="$XDG" /usr/bin/podman "$@"
              ;;
            logs|inspect)
              if [[ -z "${2:-}" ]]; then
                echo "Usage: sudo appctl $CMD <container>" >&2
                exit 1
              fi
              exec runuser -u myguy -- env XDG_RUNTIME_DIR="$XDG" /usr/bin/podman "$@"
              ;;
            restart)
              if [[ -z "${2:-}" ]]; then
                echo "Usage: sudo appctl restart <container>" >&2
                exit 1
              fi
              # Intentionally only accepts a single container name — prevents
              # ops from restarting the entire stack at once.
              exec runuser -u myguy -- env XDG_RUNTIME_DIR="$XDG" /usr/bin/podman restart "$2"
              ;;
            *)
              echo "appctl: unknown command '${CMD}'" >&2
              echo "Allowed commands: ps, logs, inspect, stats, restart" >&2
              exit 1
              ;;
          esac

    - name: Write sudoers file for ops (app instance)
      # ops can only run appctl (container ops), read the .env secrets file,
      # and run scoped fail2ban-client commands for observability and unban.
      # No broad sudo — shells are implicitly denied by omission.
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ops
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        content: |
          Defaults:ops !requiretty
          Cmnd_Alias APP_CMDS      = /usr/local/bin/appctl
          Cmnd_Alias APP_SECRETS   = /usr/bin/cat /opt/myguy/.env
          Cmnd_Alias FAIL2BAN_OBS  = /usr/bin/fail2ban-client status, \
                                     /usr/bin/fail2ban-client status *
          Cmnd_Alias FAIL2BAN_CTRL = /usr/bin/fail2ban-client set * unbanip *
          ops ALL=(root) NOPASSWD: APP_CMDS, APP_SECRETS, FAIL2BAN_OBS, FAIL2BAN_CTRL

    # --- SSH hardening (must be last — restarts sshd) ---
    # Restarting sshd does not kill the current connection; it only affects
    # new logins.  After this play ends Ansible disconnects normally, and
    # all subsequent plays connect as myguy.

    - name: Harden SSH configuration
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backup: yes
      loop:
        - { regexp: '^#?PermitRootLogin',        line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication',  line: 'PasswordAuthentication no' }
        - { regexp: '^#?PubkeyAuthentication',    line: 'PubkeyAuthentication yes' }
        - { regexp: '^#?AllowAgentForwarding',    line: 'AllowAgentForwarding no' }
        - { regexp: '^#?X11Forwarding',           line: 'X11Forwarding no' }

    - name: Restart SSH service to apply hardening
      ansible.builtin.service:
        name: ssh
        state: restarted


- name: Bootstrap monitoring instance users and SSH hardening
  hosts: monitoring
  remote_user: root   # bootstrap as root; ProxyJump goes via myguy@app (already bootstrapped above)
  become: yes

