# security.yml - WAF (ModSecurity/OWASP CRS), Falco runtime security, cosign

---
- name: Configure app instance security tooling
  hosts: "{{ target | default('app') }}"
  become: yes

  handlers:
    # libmodsecurity opens its audit log once and ignores `nginx -s reopen`;
    # a reload makes it open the file again.
    - name: reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

  tasks:
    # --- ModSecurity WAF ---

    - name: Create ModSecurity config directory
      ansible.builtin.file:
        path: /etc/nginx/modsecurity
        state: directory
        mode: "0755"

    - name: Clone OWASP Core Rule Set
      ansible.builtin.git:
        repo: https://github.com/coreruleset/coreruleset.git
        dest: /etc/nginx/modsecurity/owasp-crs
        version: "v4.0.0"
        depth: 1   # the tag snapshot is all we need; full history is slow
        force: no

    - name: Copy CRS setup config
      ansible.builtin.copy:
        src: /etc/nginx/modsecurity/owasp-crs/crs-setup.conf.example
        dest: /etc/nginx/modsecurity/owasp-crs/crs-setup.conf
        remote_src: yes
        force: no

    # nginx only reads it on a reload: without one a change is written but
    # never used (#203's audit log change stayed inactive this way).
    - name: Write ModSecurity config
      ansible.builtin.template:
        src: coraza.conf.j2
        dest: /etc/nginx/modsecurity/coraza.conf
        mode: "0644"
      vars:
        coraza_config_dir: /etc/nginx/modsecurity
      register: modsecurity_config
      notify: reload nginx

    - name: Check the nginx configuration with the new ModSecurity config
      ansible.builtin.command:
        cmd: nginx -t
      when: modsecurity_config.changed
      changed_when: false

    - name: Add modsecurity_audit.log logrotate config
      ansible.builtin.copy:
        dest: /etc/logrotate.d/modsecurity
        mode: "0644"
        content: |
          /var/log/nginx/modsecurity_audit.log {
              daily
              missingok
              rotate 14
              compress
              delaycompress
              notifempty
              # libmodsecurity keeps the audit log open and ignores
              # `nginx -s reopen`: after a rename it writes to the rotated
              # (later deleted) file and Promtail and fail2ban see nothing.
              copytruncate
          }
      notify: reload nginx

    # --- Falco ---

    - name: Download Falco GPG key
      ansible.builtin.get_url:
        url: https://falco.org/repo/falcosecurity-packages.asc
        dest: /tmp/falcosecurity-packages.asc
        mode: "0644"

    - name: Dearmor Falco GPG key
      ansible.builtin.shell:
        cmd: gpg --dearmor -o /usr/share/keyrings/falco-archive-keyring.gpg /tmp/falcosecurity-packages.asc
        creates: /usr/share/keyrings/falco-archive-keyring.gpg

    - name: Add Falco apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/falco-archive-keyring.gpg] https://download.falco.org/packages/deb stable main"
        filename: falcosecurity
        state: present

    - name: Install kernel headers
      ansible.builtin.apt:
        name: "linux-headers-{{ ansible_facts['kernel'] }}"
        state: present
        update_cache: yes

    - name: Install Falco
      ansible.builtin.apt:
        name: falco
        state: present

    - name: Remove old Falco metrics blockinfile entry
      ansible.builtin.blockinfile:
        path: /etc/falco/falco.yaml
        marker: "# {mark} ANSIBLE MANAGED - metrics"
        state: absent

    - name: Write Falco Prometheus metrics config
      ansible.builtin.copy:
        dest: /etc/falco/config.d/prometheus.yaml
        mode: "0644"
        content: |
          metrics:
            enabled: true
            interval: 1h
            output_rule: false
            rules_counters_enabled: true
            resource_utilization_enabled: true
            state_counters_enabled: true
            kernel_event_counters_enabled: true
            libbpf_stats_enabled: true
            convert_memory_to_mb: true
            include_empty_values: false
          webserver:
            enabled: true
            listen_port: 8765
            # The VPC address only: Prometheus on the monitoring server
            listen_address: {{ vpc_ip }}
            prometheus_metrics_enabled: true

    # Alerts as JSON on stdout, which systemd puts in the journal; Promtail
    # ships them to Loki (job="falco") with the rule, process, container and
    # command line as fields.  Syslog output is off: it would send each
    # alert to the journal a second time.
    - name: Write Falco output config (JSON to the journal)
      ansible.builtin.copy:
        dest: /etc/falco/config.d/output.yaml
        mode: "0644"
        content: |
          json_output: true
          json_include_output_property: true
          json_include_tags_property: true
          stdout_output:
            enabled: true
          syslog_output:
            enabled: false

    # Our own deploys tripped two rules on every run (Falco logs, 2026-10-09):
    # Ansible's Python under sudo reads /etc/shadow ("Read sensitive file
    # untrusted"), and its git module walks the OWASP CRS submodules through
    # ../ paths ("Directory traversal monitored file read").  Only that chain
    # in myguy's login session is excused; the same reads by anything else,
    # ops included, still alert.  Validated with Falco's own rules before
    # it's installed, so a mistake can't stop Falco starting.
    - name: Write Falco local rules (deploy exceptions)
      ansible.builtin.copy:
        dest: /etc/falco/falco_rules.local.yaml
        mode: "0644"
        validate: falco -V /etc/falco/falco_rules.yaml -V %s
        content: |
          - macro: myguy_ansible
            condition: >
              (user.loginname = myguy and proc.aname = sudo and
               (proc.name startswith python or proc.pname startswith python))

          - rule: Read sensitive file untrusted
            condition: and not myguy_ansible
            override:
              condition: append

          - rule: Directory traversal monitored file read
            condition: >
              and not (myguy_ansible and
                       fd.name startswith /etc/nginx/modsecurity/owasp-crs/)
            override:
              condition: append

    - name: Enable and start Falco service
      ansible.builtin.service:
        name: falco
        state: restarted
        enabled: yes

    # --- Cosign ---

    - name: Install cosign for image signature verification
      ansible.builtin.get_url:
        url: https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
        dest: /usr/local/bin/cosign
        mode: "0755"
        force: no

    # --- Fail2ban ---

    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present

    - name: Write fail2ban jail config
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        mode: "0644"
        content: |
          [DEFAULT]
          bantime  = 3600    ; ban for 1 hour by default
          findtime = 600     ; look at the last 10 minutes
          maxretry = 5
          # systemd reads the journal and ignores logpath: the nginx jails
          # below read files, so each sets backend = auto (without it they
          # never banned anyone).
          backend  = systemd
          # Never ban ourselves: this server, the VPC (monitoring server) and
          # the NodeBalancer, which every web request comes through.
          ignoreip = 127.0.0.1/8 ::1 10.0.0.0/24 192.168.255.0/24

          # Web jails ban with nginx-ban, not the firewall: web traffic
          # reaches this server from the NodeBalancer, so the firewall never
          # sees a visitor's IP (before 2026-10 web bans blocked nothing).
          # nginx refuses banned IPs (444) within a minute.

          # SSH — key-only auth is enforced, so any failed attempt is either
          # a wrong username or connection probing. Ban quickly.
          [sshd]
          enabled  = true
          port     = ssh
          logpath  = %(sshd_log)s
          backend  = %(sshd_backend)s
          maxretry = 3
          bantime  = 3600

          # Nginx — generic 4xx flood (scanners probing endpoints)
          [nginx-4xx]
          enabled  = true
          port     = http,https
          filter   = nginx-4xx
          logpath  = /var/log/nginx/access.log
          backend  = auto
          action   = nginx-ban
          maxretry = 20
          findtime = 300
          bantime  = 3600

          # Nginx — known bot/scanner paths (wp-login, /admin, /phpMyAdmin etc.)
          [nginx-botsearch]
          enabled  = true
          port     = http,https
          logpath  = /var/log/nginx/access.log
          backend  = auto
          action   = nginx-ban
          maxretry = 2
          bantime  = 86400  ; 24 hours — these are deliberate scans

          # ModSecurity — ban IPs that repeatedly trigger WAF rules
          [nginx-modsecurity]
          enabled  = true
          port     = http,https
          filter   = nginx-modsecurity
          logpath  = /var/log/nginx/modsecurity_audit.log
          backend  = auto
          action   = nginx-ban
          maxretry = 3
          bantime  = 86400  ; 24 hours — WAF hits are high-confidence signals

          # Sign-in abuse — one client spraying code requests (email bombing)
          # or guessing codes.  Real use peaks at ~6 calls in 10 minutes.
          [nginx-auth-abuse]
          enabled  = true
          port     = http,https
          filter   = nginx-auth-abuse
          logpath  = /var/log/nginx/access.json.log
          backend  = auto
          action   = nginx-ban
          maxretry = 15
          findtime = 600
          bantime  = 86400

          # Tripwire: paths this app never has (PHP, dot-files, WordPress,
          # admin tools, the robots.txt-only trap) are asked for only by
          # scanners.  One hit bans for 7 days, longer each time it returns.
          [tripwire]
          enabled  = true
          port     = http,https
          filter   = tripwire
          logpath  = /var/log/nginx/access.json.log
          backend  = auto
          action   = nginx-ban
          maxretry = 1
          bantime  = 604800
          bantime.increment = true
          bantime.maxtime   = 2592000  ; at most 30 days

          # Manual bans (fail2ban-client set manual banip <IP>), 7 days,
          # for the site (nginx) and SSH (firewall).  Its filter never
          # matches, so nothing is banned automatically.
          [manual]
          enabled  = true
          port     = http,https,ssh
          filter   = manual
          logpath  = /var/log/nginx/access.json.log
          backend  = auto
          action   = %(action_)s
                     nginx-ban
          maxretry = 1
          bantime  = 604800

    - name: Write nginx-4xx fail2ban filter
      ansible.builtin.copy:
        dest: /etc/fail2ban/filter.d/nginx-4xx.conf
        mode: "0644"
        content: |
          [Definition]
          failregex = ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE|PATCH|OPTIONS).*" (400|401|403|404|405|429) \d+
          ignoreregex =

    - name: Write nginx-modsecurity fail2ban filter
      # One JSON audit line per flagged request (coraza.conf.j2), starting
      # {"transaction":{"client_ip":"<ip>","time_stamp":"Fri Oct  9 ..."};
      # fail2ban finds the date in time_stamp.
      ansible.builtin.copy:
        dest: /etc/fail2ban/filter.d/nginx-modsecurity.conf
        mode: "0644"
        content: |
          [Definition]
          failregex = ^\{"transaction":\{"client_ip":"<HOST>"
          ignoreregex =

    - name: Write nginx-auth-abuse fail2ban filter
      # The JSON access log written by nginx-common.conf.j2.  fail2ban takes
      # the timestamp out of the line before matching, so "time" is empty.
      ansible.builtin.copy:
        dest: /etc/fail2ban/filter.d/nginx-auth-abuse.conf
        mode: "0644"
        content: |
          [Definition]
          failregex = ^\{"time":"[^"]*","remote_addr":"<HOST>","method":"POST","uri":"/api/v1/auth/(?:request-code|verify-code|complete-signup)"
          ignoreregex =

    - name: Write manual-ban fail2ban filter
      ansible.builtin.copy:
        dest: /etc/fail2ban/filter.d/manual.conf
        mode: "0644"
        content: |
          [Definition]
          # Never matches: this jail only holds bans added by hand.
          failregex = ^MANUAL-BAN-NEVER-IN-LOGS <HOST>$
          ignoreregex =

    # Paths only scanners ask for (from 8 days of 404s, 2026-10).  Never
    # /robots.txt, /sitemap.xml or /.well-known/: polite crawlers fetch those.
    # /internal-archive/ is listed only as Disallow in robots.txt, so only
    # crawlers that ignore it get there.  uri is the path without query.
    - name: Write tripwire fail2ban filter
      ansible.builtin.copy:
        dest: /etc/fail2ban/filter.d/tripwire.conf
        mode: "0644"
        content: |
          [Definition]
          failregex = ^\{"time":"[^"]*","remote_addr":"<HOST>","method":"[A-Z]*","uri":"(?:[^"]*\.php(?:/[^"]*)?|[^"]*/\.(?:env|git|svn|hg|aws|ssh|DS_Store)[^"]*|/(?:wp-|xmlrpc|phpmyadmin|pma/|cgi-bin/|actuator|containers/json|internal-archive)[^"]*)"
          ignoreregex =

    # Bans that work for web traffic.  Each jail keeps its banned IPs in
    # /etc/nginx/banned/<jail>.conf; nginx reads the folder as a geo map
    # (nginx-common.conf.j2) and refuses those IPs.  nginx-bans-sync.timer
    # reloads nginx when a list changed, so bursts share one reload.
    - name: Write the nginx-ban fail2ban action
      ansible.builtin.copy:
        dest: /etc/fail2ban/action.d/nginx-ban.conf
        mode: "0644"
        content: |
          [Definition]
          actionstart = mkdir -p /etc/nginx/banned && touch <banfile>
          actionstop = rm -f <banfile>
          actionflush = : > <banfile>
          actioncheck =
          actionban = flock <banfile>.lock sh -c 'grep -qxF "<ip> 1;" <banfile> || echo "<ip> 1;" >> <banfile>'
          actionunban = flock <banfile>.lock sh -c 'grep -vxF "<ip> 1;" <banfile> > <banfile>.tmp; mv <banfile>.tmp <banfile>'

          [Init]
          banfile = /etc/nginx/banned/<name>.conf

    # Repeat offenders: bantime.increment needs bans remembered longer than
    # the default day.
    - name: Remember bans for 30 days
      ansible.builtin.copy:
        dest: /etc/fail2ban/fail2ban.d/myguy.local
        mode: "0644"
        content: |
          [DEFAULT]
          dbpurgeage = 30d

    - name: Create the nginx ban folder
      ansible.builtin.file:
        path: /etc/nginx/banned
        state: directory
        mode: "0755"

    - name: Install the nginx ban sync
      ansible.builtin.copy:
        dest: /usr/local/bin/nginx-bans-sync
        mode: "0755"
        content: |
          #!/bin/sh
          # Reloads nginx if fail2ban changed a ban list (/etc/nginx/banned)
          # since the last reload.  Run every minute: bans arriving together
          # share one reload, and a change made during a reload is caught
          # the next minute (its time is after the stamp).
          set -eu
          stamp=/run/nginx-bans.stamp
          if [ -e "$stamp" ] && [ -z "$(find /etc/nginx/banned -newer "$stamp" -print -quit)" ]; then
            exit 0
          fi
          touch "$stamp.next"
          nginx -t -q
          systemctl reload nginx
          mv "$stamp.next" "$stamp"

    - name: Write the nginx ban sync units
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.key }}"
        mode: "0644"
        content: "{{ item.value }}"
      loop: "{{ ban_sync_units | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        ban_sync_units:
          nginx-bans-sync.service: |
            [Unit]
            Description=Reload nginx when fail2ban's ban lists changed
            After=nginx.service

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/nginx-bans-sync
          nginx-bans-sync.timer: |
            [Unit]
            Description=Apply fail2ban's web bans every minute

            [Timer]
            OnCalendar=minutely
            AccuracySec=5s

            [Install]
            WantedBy=timers.target

    - name: Start the nginx ban sync
      ansible.builtin.systemd:
        name: nginx-bans-sync.timer
        enabled: yes
        state: started
        daemon_reload: yes

    # Every reload starts new workers; old ones keep serving open
    # connections, and chat's websockets stay open for hours.  Bound it so
    # reloads for bans don't pile up old workers (clients reconnect).
    - name: Limit how long old nginx workers linger after a reload
      ansible.builtin.lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: '^worker_shutdown_timeout '
        line: "worker_shutdown_timeout 5m;"
        insertafter: '^pid '
      notify: reload nginx

    - name: Enable and start fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: yes
        state: restarted
        daemon_reload: yes
