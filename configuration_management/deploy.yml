# deploy.yml - Deploy myGuy application to a remote server
#
# Runs as myguy (the inventory ansible_user).  Tasks that touch system paths
# (nginx, certbot) carry explicit become: yes.  Podman tasks run rootlessly as
# myguy — no become needed.

---
- name: Deploy myGuy application
  hosts: "{{ target | default('app') }}"
  # No play-level become: each task declares its own privilege requirement.

  handlers:
    - name: reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      become: yes

  vars:
    app_user: myguy
    app_dir: /opt/myguy
    git_branch: main
    # "all" redeploys the whole stack, databases included; otherwise a
    # space-separated list of the compose services to replace (the CI
    # pipeline passes the ones a push changed)
    app_services: all
    all_app_services: [api, store-service, chat-websocket-service, proximity-service]
    # podman-compose creates a container with --requires on its depends_on
    # services, so replacing one removes the services that depend on it (as
    # in docker-compose.yml), and they have to be started again with it
    app_dependents:
      api: [chat-websocket-service]
      store-service: [chat-websocket-service]
    deploy_all: "{{ app_services == 'all' }}"
    requested_services: "{{ app_services.split() | unique }}"
    services_to_deploy: >-
      {{ all_app_services if deploy_all else
         (requested_services + requested_services | map('extract', app_dependents) | select('defined') | flatten) | unique }}
    # Each compose service runs the image myguy-<service>
    images_to_verify: "{{ services_to_deploy | map('regex_replace', '^', registry ~ '/myguy-') | map('regex_replace', '$', ':' ~ image_tag) | list }}"

  pre_tasks:
    # The proximity service's Redis refuses to start without a password
    - name: Require the proximity Redis password
      ansible.builtin.assert:
        that: proximity_redis_password | default('') | length > 0
        fail_msg: "Set the PROXIMITY_REDIS_PASSWORD repository secret before deploying."
        quiet: true

    - name: Get myguy user ID for XDG_RUNTIME_DIR
      ansible.builtin.command:
        cmd: id -u {{ app_user }}
      register: app_user_uid_result
      changed_when: false

    - name: Set XDG_RUNTIME_DIR fact
      ansible.builtin.set_fact:
        app_user_uid: "{{ app_user_uid_result.stdout }}"
        xdg_runtime_dir: "/run/user/{{ app_user_uid_result.stdout }}"

  tasks:
    # --- Application Setup ---

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"
      become: yes   # /opt/ requires root to create

    - name: Clone or update repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ git_branch }}"
        force: yes
      # myguy owns app_dir — no become needed

    # --- Environment Configuration ---

    - name: Write .env file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        mode: "0600"
        owner: "{{ app_user }}"
        content: |
          JWT_SECRET={{ jwt_secret }}
          DB_PASSWORD={{ db_password }}
          INTERNAL_API_KEY={{ internal_api_key }}
          PROXIMITY_REDIS_PASSWORD={{ proximity_redis_password }}
          # No Tempo in production (removed to fit the 1 GB monitoring server)
          OTEL_TRACES_EXPORTER=none
          IMAGE_TAG={{ image_tag }}
          SMTP_HOST={{ smtp_host | default('') }}
          SMTP_PORT={{ smtp_port | default('587', true) }}
          SMTP_USERNAME={{ smtp_username | default('') }}
          SMTP_PASSWORD={{ smtp_password | default('') }}
          SMTP_FROM={{ smtp_from | default('') }}
      become: yes   # chown requires root even though myguy owns the dir

    # --- Deploy ---

    # `-f docker-compose.yml` skips docker-compose.override.yml (local-only
    # services such as a local Tempo and Grafana for traces).
    - name: Pull images from Docker Hub
      ansible.builtin.command:
        cmd: "podman compose -f docker-compose.yml pull{{ '' if deploy_all else ' ' ~ services_to_deploy | join(' ') }}"
        chdir: "{{ app_dir }}"
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
        JWT_SECRET: "{{ jwt_secret }}"
        DB_PASSWORD: "{{ db_password }}"
        INTERNAL_API_KEY: "{{ internal_api_key }}"
        PROXIMITY_REDIS_PASSWORD: "{{ proximity_redis_password }}"
      # rootless podman — no become

    - name: Get image digests
      ansible.builtin.command:
        cmd: podman image inspect --format {% raw %}"{{.Digest}}"{% endraw %} {{ item }}
      loop: "{{ images_to_verify }}"
      register: image_digests
      changed_when: false
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: Verify image signatures with cosign
      ansible.builtin.command:
        cmd: >
          cosign verify
          --certificate-identity-regexp "https://github.com/{{ github_repository }}/.github/workflows/.*"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          {{ item.item | regex_replace(':.*$', '') }}@{{ item.stdout }}
      loop: "{{ image_digests.results }}"
      changed_when: false

    # Container output goes to the systemd journal, where Promtail ships it
    # to Loki (observability.yml).  Applies to containers created from now on.
    - name: Create Podman config directory for the app user
      ansible.builtin.file:
        path: /home/{{ app_user }}/.config/containers
        state: directory
        mode: "0755"

    - name: Send container logs to the journal
      ansible.builtin.copy:
        dest: /home/{{ app_user }}/.config/containers/containers.conf
        mode: "0644"
        content: |
          [containers]
          log_driver = "journald"

    - name: Remove the old app-server Zipkin (traces go to the monitoring server)
      ansible.builtin.command:
        cmd: podman rm -f myguy_zipkin_1
      register: old_zipkin
      changed_when: old_zipkin.rc == 0
      failed_when: false
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: Start application stack
      when: deploy_all
      ansible.builtin.command:
        cmd: podman compose -f docker-compose.yml up -d --force-recreate
        chdir: "{{ app_dir }}"
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
        JWT_SECRET: "{{ jwt_secret }}"
        DB_PASSWORD: "{{ db_password }}"
        INTERNAL_API_KEY: "{{ internal_api_key }}"
        PROXIMITY_REDIS_PASSWORD: "{{ proximity_redis_password }}"
      # rootless podman — no become

    # Replacing only some services: podman-compose 1.0.6 ignores --no-deps,
    # so `up --force-recreate api` would also restart Postgres. Remove just
    # these containers instead; `up` then creates them from the new images
    # and leaves their already-running dependencies alone. --depend removes
    # dependent containers first (they are in services_to_deploy too).
    - name: Remove the containers being replaced
      when: not deploy_all
      ansible.builtin.shell:
        cmd: podman ps -aq --filter label=com.docker.compose.service={{ item }} | xargs -r podman rm -f --depend
      loop: "{{ services_to_deploy }}"
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: Start the replaced services
      when: not deploy_all
      ansible.builtin.command:
        cmd: podman compose -f docker-compose.yml up -d {{ services_to_deploy | join(' ') }}
        chdir: "{{ app_dir }}"
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
        JWT_SECRET: "{{ jwt_secret }}"
        DB_PASSWORD: "{{ db_password }}"
        INTERNAL_API_KEY: "{{ internal_api_key }}"
        PROXIMITY_REDIS_PASSWORD: "{{ proximity_redis_password }}"

    # --- Old images ---
    # Each deploy pulls new image tags and nothing removed the old ones, so
    # they piled up on the disk.  Remove every image no container uses (the
    # running stack keeps its own); rolling back pulls the old tag again.
    # The before/after usage shows in the deploy log.

    - name: Measure Podman disk use before cleanup
      ansible.builtin.command:
        cmd: podman system df
      register: podman_df_before
      changed_when: false
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: Remove images no container uses
      ansible.builtin.command:
        cmd: podman image prune --all --force
      register: image_prune
      changed_when: image_prune.stdout | trim | length > 0
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: Measure Podman disk use after cleanup
      ansible.builtin.command:
        cmd: podman system df
      register: podman_df_after
      changed_when: false
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: Report image cleanup
      ansible.builtin.debug:
        msg: "{{ ['Before:'] + podman_df_before.stdout_lines + ['After (' ~ (image_prune.stdout_lines | length) ~ ' images removed):'] + podman_df_after.stdout_lines }}"

    # --- Nginx + TLS ---

    # Names served: DOMAIN (the app) and redirect_domains (group_vars/app.yml,
    # redirected to DOMAIN).  nginx is written for the certificates that exist
    # (tls_domains), the missing ones are requested, then nginx is written
    # again: a new DOMAIN keeps the site on HTTPS throughout.
    - name: Check which TLS certificates exist
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ item }}/fullchain.pem
      loop: "{{ ([domain] + redirect_domains) | unique }}"
      register: cert_stats
      become: yes   # /etc/letsencrypt/live is root-only (0700)

    - name: Note the names that have a certificate
      ansible.builtin.set_fact:
        tls_domains: "{{ cert_stats.results | selectattr('stat.exists') | map(attribute='item') | list }}"

    - name: Write nginx shared config (real client IP, JSON access log)
      ansible.builtin.template:
        src: nginx-common.conf.j2
        dest: /etc/nginx/conf.d/myguy.conf
        mode: "0644"
      notify: reload nginx
      become: yes

    - name: Write nginx security headers snippet
      ansible.builtin.template:
        src: nginx-security-headers.conf.j2
        dest: /etc/nginx/snippets/myguy-security-headers.conf
        mode: "0644"
      notify: reload nginx
      become: yes

    # A fresh server has no certificate yet: plain HTTP until certbot runs.
    - name: Write nginx HTTP config (pre-certbot)
      ansible.builtin.template:
        src: nginx-http.conf.j2
        dest: /etc/nginx/sites-available/myguy
        mode: "0644"
      when: tls_domains | length == 0
      notify: reload nginx
      become: yes

    # Otherwise HTTPS with the certificates there are; every name answers on
    # port 80, where certbot's challenge for a new one is served.
    - name: Write nginx HTTPS config for the existing certificates
      ansible.builtin.template:
        src: nginx-https.conf.j2
        dest: /etc/nginx/sites-available/myguy
        mode: "0644"
      when: tls_domains | length > 0
      notify: reload nginx
      become: yes

    - name: Enable nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/myguy
        dest: /etc/nginx/sites-enabled/myguy
        state: link
      notify: reload nginx
      become: yes

    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: reload nginx
      become: yes

    - name: Check the nginx configuration before reloading
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      become: yes

    - name: Flush handlers to reload nginx before certbot
      ansible.builtin.meta: flush_handlers

    # Needs the name's DNS pointing at the NodeBalancer.  On failure the
    # deploy stops here with the site still serving the existing names.
    - name: Obtain missing TLS certificates
      ansible.builtin.command:
        cmd: >
          certbot certonly --nginx
          -d {{ item }} -d www.{{ item }}
          --non-interactive --agree-tos
          -m {{ certbot_email }}
        creates: /etc/letsencrypt/live/{{ item }}/fullchain.pem
      loop: "{{ ([domain] + redirect_domains) | unique }}"
      become: yes

    - name: Check the certificates again
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ item }}/fullchain.pem
      loop: "{{ ([domain] + redirect_domains) | unique }}"
      register: cert_stats
      become: yes

    - name: Note the names that have a certificate now
      ansible.builtin.set_fact:
        tls_domains: "{{ cert_stats.results | selectattr('stat.exists') | map(attribute='item') | list }}"

    - name: Write nginx HTTPS config
      ansible.builtin.template:
        src: nginx-https.conf.j2
        dest: /etc/nginx/sites-available/myguy
        mode: "0644"
      notify: reload nginx
      become: yes

    # Fail here, with the old config still serving, rather than reload into
    # a broken one
    - name: Check the nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      become: yes

    # --- Health Check ---

    - name: Show container status
      ansible.builtin.command:
        cmd: podman ps -a
        chdir: "{{ app_dir }}"
      register: container_status
      changed_when: false
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: Print container status
      ansible.builtin.debug:
        var: container_status.stdout_lines

    - name: Wait for backend API to be healthy
      ansible.builtin.uri:
        url: "http://localhost:8080/health"
        status_code: 200
      register: health_check
      retries: 10
      delay: 6
      until: health_check.status == 200

    - name: Report deployment status
      ansible.builtin.debug:
        msg: >
          Deployment complete.
          https://{{ domain }}
