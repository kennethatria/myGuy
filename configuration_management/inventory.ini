[local]
localhost ansible_connection=local

# Fill APP_INSTANCE_PUBLIC_IP with: terraform output -raw instance_ip_address
# In CI this is injected automatically by the workflow via sed
#
# NOTE: users.yml always overrides remote_user to root for initial bootstrap.
# All other playbooks SSH as myguy and use become: yes for privileged tasks.
[app]
APP_INSTANCE_PUBLIC_IP ansible_user=myguy ansible_ssh_private_key_file=~/.ssh/linode ansible_python_interpreter=/usr/bin/python3.12 ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# Monitoring instance is VPC-only — reached via ProxyJump through the app instance.
# ProxyJump uses myguy@app (root SSH is disabled on app after first deploy).
[monitoring]
10.0.0.3 ansible_user=myguy ansible_ssh_private_key_file=~/.ssh/linode ansible_python_interpreter=/usr/bin/python3.12 ansible_ssh_common_args='-o ProxyCommand="ssh -i ~/.ssh/linode -W %h:%p -o StrictHostKeyChecking=no myguy@APP_INSTANCE_PUBLIC_IP" -o StrictHostKeyChecking=no'

