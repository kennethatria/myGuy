# observability.yml - node_exporter (CPU/memory/disk), Promtail (logs) and
# prometheus-podman-exporter (memory and CPU per container) on the app server

---
- name: Configure app instance observability
  hosts: "{{ target | default('app') }}"
  become: yes

  tasks:
    - name: Allow listening on the VPC address at boot
      ansible.builtin.include_tasks: tasks/vpc_listen.yml

    - name: Install node_exporter
      ansible.builtin.include_tasks: tasks/node_exporter.yml

    # --- Promtail (ships logs to Loki on the monitoring server) ---

    - name: Install Promtail
      ansible.builtin.include_tasks: tasks/promtail.yml
      vars:
        promtail_loki_url: "http://{{ monitoring_vpc_ip }}:3100"
        promtail_scrape_configs: |
          # ModSecurity's audit log: one JSON line per flagged request
          # (client IP, request, status, rules; coraza.conf.j2).  It used to
          # be ~30 lines per request, which a multiline stage here was meant
          # to join; that stage sent nothing in production, so the format
          # changed instead.
          - job_name: modsecurity
            static_configs:
              - targets:
                  - localhost
                labels:
                  job: modsecurity
                  __path__: /var/log/nginx/modsecurity_audit.log

          # JSON access log written by nginx-common.conf.j2.  Fields are
          # parsed at query time (| json) so client IPs never become labels.
          - job_name: nginx_access
            static_configs:
              - targets:
                  - localhost
                labels:
                  job: nginx_access
                  __path__: /var/log/nginx/access.json.log

          # fail2ban's bans and unbans (NOTICE), with the jail as a label.
          # Its INFO lines ("Found <ip>", one per matched line) are dropped:
          # the logs they match are already in Loki.
          - job_name: fail2ban
            static_configs:
              - targets:
                  - localhost
                labels:
                  job: fail2ban
                  __path__: /var/log/fail2ban.log
            pipeline_stages:
              - drop:
                  expression: '\s(INFO|DEBUG)\s'
              - regex:
                  expression: '\[(?P<jail>[\w-]+)\]\s+(?:Ban|Unban|Restore Ban)\s'
              - labels:
                  jail:

          # App container output (podman log_driver journald, set in
          # deploy.yml).  Labels stay low-cardinality: service and stream.
          - job_name: containers
            journal:
              path: /var/log/journal
              max_age: 12h
              labels:
                job: containers
            relabel_configs:
              - source_labels: ['__journal_container_name']
                regex: '.+'
                action: keep
              # myguy_api_1 -> api
              - source_labels: ['__journal_container_name']
                regex: '(?:myguy_)?(.+?)(?:_[0-9]+)?'
                target_label: service
              - source_labels: ['__journal_priority_keyword']
                regex: 'err'
                replacement: stderr
                target_label: stream
              - source_labels: ['__journal_priority_keyword']
                regex: 'info'
                replacement: stdout
                target_label: stream
            pipeline_stages:
              # The backend logs sign-in codes when SMTP is unset; they must
              # never leave the server.
              - drop:
                  expression: 'login code for'

          {{ lookup('ansible.builtin.template', 'files/promtail-system-job.yml.j2', template_vars={'promtail_host': 'app'}) }}

    # --- Container metrics (prometheus-podman-exporter) ---
    # Memory and CPU per app container, so a full server can be traced to the
    # service using it.  The exporter reads myguy's Podman API socket, which
    # can control those containers: it runs as myguy (never root), pinned,
    # memory-capped, and its port is open to the monitoring server only.

    - name: Get myguy user ID
      ansible.builtin.command:
        cmd: id -u myguy
      register: myguy_uid
      changed_when: false

    - name: Set myguy's runtime directory
      ansible.builtin.set_fact:
        myguy_runtime_dir: "/run/user/{{ myguy_uid.stdout }}"

    - name: Enable myguy's Podman API socket
      ansible.builtin.systemd:
        name: podman.socket
        scope: user
        enabled: yes
        state: started
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ myguy_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ myguy_runtime_dir }}/bus"

    - name: Create Quadlet directory for myguy
      ansible.builtin.file:
        path: /home/myguy/.config/containers/systemd
        state: directory
        owner: myguy
        group: myguy
        mode: "0755"

    - name: Write the podman-exporter Quadlet unit
      ansible.builtin.copy:
        dest: /home/myguy/.config/containers/systemd/podman-exporter.container
        owner: myguy
        group: myguy
        mode: "0644"
        content: |
          [Unit]
          Description=prometheus-podman-exporter (container metrics)

          [Container]
          ContainerName=podman-exporter
          Image=quay.io/navidys/prometheus-podman-exporter:v1.21.2
          # The image's own user can't open myguy's socket; container root is
          # myguy on the host (rootless), so this grants nothing more.
          User=0
          PublishPort={{ vpc_ip }}:9882:9882
          # %t is myguy's runtime directory
          Volume=%t/podman/podman.sock:/run/podman/podman.sock
          Environment=CONTAINER_HOST=unix:///run/podman/podman.sock
          PodmanArgs=--memory=64m --memory-swap=64m
          # Put the container name on every metric (no join needed)
          Exec=--collector.enhance-metrics

          [Service]
          Restart=always
          # Without a pause a failing start loops every second (seen: socket
          # permission denied), burning the app server's only CPU.
          RestartSec=30
          TimeoutStartSec=300

          [Install]
          WantedBy=default.target
      register: podman_exporter_unit

    - name: Start podman-exporter (restart when its unit changed)
      ansible.builtin.systemd:
        name: podman-exporter.service
        scope: user
        state: "{{ 'restarted' if podman_exporter_unit.changed else 'started' }}"
        daemon_reload: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ myguy_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ myguy_runtime_dir }}/bus"
