    - name: Write Visitors dashboard
      # Built from the nginx JSON access log (job="nginx_access").  Any unknown
      # path is answered with the app page, so scanners posing as browsers
      # would count as visitors; a visitor is therefore an IP whose browser
      # ran the app (downloaded /assets/*.js or made a successful API call).
      # Visitors are approximated by distinct client IP.
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/visitors.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Application Visitors",
            "uid": "visitors",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "stat",
                "title": "Visitors",
                "description": "IP addresses whose browser actually ran the app (downloaded its code or used it). Not people: a phone on mobile data changes IP often and counts again each time.",
                "gridPos": {
                  "x": 0,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "count(count by (remote_addr) (count_over_time({job=\"nginx_access\"} | json | uri =~ \"/assets/.*[.]js|/(api/v1|store/api/v1|chat/api/v1)/.*\" | status < 400 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range])))"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Signed-in IPs",
                "description": "IP addresses that loaded a signed-in profile (only a valid session gets one). One person on mobile data shows up as many IPs; the number of accounts lives in the database, not in these logs.",
                "gridPos": {
                  "x": 6,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "count(count by (remote_addr) (count_over_time({job=\"nginx_access\"} | json | uri = \"/api/v1/profile\" | status = 200 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range])))"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "App requests",
                "description": "Successful calls the app made to the backend, store and chat. A good measure of how much the app is used.",
                "gridPos": {
                  "x": 12,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | uri =~ \"/(api/v1|store/api/v1|chat/api/v1)/.*\" | status < 400 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range]))"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Server errors (5xx)",
                "description": "Requests the server failed to answer. Should be close to 0; see Service Logs for the cause.",
                "gridPos": {
                  "x": 18,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "decimals": 0,
                    "color": {
                      "mode": "thresholds"
                    },
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        }
                      ]
                    }
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | status >= 500 [$__range])) or vector(0)"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Visitors per hour",
                "gridPos": {
                  "x": 0,
                  "y": 5,
                  "w": 12,
                  "h": 8
                },
                "interval": "1h",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "custom": {
                      "drawStyle": "bars",
                      "fillOpacity": 60
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "legend": {
                    "showLegend": false
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "legendFormat": "visitors",
                    "expr": "count(count by (remote_addr) (count_over_time({job=\"nginx_access\"} | json | uri =~ \"/assets/.*[.]js|/(api/v1|store/api/v1|chat/api/v1)/.*\" | status < 400 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [1h])))"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "App requests per hour",
                "description": "Activity: how much the app was used each hour.",
                "gridPos": {
                  "x": 12,
                  "y": 5,
                  "w": 12,
                  "h": 8
                },
                "interval": "1h",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "custom": {
                      "drawStyle": "bars",
                      "fillOpacity": 60
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "legend": {
                    "showLegend": false
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "legendFormat": "requests",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | uri =~ \"/(api/v1|store/api/v1|chat/api/v1)/.*\" | status < 400 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [1h]))"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Pages opened directly",
                "description": "App pages loaded from a link, bookmark or refresh (moving around inside the app isn't counted). The home page includes scanners.",
                "gridPos": {
                  "x": 0,
                  "y": 13,
                  "w": 12,
                  "h": 10
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "decimals": 0
                  },
                  "overrides": [
                    {
                      "matcher": {
                        "id": "byName",
                        "options": "Count"
                      },
                      "properties": [
                        {
                          "id": "custom.cellOptions",
                          "value": {
                            "type": "gauge",
                            "mode": "basic",
                            "valueDisplayMode": "text"
                          }
                        },
                        {
                          "id": "color",
                          "value": {
                            "mode": "fixed",
                            "fixedColor": "blue"
                          }
                        },
                        {
                          "id": "custom.width",
                          "value": 220
                        }
                      ]
                    }
                  ]
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "sort_desc(topk(10, sum by (uri) (count_over_time({job=\"nginx_access\"} | json | method=\"GET\" | status < 400 | uri =~ \"/(dashboard|login|register|messages|profile(/[0-9]+)?|reviews(/[0-9]+|/create/[0-9]+)?|my-gigs(/(created|assigned|applications))?|store(/new|/[0-9]+|/requests/(new|[0-9]+))?|tasks(/create|/[0-9]+)?|(edit|posted)/(task|item|request)/[0-9]+)?/?\" | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range]))))"
                  }
                ],
                "options": {
                  "showHeader": true,
                  "cellHeight": "sm",
                  "sortBy": [
                    {
                      "displayName": "Count",
                      "desc": true
                    }
                  ]
                },
                "transformations": [
                  {
                    "id": "labelsToFields",
                    "options": {
                      "mode": "columns"
                    }
                  },
                  {
                    "id": "merge",
                    "options": {}
                  },
                  {
                    "id": "organize",
                    "options": {
                      "excludeByName": {
                        "Time": true
                      },
                      "renameByName": {
                        "uri": "Page",
                        "Value": "Count",
                        "Value #A": "Count"
                      }
                    }
                  }
                ]
              },
              {
                "type": "table",
                "title": "Top referrers",
                "description": "Sites people came from (links to the bare server IP, used by scanners, are left out). Includes your own domain for internal links.",
                "gridPos": {
                  "x": 12,
                  "y": 13,
                  "w": 12,
                  "h": 10
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "decimals": 0
                  },
                  "overrides": [
                    {
                      "matcher": {
                        "id": "byName",
                        "options": "Count"
                      },
                      "properties": [
                        {
                          "id": "custom.cellOptions",
                          "value": {
                            "type": "gauge",
                            "mode": "basic",
                            "valueDisplayMode": "text"
                          }
                        },
                        {
                          "id": "color",
                          "value": {
                            "mode": "fixed",
                            "fixedColor": "blue"
                          }
                        },
                        {
                          "id": "custom.width",
                          "value": 220
                        }
                      ]
                    }
                  ]
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "sort_desc(topk(10, sum by (referer) (count_over_time({job=\"nginx_access\"} | json | method=\"GET\" | status < 400 | uri =~ \"/(dashboard|login|register|messages|profile(/[0-9]+)?|reviews(/[0-9]+|/create/[0-9]+)?|my-gigs(/(created|assigned|applications))?|store(/new|/[0-9]+|/requests/(new|[0-9]+))?|tasks(/create|/[0-9]+)?|(edit|posted)/(task|item|request)/[0-9]+)?/?\" | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" | referer != \"\" | referer !~ \"https?://[0-9.]+([:/].*)?\" [$__range]))))"
                  }
                ],
                "options": {
                  "showHeader": true,
                  "cellHeight": "sm",
                  "sortBy": [
                    {
                      "displayName": "Count",
                      "desc": true
                    }
                  ]
                },
                "transformations": [
                  {
                    "id": "labelsToFields",
                    "options": {
                      "mode": "columns"
                    }
                  },
                  {
                    "id": "merge",
                    "options": {}
                  },
                  {
                    "id": "organize",
                    "options": {
                      "excludeByName": {
                        "Time": true
                      },
                      "renameByName": {
                        "referer": "Referrer",
                        "Value": "Count",
                        "Value #A": "Count"
                      }
                    }
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Responses by status",
                "description": "Every response nginx sent, by status code (200 OK, 304 unchanged, 404 not found, 5xx failed). Includes scanners.",
                "gridPos": {
                  "x": 0,
                  "y": 23,
                  "w": 24,
                  "h": 8
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "targets": [
                  {
                    "refId": "A",
                    "legendFormat": "{{status}}",
                    "expr": "sum by (status) (count_over_time({job=\"nginx_access\"} | json [$__interval]))"
                  }
                ]
              }
            ],
            "time": {
              "from": "now-7d",
              "to": "now"
            },
            "refresh": "5m"
          }
      become: yes

    - name: Write Slow Requests dashboard
      # From the nginx JSON access log's request_time (8 days in Loki).
      # "Real" requests: a method (malformed connections have none) and not
      # the long-lived chat socket.  Replaces Tempo's slow-request table.
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/slow-requests.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Slow Requests",
            "uid": "slow-requests",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "stat",
                "title": "Requests over 0.5 s",
                "description": "Real requests (malformed connections and chat sockets left out) that took longer than half a second, in the selected range.",
                "gridPos": {
                  "x": 0,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "decimals": 0,
                    "color": {
                      "mode": "thresholds"
                    },
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        },
                        {
                          "color": "red",
                          "value": 50
                        }
                      ]
                    }
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | method != \"\" | uri !~ \"/socket\\\\.io.*\" | request_time > 0.5 [$__range])) or vector(0)"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Typical request (median)",
                "gridPos": {
                  "x": 6,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "s",
                    "decimals": 3,
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "quantile_over_time(0.5, {job=\"nginx_access\"} | json | method != \"\" | uri !~ \"/socket\\\\.io.*\" | unwrap request_time | __error__=\"\" [$__range]) by (job)"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Slowest 5% (p95)",
                "description": "95% of requests finished within this time.",
                "gridPos": {
                  "x": 12,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "s",
                    "decimals": 3,
                    "color": {
                      "mode": "thresholds"
                    },
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 0.5
                        },
                        {
                          "color": "red",
                          "value": 2
                        }
                      ]
                    }
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "quantile_over_time(0.95, {job=\"nginx_access\"} | json | method != \"\" | uri !~ \"/socket\\\\.io.*\" | unwrap request_time | __error__=\"\" [$__range]) by (job)"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Slowest 1% (p99)",
                "gridPos": {
                  "x": 18,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "s",
                    "decimals": 3,
                    "color": {
                      "mode": "thresholds"
                    },
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        },
                        {
                          "color": "red",
                          "value": 5
                        }
                      ]
                    }
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "quantile_over_time(0.99, {job=\"nginx_access\"} | json | method != \"\" | uri !~ \"/socket\\\\.io.*\" | unwrap request_time | __error__=\"\" [$__range]) by (job)"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Response time",
                "description": "Median, p95 and p99 per interval.",
                "gridPos": {
                  "x": 0,
                  "y": 5,
                  "w": 16,
                  "h": 8
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "s",
                    "min": 0,
                    "custom": {
                      "lineWidth": 2,
                      "fillOpacity": 0
                    }
                  }
                },
                "options": {
                  "legend": {
                    "showLegend": true
                  },
                  "tooltip": {
                    "mode": "multi"
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "legendFormat": "median",
                    "expr": "quantile_over_time(0.5, {job=\"nginx_access\"} | json | method != \"\" | uri !~ \"/socket\\\\.io.*\" | unwrap request_time | __error__=\"\" [$__interval]) by (job)"
                  },
                  {
                    "refId": "B",
                    "legendFormat": "p95",
                    "expr": "quantile_over_time(0.95, {job=\"nginx_access\"} | json | method != \"\" | uri !~ \"/socket\\\\.io.*\" | unwrap request_time | __error__=\"\" [$__interval]) by (job)"
                  },
                  {
                    "refId": "C",
                    "legendFormat": "p99",
                    "expr": "quantile_over_time(0.99, {job=\"nginx_access\"} | json | method != \"\" | uri !~ \"/socket\\\\.io.*\" | unwrap request_time | __error__=\"\" [$__interval]) by (job)"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Slow requests per hour",
                "gridPos": {
                  "x": 16,
                  "y": 5,
                  "w": 8,
                  "h": 8
                },
                "interval": "1h",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "decimals": 0,
                    "min": 0,
                    "custom": {
                      "drawStyle": "bars",
                      "fillOpacity": 60
                    }
                  }
                },
                "options": {
                  "legend": {
                    "showLegend": false
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "legendFormat": "slow requests",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | method != \"\" | uri !~ \"/socket\\\\.io.*\" | request_time > 0.5 [1h]))"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Slowest endpoints",
                "description": "Average time per path in the selected range. Paths with ids count separately.",
                "gridPos": {
                  "x": 0,
                  "y": 13,
                  "w": 10,
                  "h": 10
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "s",
                    "decimals": 3
                  },
                  "overrides": [
                    {
                      "matcher": {
                        "id": "byName",
                        "options": "Average"
                      },
                      "properties": [
                        {
                          "id": "custom.cellOptions",
                          "value": {
                            "type": "gauge",
                            "mode": "basic",
                            "valueDisplayMode": "text"
                          }
                        },
                        {
                          "id": "color",
                          "value": {
                            "mode": "fixed",
                            "fixedColor": "orange"
                          }
                        },
                        {
                          "id": "custom.width",
                          "value": 220
                        }
                      ]
                    }
                  ]
                },
                "options": {
                  "showHeader": true,
                  "cellHeight": "sm",
                  "sortBy": [
                    {
                      "displayName": "Average",
                      "desc": true
                    }
                  ]
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "topk(10, avg_over_time({job=\"nginx_access\"} | json | method != \"\" | uri !~ \"/socket\\\\.io.*\" | unwrap request_time | __error__=\"\" [$__range]) by (uri))"
                  }
                ],
                "transformations": [
                  {
                    "id": "labelsToFields",
                    "options": {
                      "mode": "columns"
                    }
                  },
                  {
                    "id": "merge",
                    "options": {}
                  },
                  {
                    "id": "organize",
                    "options": {
                      "excludeByName": {
                        "Time": true
                      },
                      "renameByName": {
                        "uri": "Path",
                        "Value": "Average",
                        "Value #A": "Average"
                      }
                    }
                  }
                ]
              },
              {
                "type": "logs",
                "title": "Requests over 0.5 s",
                "description": "Newest first: duration, status, method and path. Status 499: the visitor gave up; 504: the server behind nginx didn't answer in time.",
                "gridPos": {
                  "x": 10,
                  "y": 13,
                  "w": 14,
                  "h": 10
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "options": {
                  "showTime": true,
                  "wrapLogMessage": false,
                  "sortOrder": "Descending",
                  "enableLogDetails": true
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "{job=\"nginx_access\"} | json | method != \"\" | uri !~ \"/socket\\\\.io.*\" | request_time > 0.5 | line_format \"{{.request_time}}s  {{.status}}  {{.method}} {{.uri}}\""
                  }
                ]
              }
            ],
            "time": {
              "from": "now-24h",
              "to": "now"
            },
            "refresh": "5m"
          }
      become: yes

    - name: Write Service Logs dashboard
      # Container output shipped by Promtail (job="containers"), labelled by
      # compose service and stream (stdout / stderr).
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/service-logs.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Service Logs",
            "uid": "service-logs",
            "schemaVersion": 36,
            "templating": { "list": [
              { "name": "service", "label": "Service", "type": "query",
                "datasource": { "type": "loki", "uid": "loki" },
                "query": "label_values({job=\"containers\"}, service)",
                "includeAll": true, "multi": true, "allValue": ".+",
                "current": { "text": "All", "value": "$__all" }, "refresh": 2 },
              { "name": "search", "label": "Search", "type": "textbox", "query": "" }
            ] },
            "panels": [
              {
                "type": "timeseries",
                "title": "Log lines per service",
                "description": "How much each service is logging. A sudden spike often means something is failing in a loop.",
                "gridPos": { "x": 0, "y": 0, "w": 12, "h": 7 },
                "datasource": { "type": "loki", "uid": "loki" },
                "fieldConfig": { "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } } } },
                "targets": [ { "refId": "A", "legendFormat": "{{service}}",
                  "expr": "sum by (service) (count_over_time({job=\"containers\", service=~\"$service\"} [$__interval]))" } ]
              },
              {
                "type": "timeseries",
                "title": "Error output per service",
                "description": "Lines written to stderr, plus any line mentioning error or panic. Some services log normal startup messages to stderr too.",
                "gridPos": { "x": 12, "y": 0, "w": 12, "h": 7 },
                "datasource": { "type": "loki", "uid": "loki" },
                "fieldConfig": { "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } } } },
                "targets": [ { "refId": "A", "legendFormat": "{{service}}",
                  "expr": "sum by (service) (count_over_time({job=\"containers\", service=~\"$service\"} |~ \"(?i)(error|panic|fatal)\" [$__interval]))" } ]
              },
              {
                "type": "logs",
                "title": "Logs",
                "description": "Newest first. Pick services and type in Search at the top to filter.",
                "gridPos": { "x": 0, "y": 7, "w": 24, "h": 16 },
                "datasource": { "type": "loki", "uid": "loki" },
                "options": { "showLabels": false, "showCommonLabels": false, "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true },
                "targets": [ { "refId": "A",
                  "expr": "{job=\"containers\", service=~\"$service\"} |~ \"(?i)$search\"" } ]
              }
            ],
            "time": { "from": "now-6h", "to": "now" },
            "refresh": "1m"
          }
      become: yes

    # --- Jaeger ---

    - name: Write Investigate IP dashboard
      # Everything one IP did, from the logs (type it in the box).  The terminal
      # version is `investigate <IP>` on this server (myguy-security).
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/investigate-ip.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Investigate IP",
            "uid": "investigate-ip",
            "schemaVersion": 36,
            "time": {
              "from": "now-24h",
              "to": "now"
            },
            "templating": {
              "list": [
                {
                  "type": "textbox",
                  "name": "ip",
                  "label": "IP address",
                  "query": "",
                  "current": {
                    "text": "",
                    "value": ""
                  }
                }
              ]
            },
            "panels": [
              {
                "type": "text",
                "title": "",
                "gridPos": {
                  "x": 0,
                  "y": 0,
                  "w": 24,
                  "h": 3
                },
                "options": {
                  "mode": "markdown",
                  "content": "Type an IP above to see everything it did in the time range (Loki keeps 8 days). The same report in a terminal on the monitoring server: `investigate <IP> --hours 48`. Before banning, check **Signed in from this IP**: above 0 means a real person used it (mobile carriers share IPs). Ban for 7 days: `ssh ops@<app IP> 'sudo fail2ban-client set manual banip <IP>'`; unban: `... set manual unbanip <IP>`."
                }
              },
              {
                "type": "stat",
                "title": "Requests",
                "description": "Every request from this IP in the range.",
                "gridPos": {
                  "x": 0,
                  "y": 3,
