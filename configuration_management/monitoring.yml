                  }
                ],
                "options": {
                  "sortBy": [
                    {
                      "displayName": "Value #A",
                      "desc": true
                    }
                  ]
                }
              },
              {
                "type": "logs",
                "title": "Security check alerts",
                "description": "What the security checks reported (they run every 5 minutes; 'check ok' heartbeats hidden).",
                "gridPos": {
                  "x": 12,
                  "y": 11,
                  "w": 12,
                  "h": 9
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "{job=\"security-checks\"} != \"check ok\""
                  }
                ],
                "options": {
                  "showTime": true,
                  "wrapLogMessage": true,
                  "sortOrder": "Descending"
                }
              },
              {
                "type": "logs",
                "title": "SSH logins",
                "description": "Every login on both servers (host label). myguy is the deploy; ops is you.",
                "gridPos": {
                  "x": 0,
                  "y": 20,
                  "w": 12,
                  "h": 8
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "{job=\"ssh\"} |= \"Accepted\""
                  }
                ],
                "options": {
                  "showTime": true,
                  "wrapLogMessage": true,
                  "sortOrder": "Descending"
                }
              },
              {
                "type": "logs",
                "title": "sudo by people",
                "description": "Commands run with sudo, except the deploy's own (myguy).",
                "gridPos": {
                  "x": 12,
                  "y": 20,
                  "w": 12,
                  "h": 8
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "{job=\"sudo\"} !~ \"^\\\\s*myguy :\""
                  }
                ],
                "options": {
                  "showTime": true,
                  "wrapLogMessage": true,
                  "sortOrder": "Descending"
                }
              },
              {
                "type": "logs",
                "title": "Falco events",
                "description": "Runtime alerts on the app server.",
                "gridPos": {
                  "x": 0,
                  "y": 28,
                  "w": 12,
                  "h": 8
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "{job=\"falco\"} | json | line_format \"{{.priority}} · {{.rule}} · {{.output_fields_proc_name}} in {{.output_fields_container_name}}\""
                  }
                ],
                "options": {
                  "showTime": true,
                  "wrapLogMessage": true,
                  "sortOrder": "Descending"
                }
              },
              {
                "type": "logs",
                "title": "Deploys",
                "description": "Start and end of each deploy (the workflow writes them).",
                "gridPos": {
                  "x": 12,
                  "y": 28,
                  "w": 12,
                  "h": 8
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "{job=\"deploy\"}"
                  }
                ],
                "options": {
                  "showTime": true,
                  "wrapLogMessage": true,
                  "sortOrder": "Descending"
                }
              }
            ]
          }
      notify: restart grafana
      become: yes

    - name: Create Jaeger config directory
      ansible.builtin.file:
        path: /etc/jaeger
        state: directory
        mode: "0755"
      become: yes

    - name: Write Jaeger config
      ansible.builtin.copy:
        src: files/jaeger.yml
        dest: /etc/jaeger/jaeger.yml
        mode: "0644"
      notify: restart jaeger
      become: yes

    # --- Loki ---

    - name: Create Loki config directory
      ansible.builtin.file:
        path: /etc/loki
        state: directory
        mode: "0755"
      become: yes

    - name: Write Loki config
      ansible.builtin.copy:
        dest: /etc/loki/loki-config.yml
        mode: "0644"
        content: |
          auth_enabled: false

          server:
            http_listen_port: 3100

          common:
            path_prefix: /loki
            storage:
              filesystem:
                chunks_directory: /loki/chunks
                rules_directory: /loki/rules
            replication_factor: 1
            ring:
              instance_addr: 127.0.0.1
              kvstore:
                store: inmemory

          schema_config:
            configs:
              - from: 2020-10-24
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          limits_config:
            # Unique-visitor queries create one series per client IP.
            max_query_series: 50000
            # Access logs contain client IPs; keep them 8 days (the
            # dashboards look back 7 at most).
            retention_period: 192h

          compactor:
            working_directory: /loki/compactor
            shared_store: filesystem
            retention_enabled: true

          analytics:
            reporting_enabled: false
      notify: restart loki
      become: yes

    # --- Containers (Podman Quadlet) ---
    # Runs after all config files above are written.  Each container is a
    # rootless systemd user service generated from a .container file; Quadlet
    # runs `podman run --replace`, so containers left from earlier deploys
    # with the same name are replaced rather than conflicting.

    - name: Remove legacy podman-generate-systemd units
      # Superseded by Quadlet; these units fail to start against a container
      # that is already running.
      ansible.builtin.file:
        path: "{{ user_systemd_dir }}/{{ item[0] }}container-{{ item[1].name }}.service"
        state: absent
      loop: "{{ ['', 'default.target.wants/'] | product(monitoring_containers) | list }}"
      loop_control:
        label: "{{ item[0] }}container-{{ item[1].name }}.service"
      become: yes
      become_user: myguy

    - name: Create Quadlet directory for myguy
      ansible.builtin.file:
        path: "{{ quadlet_dir }}"
        state: directory
        owner: myguy
        group: myguy
        mode: "0755"
      become: yes

    - name: Write Quadlet container units
      ansible.builtin.copy:
        dest: "{{ quadlet_dir }}/{{ item.name }}.container"
        owner: myguy
        group: myguy
        mode: "0644"
        content: |
          [Unit]
          Description={{ item.name }} (monitoring)
          {% if item.part_of is defined %}
          Requires={{ item.part_of }}.service
          After={{ item.part_of }}.service
          PartOf={{ item.part_of }}.service
          {% endif %}

          [Container]
          ContainerName={{ item.name }}
          Image={{ item.image }}
          {% for port in item.ports | default([]) %}
          PublishPort={{ port }}
          {% endfor %}
          {% for volume in item.volumes | default([]) %}
          Volume={{ volume }}
          {% endfor %}
          {% for key, value in (item.env | default({})).items() %}
          Environment={{ key }}={{ value }}
          {% endfor %}
          {% if item.network is defined %}
          Network={{ item.network }}
          {% endif %}
          {% if item.env_file is defined %}
          EnvironmentFile={{ item.env_file }}
          {% endif %}
          {% if item.user is defined %}
          User={{ item.user }}
          {% endif %}
          {% if item.memory is defined %}
          PodmanArgs=--memory={{ item.memory }} --memory-swap={{ item.memory }}
          {% endif %}
          {% if item.exec is defined %}
          Exec={{ item.exec }}
          {% endif %}

          [Service]
          Restart=always
          # Pause before restarting: a container killed at its memory limit
          # otherwise restarts at once, over and over, on this 1-CPU server.
          RestartSec=10
          # First start pulls the image, which can exceed the 90s default.
          TimeoutStartSec=900

          [Install]
          WantedBy=default.target
      loop: "{{ monitoring_containers }}"
      loop_control:
        label: "{{ item.name }}"
      register: quadlet_units
      become: yes

    # Retired: Zipkin (replaced by Tempo), Umami (removed to fit this 1 GB
    # server) and Tempo (replaced by Jaeger, which needs a fraction of it).  Their volumes (umami-db-data, tempo-data) are
    # kept; `podman volume rm <name>` as myguy deletes one for good.
    - name: Stop retired containers
      ansible.builtin.systemd:
        name: "{{ item }}.service"
        state: stopped
        scope: user
      loop: [zipkin, umami, umami-db, tempo]
      failed_when: false
      become: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ xdg_runtime_dir }}/bus"

    - name: Remove retired Quadlet units
      ansible.builtin.file:
        path: "{{ quadlet_dir }}/{{ item }}.container"
        state: absent
      loop: [zipkin, umami, umami-db, tempo]
      become: yes

    - name: Remove retired containers
      # A stopped unit can leave its container behind (Umami's stayed as
      # "Created").  umami goes before umami-db, which it depends on.
      ansible.builtin.command:
        cmd: podman rm -f {{ item }}
      loop: [zipkin, tempo, umami, umami-db]
      register: retired_rm
      changed_when: retired_rm.rc == 0
      failed_when: false
      become: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: Remove retired settings, the Tempo datasource and the Traces dashboard
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/umami
        - /etc/tempo
        - /etc/grafana/provisioning/datasources/tempo.yml
        - /etc/grafana/dashboards/traces.json
      notify: restart grafana
      become: yes

    - name: Start monitoring containers (restart those whose unit changed)
      # Quadlet services are generated, so they cannot be `enabled`; the
      # [Install] section above makes them start at boot instead.
      ansible.builtin.systemd:
        name: "{{ item.item.name }}.service"
        state: "{{ 'restarted' if item.changed else 'started' }}"
        daemon_reload: yes
        scope: user
      loop: "{{ quadlet_units.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      become: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ xdg_runtime_dir }}/bus"

    # Second layer behind the firewall: no port of ours may listen on every
    # address, or a firewall mistake would expose it.  Each names vpc_ip.
    - name: Check no monitoring port listens on every address
      ansible.builtin.shell:
        cmd: >-
          ss -Hltn | awk '{print $4}'
          | grep -E '^(0\.0\.0\.0|\*|\[::\]):(3000|3100|4318|8888|9090|9100|9115|16686)$' || true
      register: open_listeners
      changed_when: false
      failed_when: open_listeners.stdout | length > 0

    # Prometheus reaches this server's exporters on the VPC address now, not
    # host.containers.internal; every local target must answer there.
    - name: Check Prometheus scrapes this server's targets
      ansible.builtin.uri:
        url: "http://{{ vpc_ip }}:9090/api/v1/targets?state=active"
        return_content: yes
      register: prometheus_targets
      vars:
        local_health: >-
          {{ prometheus_targets.json.data.activeTargets
             | selectattr('scrapeUrl', 'search', '//' ~ vpc_ip ~ ':')
             | map(attribute='health') | list }}
      until: >-
        prometheus_targets.json is defined and local_health | length > 0
        and local_health | reject('equalto', 'up') | list | length == 0
      retries: 12
      delay: 10

    # --- Security checks and summaries (files/myguy_security.py) ---
    # Every 5 minutes: attacking IPs that need a decision and unexpected SSH
    # logins go to Telegram ("check ok" is the heartbeat Grafana watches).
    # 08:00 Amsterdam time: the daily summary, plus the weekly on Saturdays.
    # `investigate <IP>` gives anyone on this server the same view of an IP.

    - name: Install the security checks
      ansible.builtin.copy:
        src: files/myguy_security.py
        dest: /usr/local/bin/myguy-security
        mode: "0755"
      become: yes

    - name: Install the investigate command
      ansible.builtin.copy:
        dest: /usr/local/bin/investigate
        mode: "0755"
        content: |
          #!/bin/sh
          # Everything one IP did, from the logs: investigate <IP> [--hours N]
          exec /usr/local/bin/myguy-security investigate "$@"
      become: yes

    - name: Create the security checks' settings directory
      ansible.builtin.file:
        path: /etc/myguy-security
        state: directory
        mode: "0755"
      become: yes

    - name: Write the security checks' settings
      ansible.builtin.copy:
        dest: /etc/myguy-security/settings.env
        mode: "0644"
        content: |
          LOKI_URL=http://{{ vpc_ip }}:3100
          PROMETHEUS_URL=http://{{ vpc_ip }}:9090
          APP_SSH_HOST={{ groups['app'][0] }}
          APP_VPC_IP={{ instance_vpc_ip }}
      become: yes

    # Only the Telegram values, not grafana.env (it holds the admin password)
    - name: Write the security checks' Telegram settings
      ansible.builtin.copy:
        dest: /etc/myguy-security/telegram.env
        mode: "0600"
        content: |
          TELEGRAM_BOT_TOKEN={{ telegram_bot_token | default('') }}
          TELEGRAM_CHAT_ID={{ telegram_chat_id | default('') }}
      no_log: true
      become: yes

    - name: Write the security checks' systemd units
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.key }}"
        mode: "0644"
        content: "{{ item.value }}"
      loop: "{{ security_units | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        security_units:
          myguy-security-check.service: |
            [Unit]
            Description=MyGuy security checks (attacks, SSH logins)

            [Service]
            ExecStart=/usr/local/bin/myguy-security check
            Type=oneshot
            EnvironmentFile=-/etc/myguy-security/telegram.env
            # One dynamic user for both units, so they share the state
            DynamicUser=yes
            User=myguy-security
            StateDirectory=myguy-security
            SyslogIdentifier=myguy-security
            NoNewPrivileges=yes
            ProtectSystem=strict
            ProtectHome=yes
            PrivateTmp=yes
            MemoryMax=128M
            TimeoutStartSec=300

          myguy-security-check.timer: |
            [Unit]
            Description=MyGuy security checks every 5 minutes

            [Timer]
            OnCalendar=*:0/5
            AccuracySec=30s

            [Install]
            WantedBy=timers.target
          myguy-security-summary.service: |
            [Unit]
            Description=MyGuy daily summary (and weekly on Saturdays)

            [Service]
            ExecStart=/usr/local/bin/myguy-security summary
            Type=oneshot
            EnvironmentFile=-/etc/myguy-security/telegram.env
            # One dynamic user for both units, so they share the state
            DynamicUser=yes
            User=myguy-security
            StateDirectory=myguy-security
            SyslogIdentifier=myguy-security
            NoNewPrivileges=yes
            ProtectSystem=strict
            ProtectHome=yes
            PrivateTmp=yes
            MemoryMax=128M
            TimeoutStartSec=300

          myguy-security-summary.timer: |
            [Unit]
            Description=MyGuy summaries at 08:00 Amsterdam time

            [Timer]
            OnCalendar=*-*-* 08:00:00 Europe/Amsterdam
            # Sent at boot if the server was off at 08:00
            Persistent=true

            [Install]
            WantedBy=timers.target
      become: yes

    - name: Start the security check and summary timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
        daemon_reload: yes
      loop: [myguy-security-check.timer, myguy-security-summary.timer]
      become: yes

    # GF_SECURITY_ADMIN_PASSWORD only applies when Grafana creates its
    # database; resetting keeps the secret authoritative after that too.
    - name: Set the Grafana admin password from the secret
      ansible.builtin.command:
        cmd: podman exec -i grafana grafana cli admin reset-admin-password --password-from-stdin
        stdin: "{{ grafana_admin_password }}"
      register: grafana_password_reset
      until: grafana_password_reset.rc == 0
      retries: 10
      delay: 3
      changed_when: false
      no_log: true
      become: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    # --- Old images ---
    # Remove every image no container uses (retired services, replaced
    # versions); the running ones keep theirs.  Before/after in the log.

    - name: Measure Podman disk use before cleanup
      ansible.builtin.command:
        cmd: podman system df
      register: podman_df_before
      changed_when: false
      become: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: Remove images no container uses
      ansible.builtin.command:
        cmd: podman image prune --all --force
      register: image_prune
      changed_when: image_prune.stdout | trim | length > 0
      become: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: Measure Podman disk use after cleanup
      ansible.builtin.command:
        cmd: podman system df
      register: podman_df_after
      changed_when: false
      become: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: Report image cleanup
      ansible.builtin.debug:
        msg: "{{ ['Before:'] + podman_df_before.stdout_lines + ['After (' ~ (image_prune.stdout_lines | length) ~ ' images removed):'] + podman_df_after.stdout_lines }}"

    - name: Reload Prometheus config
      ansible.builtin.command:
        cmd: podman kill --signal HUP prometheus
      changed_when: false
      failed_when: false
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
