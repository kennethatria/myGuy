    - name: Write Traces dashboard
      # Tempo search (TraceQL) tables; a trace ID opens the trace view.
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/traces.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Traces",
            "uid": "traces",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "stat",
                "title": "Tempo running",
                "description": "Whether Prometheus can reach Tempo. If this is Down, empty trace lists mean nothing.",
                "gridPos": {
                  "x": 0,
                  "y": 0,
                  "w": 8,
                  "h": 5
                },
                "datasource": {
                  "type": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "mappings": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "Down",
                            "color": "red"
                          },
                          "1": {
                            "text": "Running",
                            "color": "green"
                          }
                        }
                      }
                    ],
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": 1
                        }
                      ]
                    }
                  }
                },
                "options": {
                  "colorMode": "background",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "max(up{job=\"tempo\"}) or vector(0)",
                    "instant": true
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Spans received (last hour)",
                "description": "Steps of requests the services sent to Tempo in the last hour. 0 while people use the site means tracing is broken.",
                "gridPos": {
                  "x": 8,
                  "y": 0,
                  "w": 16,
                  "h": 5
                },
                "datasource": {
                  "type": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "decimals": 0,
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "area",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum(increase(tempo_distributor_spans_received_total[1h])) or vector(0)"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Failed requests",
                "description": "Requests that ended in an error, newest first. Click a trace ID to see every step and where it failed.",
                "gridPos": {
                  "x": 0,
                  "y": 5,
                  "w": 24,
                  "h": 9
                },
                "datasource": {
                  "type": "tempo",
                  "uid": "tempo"
                },
                "targets": [
                  {
                    "refId": "A",
                    "datasource": {
                      "type": "tempo",
                      "uid": "tempo"
                    },
                    "queryType": "traceql",
                    "query": "{ status = error }",
                    "limit": 20,
                    "tableType": "traces"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Slow requests (over 500 ms)",
                "description": "Requests that took longer than half a second. Click a trace ID to see which step was slow.",
                "gridPos": {
                  "x": 0,
                  "y": 14,
                  "w": 24,
                  "h": 9
                },
                "datasource": {
                  "type": "tempo",
                  "uid": "tempo"
                },
                "targets": [
                  {
                    "refId": "A",
                    "datasource": {
                      "type": "tempo",
                      "uid": "tempo"
                    },
                    "queryType": "traceql",
                    "query": "{ kind = server && duration > 500ms }",
                    "limit": 20,
                    "tableType": "traces"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Recent requests",
                "description": "The latest requests handled by the backend, store and chat services.",
                "gridPos": {
                  "x": 0,
                  "y": 23,
                  "w": 24,
                  "h": 9
                },
                "datasource": {
                  "type": "tempo",
                  "uid": "tempo"
                },
                "targets": [
                  {
                    "refId": "A",
                    "datasource": {
                      "type": "tempo",
                      "uid": "tempo"
                    },
                    "queryType": "traceql",
                    "query": "{ kind = server }",
                    "limit": 20,
                    "tableType": "traces"
                  }
                ]
              }
            ],
            "time": {
              "from": "now-24h",
              "to": "now"
            },
            "refresh": "1m"
          }
      become: yes

    - name: Write Falco security alerts dashboard
      # Falco (0.38+) exports rule hits as falcosecurity_falco_rules_matches_total,
      # a series that only appears once a rule first fires, so the stat falls
      # back to 0 and "Falco running" shows the 0 is real, not a dead scrape.
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/falco.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Falco Security Alerts",
            "uid": "falco-alerts",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "stat",
                "title": "Falco running",
                "description": "Whether Prometheus can reach Falco on the app server. If this is Down, an alert count of 0 means nothing.",
                "gridPos": { "x": 0, "y": 0, "w": 8, "h": 5 },
                "fieldConfig": { "defaults": {
                  "mappings": [ { "type": "value", "options": {
                    "0": { "text": "Down", "color": "red" }, "1": { "text": "Running", "color": "green" } } } ],
                  "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } } },
                "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
                "targets": [ { "refId": "A", "expr": "max(up{job=\"falco\"}) or vector(0)" } ]
              },
              {
                "type": "stat",
                "title": "Alerts in this time range",
                "description": "Suspicious activity Falco caught on the app server (unexpected shells, sensitive file reads, privilege changes). 0 is normal.",
                "gridPos": { "x": 8, "y": 0, "w": 16, "h": 5 },
                "fieldConfig": { "defaults": { "decimals": 0,
                  "thresholds": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 10 } ] } } },
                "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
                "targets": [ { "refId": "A", "instant": true,
                  "expr": "sum(increase(falcosecurity_falco_rules_matches_total[$__range])) or vector(0)" } ]
              },
              {
                "type": "timeseries",
                "title": "Alerts by rule",
                "description": "Which Falco rules fired and when. Empty means no alerts.",
                "gridPos": { "x": 0, "y": 5, "w": 24, "h": 9 },
                "fieldConfig": { "defaults": { "decimals": 0, "noValue": "No alerts",
                  "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } } } },
                "targets": [ { "refId": "A", "legendFormat": "{{priority}} · {{rule_name}}",
                  "expr": "sum by (priority, rule_name) (increase(falcosecurity_falco_rules_matches_total[$__interval]))" } ]
              }
            ],
            "time": { "from": "now-24h", "to": "now" },
            "refresh": "1m"
          }
      become: yes

    - name: Write WAF dashboard
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/waf-modsecurity.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "WAF - ModSecurity Detections",
            "uid": "waf-modsecurity",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "logs",
                "title": "Recent Detections",
                "gridPos": { "x": 0, "y": 0, "w": 24, "h": 10 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "expr": "{job=\"modsecurity\"} |~ \"ModSecurity: Warning\"",
