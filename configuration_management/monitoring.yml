# monitoring.yml - Install Zipkin, Prometheus, Grafana, and Loki on the monitoring instance
#
# Runs as myguy (inventory ansible_user).  System tasks (apt, file writes under
# /etc/) carry explicit become: yes.  Podman containers run rootlessly as myguy
# so a container escape stays confined to the myguy user.

---
- name: Configure monitoring instance
  hosts: monitoring
  # No play-level become: each task declares its own privilege requirement.

  vars:
    # Run as rootless Podman Quadlet units owned by myguy: systemd starts,
    # restarts and boots each container (linger is enabled in users.yml).
    monitoring_containers:
      - name: zipkin
        image: docker.io/openzipkin/zipkin
        ports: ["9411:9411"]
      - name: prometheus
        image: docker.io/prom/prometheus:latest
        ports: ["9090:9090"]
        volumes:
          - /etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - name: grafana
        image: docker.io/grafana/grafana:latest
        ports: ["3000:3000"]
        volumes:
          - /etc/grafana/provisioning:/etc/grafana/provisioning:ro
          - /etc/grafana/dashboards:/etc/grafana/dashboards:ro
        env:
          GF_AUTH_ANONYMOUS_ENABLED: "false"
          GF_SERVER_HTTP_ADDR: "0.0.0.0"
      - name: loki
        image: docker.io/grafana/loki:2.9.10
        ports: ["3100:3100"]
        volumes:
          - /etc/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
          - loki-data:/loki
        exec: -config.file=/etc/loki/loki-config.yml
      # Umami web analytics.  Umami joins umami-db's network namespace so it
      # reaches Postgres on localhost without depending on Podman DNS; the
      # Umami port (3000 in-container) is therefore published on umami-db.
      # Only the tracker endpoints are public, via nginx on the app instance.
      - name: umami-db
        image: docker.io/library/postgres:16-alpine
        ports: ["3001:3000"]
        volumes:
          - umami-db-data:/var/lib/postgresql/data
        env_file: /etc/umami/umami.env
      - name: umami
        image: ghcr.io/umami-software/umami:postgresql-latest
        network: container:umami-db
        env_file: /etc/umami/umami.env
        # Restart with the database: a new umami-db means a new namespace.
        part_of: umami-db

  handlers:
    - name: restart grafana
      ansible.builtin.command:
        cmd: podman restart grafana
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false

    - name: restart loki
      ansible.builtin.command:
        cmd: podman restart loki
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false

  pre_tasks:
    - name: Get myguy user ID for XDG_RUNTIME_DIR
      ansible.builtin.command:
        cmd: id -u myguy
      register: app_user_uid_result
      changed_when: false

    - name: Set XDG_RUNTIME_DIR fact
      ansible.builtin.set_fact:
        app_user_uid: "{{ app_user_uid_result.stdout }}"
        xdg_runtime_dir: "/run/user/{{ app_user_uid_result.stdout }}"
        user_systemd_dir: "/home/myguy/.config/systemd/user"
        quadlet_dir: "/home/myguy/.config/containers/systemd"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      become: yes

    - name: Enable universe repository
      ansible.builtin.apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_facts['distribution_release'] }} universe"
        state: present
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    - name: Update apt cache after enabling universe
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    - name: Install Podman
      ansible.builtin.apt:
        name: podman
        state: present
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    - name: Create user systemd directory for myguy
      ansible.builtin.file:
        path: "{{ user_systemd_dir }}"
        state: directory
        owner: myguy
        group: myguy
        mode: "0755"
      become: yes

    - name: Set zipkin_url fact for use by other plays
      ansible.builtin.set_fact:
        zipkin_url: "http://{{ ansible_host }}:9411/api/v2/spans"

    # --- Prometheus ---

    - name: Create Prometheus config directory
      ansible.builtin.file:
        path: /etc/prometheus
        state: directory
        mode: "0755"
      become: yes

    - name: Write Prometheus config
      ansible.builtin.copy:
        dest: /etc/prometheus/prometheus.yml
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: node_exporter
              static_configs:
                - targets: ['{{ instance_vpc_ip }}:{{ node_exporter_port }}']
                  labels:
                    instance: app

            - job_name: falco
              static_configs:
                - targets: ['{{ instance_vpc_ip }}:{{ falco_metrics_port }}']
                  labels:
                    instance: app
      become: yes

    # --- Grafana provisioning files ---

    - name: Create Grafana provisioning directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/grafana/provisioning/datasources
        - /etc/grafana/provisioning/dashboards
        - /etc/grafana/dashboards
      become: yes

    - name: Write Grafana Prometheus datasource
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://host.containers.internal:9090
              isDefault: true
      notify: restart grafana
      become: yes

    - name: Write Grafana Loki datasource
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/loki.yml
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://host.containers.internal:3100
              isDefault: false
      notify: restart grafana
      become: yes

    - name: Write Grafana dashboard provisioning config
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/dashboards/default.yml
        mode: "0644"
        content: |
          apiVersion: 1
          providers:
            - name: default
              type: file
              options:
                path: /etc/grafana/dashboards
      become: yes

    - name: Write node exporter dashboard
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/node-exporter.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "App Instance Metrics",
            "uid": "node-exporter",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "timeseries",
                "title": "CPU Usage (%)",
                "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[2m])) * 100)",
                    "legendFormat": "{{instance}}"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Memory Usage (%)",
                "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "100 - ((node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100)",
                    "legendFormat": "{{instance}}"
                  }
                ]
              }
            ],
            "time": { "from": "now-1h", "to": "now" },
            "refresh": "30s"
          }
      become: yes

    - name: Write Falco security alerts dashboard
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/falco.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Falco Security Alerts",
            "uid": "falco-alerts",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "timeseries",
                "title": "Security Alerts by Priority",
                "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 },
                "targets": [
                  {
                    "expr": "rate(falco_events_total[5m])",
                    "legendFormat": "{{priority}} - {{rule}}"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Total Alerts (last 1h)",
                "gridPos": { "x": 0, "y": 8, "w": 8, "h": 4 },
                "targets": [
                  {
                    "expr": "increase(falco_events_total[1h])"
                  }
                ]
              }
            ],
            "time": { "from": "now-1h", "to": "now" },
            "refresh": "30s"
          }
      become: yes

    - name: Write WAF dashboard
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/waf-modsecurity.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "WAF - ModSecurity Detections",
            "uid": "waf-modsecurity",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "logs",
                "title": "Recent Detections",
                "gridPos": { "x": 0, "y": 0, "w": 24, "h": 10 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "expr": "{job=\"modsecurity\"} |~ \"ModSecurity: Warning\"",
                    "refId": "A"
                  }
                ],
                "options": {
                  "showLabels": true,
                  "showTime": true,
                  "wrapLogMessage": true
                }
              },
              {
                "type": "timeseries",
                "title": "Requests Exceeding Anomaly Threshold",
                "gridPos": { "x": 0, "y": 10, "w": 16, "h": 8 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "expr": "sum(count_over_time({job=\"modsecurity\"} |~ \"Anomaly Score Exceeded\"[5m]))",
                    "legendFormat": "detections",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Total Detections (last 1h)",
                "gridPos": { "x": 16, "y": 10, "w": 8, "h": 8 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "expr": "sum(count_over_time({job=\"modsecurity\"} |~ \"Anomaly Score Exceeded\"[1h]))",
                    "refId": "A"
                  }
                ]
              }
            ],
            "time": { "from": "now-6h", "to": "now" },
            "refresh": "30s"
          }
      notify: restart grafana
      become: yes

    - name: Write Visitors dashboard
      # Built from the nginx JSON access log (job="nginx_access").  A "page
      # view" is a successful GET for an app page: requests nginx proxies to
      # a service (/api, /store/api|uploads, /chat/, /socket.io, /health),
      # static assets and obvious bots are excluded.  The SPA
      # loads once per visit, so this counts visits/page loads, not in-app
      # route changes.  Visitors are approximated by distinct client IP.
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/visitors.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Visitors",
            "uid": "visitors",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "stat",
                "title": "Unique visitors",
                "description": "Distinct client IPs that loaded an app page in the selected time range.",
                "gridPos": { "x": 0, "y": 0, "w": 6, "h": 5 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  { "refId": "A", "queryType": "instant",
                    "expr": "count(count by (remote_addr) (count_over_time({job=\"nginx_access\"} | json | method=\"GET\" | status < 400 | uri !~ \"/((api|socket\\\\.io|health|healthcheck|assets)(/.*)?|store/(api|uploads)/.*|chat/.*)\" | uri !~ \".*\\\\.[A-Za-z0-9]+\" | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range])))" }
                ]
              },
              {
                "type": "stat",
                "title": "Page loads",
                "gridPos": { "x": 6, "y": 0, "w": 6, "h": 5 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  { "refId": "A", "queryType": "instant",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | method=\"GET\" | status < 400 | uri !~ \"/((api|socket\\\\.io|health|healthcheck|assets)(/.*)?|store/(api|uploads)/.*|chat/.*)\" | uri !~ \".*\\\\.[A-Za-z0-9]+\" | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range]))" }
                ]
              },
              {
                "type": "stat",
                "title": "API requests",
                "gridPos": { "x": 12, "y": 0, "w": 6, "h": 5 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  { "refId": "A", "queryType": "instant",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | uri =~ \"/(api|store/api|chat)/.*\" [$__range]))" }
                ]
              },
              {
                "type": "stat",
                "title": "Error responses (5xx)",
                "gridPos": { "x": 18, "y": 0, "w": 6, "h": 5 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  { "refId": "A", "queryType": "instant",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | status >= 500 [$__range]))" }
                ]
              },
              {
                "type": "timeseries",
                "title": "Unique visitors per hour",
                "gridPos": { "x": 0, "y": 5, "w": 12, "h": 8 },
                "interval": "1h",
                "datasource": { "type": "loki", "uid": "loki" },
                "fieldConfig": { "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 60 } } },
                "targets": [
                  { "refId": "A", "legendFormat": "visitors",
                    "expr": "count(count by (remote_addr) (count_over_time({job=\"nginx_access\"} | json | method=\"GET\" | status < 400 | uri !~ \"/((api|socket\\\\.io|health|healthcheck|assets)(/.*)?|store/(api|uploads)/.*|chat/.*)\" | uri !~ \".*\\\\.[A-Za-z0-9]+\" | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [1h])))" }
                ]
              },
              {
                "type": "timeseries",
                "title": "Page loads per hour",
                "gridPos": { "x": 12, "y": 5, "w": 12, "h": 8 },
                "interval": "1h",
                "datasource": { "type": "loki", "uid": "loki" },
                "fieldConfig": { "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 60 } } },
                "targets": [
                  { "refId": "A", "legendFormat": "page loads",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | method=\"GET\" | status < 400 | uri !~ \"/((api|socket\\\\.io|health|healthcheck|assets)(/.*)?|store/(api|uploads)/.*|chat/.*)\" | uri !~ \".*\\\\.[A-Za-z0-9]+\" | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [1h]))" }
                ]
              },
              {
                "type": "bargauge",
                "title": "Top pages",
                "gridPos": { "x": 0, "y": 13, "w": 12, "h": 9 },
                "datasource": { "type": "loki", "uid": "loki" },
                "options": { "orientation": "horizontal", "displayMode": "basic" },
                "targets": [
                  { "refId": "A", "queryType": "instant", "legendFormat": "{{uri}}",
                    "expr": "topk(10, sum by (uri) (count_over_time({job=\"nginx_access\"} | json | method=\"GET\" | status < 400 | uri !~ \"/((api|socket\\\\.io|health|healthcheck|assets)(/.*)?|store/(api|uploads)/.*|chat/.*)\" | uri !~ \".*\\\\.[A-Za-z0-9]+\" | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range])))" }
                ]
              },
              {
                "type": "bargauge",
                "title": "Top referrers",
                "description": "Where visitors came from. Includes your own domain for internal links.",
                "gridPos": { "x": 12, "y": 13, "w": 12, "h": 9 },
                "datasource": { "type": "loki", "uid": "loki" },
                "options": { "orientation": "horizontal", "displayMode": "basic" },
                "targets": [
                  { "refId": "A", "queryType": "instant", "legendFormat": "{{referer}}",
                    "expr": "topk(10, sum by (referer) (count_over_time({job=\"nginx_access\"} | json | method=\"GET\" | status < 400 | uri !~ \"/((api|socket\\\\.io|health|healthcheck|assets)(/.*)?|store/(api|uploads)/.*|chat/.*)\" | uri !~ \".*\\\\.[A-Za-z0-9]+\" | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" | referer != \"\" [$__range])))" }
                ]
              },
              {
                "type": "timeseries",
                "title": "Responses by status",
                "gridPos": { "x": 0, "y": 22, "w": 24, "h": 8 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  { "refId": "A", "legendFormat": "{{status}}",
                    "expr": "sum by (status) (count_over_time({job=\"nginx_access\"} | json [$__interval]))" }
                ]
              }
            ],
            "time": { "from": "now-7d", "to": "now" },
            "refresh": "5m"
          }
      become: yes

    # --- Loki ---

    - name: Create Loki config directory
      ansible.builtin.file:
        path: /etc/loki
        state: directory
        mode: "0755"
      become: yes

    - name: Write Loki config
      ansible.builtin.copy:
        dest: /etc/loki/loki-config.yml
        mode: "0644"
        content: |
          auth_enabled: false

          server:
            http_listen_port: 3100

          common:
            path_prefix: /loki
            storage:
              filesystem:
                chunks_directory: /loki/chunks
                rules_directory: /loki/rules
            replication_factor: 1
            ring:
              instance_addr: 127.0.0.1
              kvstore:
                store: inmemory

          schema_config:
            configs:
              - from: 2020-10-24
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          limits_config:
            # Unique-visitor queries create one series per client IP.
            max_query_series: 50000
            # Access logs contain client IPs; keep them 90 days.
            retention_period: 2160h

          compactor:
            working_directory: /loki/compactor
            shared_store: filesystem
            retention_enabled: true

          analytics:
            reporting_enabled: false
      notify: restart loki
      become: yes

    # --- Umami secrets ---
    # Generated once on the server and never overwritten (force: false), so
    # the Postgres password stays in sync with the initialised database.

    - name: Create Umami config directory
      ansible.builtin.file:
        path: /etc/umami
        state: directory
        owner: myguy
        group: myguy
        mode: "0700"
      become: yes

    - name: Generate candidate Umami secrets
      # Evaluated once here; a lookup in the copy task's vars would be
      # re-evaluated on every reference and produce mismatched passwords.
      ansible.builtin.set_fact:
        umami_db_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}"
        umami_app_secret: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=48) }}"
      no_log: true

    - name: Write Umami environment file (first run only)
      ansible.builtin.copy:
        dest: /etc/umami/umami.env
        owner: myguy
        group: myguy
        mode: "0600"
        force: false
        content: |
          POSTGRES_USER=umami
          POSTGRES_DB=umami
          POSTGRES_PASSWORD={{ umami_db_password }}
          DATABASE_URL=postgresql://umami:{{ umami_db_password }}@localhost:5432/umami
          APP_SECRET={{ umami_app_secret }}
          DISABLE_TELEMETRY=1
      no_log: true
      become: yes

    # --- Containers (Podman Quadlet) ---
    # Runs after all config files above are written.  Each container is a
    # rootless systemd user service generated from a .container file; Quadlet
    # runs `podman run --replace`, so containers left from earlier deploys
    # with the same name are replaced rather than conflicting.

    - name: Remove legacy podman-generate-systemd units
      # Superseded by Quadlet; these units fail to start against a container
      # that is already running.
      ansible.builtin.file:
        path: "{{ user_systemd_dir }}/{{ item[0] }}container-{{ item[1].name }}.service"
        state: absent
      loop: "{{ ['', 'default.target.wants/'] | product(monitoring_containers) | list }}"
      loop_control:
        label: "{{ item[0] }}container-{{ item[1].name }}.service"
      become: yes
      become_user: myguy

    - name: Create Quadlet directory for myguy
      ansible.builtin.file:
        path: "{{ quadlet_dir }}"
        state: directory
        owner: myguy
        group: myguy
        mode: "0755"
      become: yes

    - name: Write Quadlet container units
      ansible.builtin.copy:
        dest: "{{ quadlet_dir }}/{{ item.name }}.container"
        owner: myguy
        group: myguy
        mode: "0644"
        content: |
          [Unit]
          Description={{ item.name }} (monitoring)
          {% if item.part_of is defined %}
          Requires={{ item.part_of }}.service
          After={{ item.part_of }}.service
          PartOf={{ item.part_of }}.service
          {% endif %}

          [Container]
          ContainerName={{ item.name }}
          Image={{ item.image }}
          {% for port in item.ports | default([]) %}
          PublishPort={{ port }}
          {% endfor %}
          {% for volume in item.volumes | default([]) %}
          Volume={{ volume }}
          {% endfor %}
          {% for key, value in (item.env | default({})).items() %}
          Environment={{ key }}={{ value }}
          {% endfor %}
          {% if item.network is defined %}
          Network={{ item.network }}
          {% endif %}
          {% if item.env_file is defined %}
          EnvironmentFile={{ item.env_file }}
          {% endif %}
          {% if item.exec is defined %}
          Exec={{ item.exec }}
          {% endif %}

          [Service]
          Restart=always
          # First start pulls the image, which can exceed the 90s default.
          TimeoutStartSec=900

          [Install]
          WantedBy=default.target
      loop: "{{ monitoring_containers }}"
      loop_control:
        label: "{{ item.name }}"
      register: quadlet_units
      become: yes

    - name: Start monitoring containers (restart those whose unit changed)
      # Quadlet services are generated, so they cannot be `enabled`; the
      # [Install] section above makes them start at boot instead.
      ansible.builtin.systemd:
        name: "{{ item.item.name }}.service"
        state: "{{ 'restarted' if item.changed else 'started' }}"
        daemon_reload: yes
        scope: user
      loop: "{{ quadlet_units.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      become: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ xdg_runtime_dir }}/bus"

    - name: Reload Prometheus config
      ansible.builtin.command:
        cmd: podman kill --signal HUP prometheus
      changed_when: false
      failed_when: false
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
