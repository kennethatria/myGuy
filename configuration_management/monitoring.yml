    - name: Write Falco security alerts dashboard
      # Falco (0.38+) exports rule hits as falcosecurity_falco_rules_matches_total,
      # a series that only appears once a rule first fires, so the stat falls
      # back to 0 and "Falco running" shows the 0 is real, not a dead scrape.
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/falco.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Falco Security Alerts",
            "uid": "falco-alerts",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "stat",
                "title": "Falco running",
                "description": "Whether Prometheus can reach Falco on the app server. If this is Down, an alert count of 0 means nothing.",
                "gridPos": { "x": 0, "y": 0, "w": 8, "h": 5 },
                "fieldConfig": { "defaults": {
                  "mappings": [ { "type": "value", "options": {
                    "0": { "text": "Down", "color": "red" }, "1": { "text": "Running", "color": "green" } } } ],
                  "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } } },
                "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
                "targets": [ { "refId": "A", "expr": "max(up{job=\"falco\"}) or vector(0)" } ]
              },
              {
                "type": "stat",
                "title": "Alerts in this time range",
                "description": "Suspicious activity Falco caught on the app server (unexpected shells, sensitive file reads, privilege changes). 0 is normal.",
                "gridPos": { "x": 8, "y": 0, "w": 16, "h": 5 },
                "fieldConfig": { "defaults": { "decimals": 0,
                  "thresholds": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 10 } ] } } },
                "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
                "targets": [ { "refId": "A", "instant": true,
                  "expr": "sum(increase(falcosecurity_falco_rules_matches_total[$__range])) or vector(0)" } ]
              },
              {
                "type": "timeseries",
                "title": "Alerts by rule",
                "description": "Which Falco rules fired and when. Empty means no alerts.",
                "gridPos": { "x": 0, "y": 5, "w": 24, "h": 9 },
                "fieldConfig": { "defaults": { "decimals": 0, "noValue": "No alerts",
                  "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } } } },
                "targets": [ { "refId": "A", "legendFormat": "{{priority}} · {{rule_name}}",
                  "expr": "sum by (priority, rule_name) (increase(falcosecurity_falco_rules_matches_total[$__interval]))" } ]
              }
            ],
            "time": { "from": "now-24h", "to": "now" },
            "refresh": "1m"
          }
      become: yes

    - name: Write WAF dashboard
      ansible.builtin.copy:
