              {
                "type": "timeseries",
                "title": "Requests Exceeding Anomaly Threshold",
                "gridPos": { "x": 0, "y": 10, "w": 16, "h": 8 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "expr": "sum(count_over_time({job=\"modsecurity\"} |~ \"Anomaly Score Exceeded\"[5m]))",
                    "legendFormat": "detections",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Total Detections (last 1h)",
                "gridPos": { "x": 16, "y": 10, "w": 8, "h": 8 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "expr": "sum(count_over_time({job=\"modsecurity\"} |~ \"Anomaly Score Exceeded\"[1h]))",
                    "refId": "A"
                  }
                ]
              }
            ],
            "time": { "from": "now-6h", "to": "now" },
            "refresh": "30s"
          }
      notify: restart grafana
      become: yes

    - name: Write Visitors dashboard
      # Built from the nginx JSON access log (job="nginx_access").  Any unknown
      # path is answered with the app page, so scanners posing as browsers
      # would count as visitors; a visitor is therefore an IP whose browser
      # ran the app (downloaded /assets/*.js or made a successful API call).
      # Visitors are approximated by distinct client IP.
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/visitors.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Visitors",
            "uid": "visitors",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "stat",
                "title": "Visitors",
                "description": "IP addresses whose browser actually ran the app (downloaded its code or used it). Not people: a phone on mobile data changes IP often and counts again each time. Umami counts real visitors.",
                "gridPos": {
                  "x": 0,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "count(count by (remote_addr) (count_over_time({job=\"nginx_access\"} | json | uri =~ \"/assets/.*[.]js|/(api/v1|store/api/v1|chat/api/v1)/.*\" | status < 400 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range])))"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Signed-in IPs",
                "description": "IP addresses that loaded a signed-in profile (only a valid session gets one). One person on mobile data shows up as many IPs; the number of accounts lives in the database, not in these logs.",
                "gridPos": {
                  "x": 6,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "count(count by (remote_addr) (count_over_time({job=\"nginx_access\"} | json | uri = \"/api/v1/profile\" | status = 200 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range])))"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "App requests",
                "description": "Successful calls the app made to the backend, store and chat. A good measure of how much the app is used.",
                "gridPos": {
                  "x": 12,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | uri =~ \"/(api/v1|store/api/v1|chat/api/v1)/.*\" | status < 400 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range]))"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Server errors (5xx)",
                "description": "Requests the server failed to answer. Should be close to 0; see Service Logs for the cause.",
                "gridPos": {
                  "x": 18,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "decimals": 0,
                    "color": {
                      "mode": "thresholds"
                    },
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        }
                      ]
                    }
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | status >= 500 [$__range])) or vector(0)"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Visitors per hour",
                "gridPos": {
                  "x": 0,
                  "y": 5,
                  "w": 12,
                  "h": 8
                },
                "interval": "1h",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "custom": {
                      "drawStyle": "bars",
                      "fillOpacity": 60
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "legend": {
                    "showLegend": false
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "legendFormat": "visitors",
                    "expr": "count(count by (remote_addr) (count_over_time({job=\"nginx_access\"} | json | uri =~ \"/assets/.*[.]js|/(api/v1|store/api/v1|chat/api/v1)/.*\" | status < 400 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [1h])))"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "App requests per hour",
                "description": "Activity: how much the app was used each hour.",
                "gridPos": {
                  "x": 12,
                  "y": 5,
                  "w": 12,
                  "h": 8
                },
                "interval": "1h",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "custom": {
                      "drawStyle": "bars",
                      "fillOpacity": 60
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "legend": {
                    "showLegend": false
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "legendFormat": "requests",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | uri =~ \"/(api/v1|store/api/v1|chat/api/v1)/.*\" | status < 400 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [1h]))"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Pages opened directly",
                "description": "App pages loaded from a link, bookmark or refresh (moving around inside the app isn't counted). The home page includes scanners.",
                "gridPos": {
                  "x": 0,
                  "y": 13,
                  "w": 12,
                  "h": 10
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "decimals": 0
                  },
                  "overrides": [
                    {
                      "matcher": {
                        "id": "byName",
                        "options": "Count"
                      },
                      "properties": [
                        {
                          "id": "custom.cellOptions",
                          "value": {
                            "type": "gauge",
                            "mode": "basic",
                            "valueDisplayMode": "text"
                          }
                        },
                        {
                          "id": "color",
                          "value": {
                            "mode": "fixed",
                            "fixedColor": "blue"
                          }
                        },
                        {
                          "id": "custom.width",
                          "value": 220
                        }
                      ]
                    }
                  ]
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "sort_desc(topk(10, sum by (uri) (count_over_time({job=\"nginx_access\"} | json | method=\"GET\" | status < 400 | uri =~ \"/(dashboard|login|register|messages|profile(/[0-9]+)?|reviews(/[0-9]+|/create/[0-9]+)?|my-gigs(/(created|assigned|applications))?|store(/new|/[0-9]+|/requests/(new|[0-9]+))?|tasks(/create|/[0-9]+)?|(edit|posted)/(task|item|request)/[0-9]+)?/?\" | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range]))))"
                  }
                ],
                "options": {
                  "showHeader": true,
                  "cellHeight": "sm",
                  "sortBy": [
                    {
                      "displayName": "Count",
                      "desc": true
                    }
                  ]
                },
                "transformations": [
                  {
                    "id": "labelsToFields",
                    "options": {
                      "mode": "columns"
                    }
                  },
                  {
                    "id": "merge",
                    "options": {}
                  },
                  {
                    "id": "organize",
                    "options": {
                      "excludeByName": {
                        "Time": true
                      },
                      "renameByName": {
                        "uri": "Page",
                        "Value": "Count",
                        "Value #A": "Count"
                      }
                    }
                  }
                ]
              },
              {
                "type": "table",
                "title": "Top referrers",
                "description": "Sites people came from (links to the bare server IP, used by scanners, are left out). Includes your own domain for internal links.",
                "gridPos": {
                  "x": 12,
                  "y": 13,
                  "w": 12,
                  "h": 10
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "decimals": 0
                  },
                  "overrides": [
                    {
                      "matcher": {
                        "id": "byName",
                        "options": "Count"
                      },
                      "properties": [
                        {
                          "id": "custom.cellOptions",
                          "value": {
                            "type": "gauge",
                            "mode": "basic",
                            "valueDisplayMode": "text"
                          }
                        },
                        {
                          "id": "color",
                          "value": {
                            "mode": "fixed",
                            "fixedColor": "blue"
                          }
                        },
                        {
                          "id": "custom.width",
                          "value": 220
                        }
                      ]
                    }
                  ]
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "sort_desc(topk(10, sum by (referer) (count_over_time({job=\"nginx_access\"} | json | method=\"GET\" | status < 400 | uri =~ \"/(dashboard|login|register|messages|profile(/[0-9]+)?|reviews(/[0-9]+|/create/[0-9]+)?|my-gigs(/(created|assigned|applications))?|store(/new|/[0-9]+|/requests/(new|[0-9]+))?|tasks(/create|/[0-9]+)?|(edit|posted)/(task|item|request)/[0-9]+)?/?\" | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" | referer != \"\" | referer !~ \"https?://[0-9.]+([:/].*)?\" [$__range]))))"
                  }
                ],
                "options": {
                  "showHeader": true,
                  "cellHeight": "sm",
                  "sortBy": [
                    {
                      "displayName": "Count",
                      "desc": true
                    }
                  ]
                },
                "transformations": [
                  {
                    "id": "labelsToFields",
                    "options": {
                      "mode": "columns"
                    }
                  },
                  {
                    "id": "merge",
                    "options": {}
                  },
                  {
                    "id": "organize",
                    "options": {
                      "excludeByName": {
                        "Time": true
                      },
                      "renameByName": {
                        "referer": "Referrer",
                        "Value": "Count",
                        "Value #A": "Count"
                      }
                    }
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Responses by status",
                "description": "Every response nginx sent, by status code (200 OK, 304 unchanged, 404 not found, 5xx failed). Includes scanners.",
                "gridPos": {
                  "x": 0,
                  "y": 23,
                  "w": 24,
                  "h": 8
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "targets": [
                  {
                    "refId": "A",
                    "legendFormat": "{{status}}",
                    "expr": "sum by (status) (count_over_time({job=\"nginx_access\"} | json [$__interval]))"
                  }
                ]
              }
            ],
            "time": {
              "from": "now-7d",
              "to": "now"
            },
            "refresh": "5m"
          }
      become: yes

    - name: Write Service Logs dashboard
      # Container output shipped by Promtail (job="containers"), labelled by
      # compose service and stream (stdout / stderr).
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/service-logs.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Service Logs",
            "uid": "service-logs",
            "schemaVersion": 36,
            "templating": { "list": [
              { "name": "service", "label": "Service", "type": "query",
                "datasource": { "type": "loki", "uid": "loki" },
                "query": "label_values({job=\"containers\"}, service)",
                "includeAll": true, "multi": true, "allValue": ".+",
                "current": { "text": "All", "value": "$__all" }, "refresh": 2 },
              { "name": "search", "label": "Search", "type": "textbox", "query": "" }
            ] },
            "panels": [
              {
                "type": "timeseries",
                "title": "Log lines per service",
                "description": "How much each service is logging. A sudden spike often means something is failing in a loop.",
                "gridPos": { "x": 0, "y": 0, "w": 12, "h": 7 },
                "datasource": { "type": "loki", "uid": "loki" },
                "fieldConfig": { "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } } } },
                "targets": [ { "refId": "A", "legendFormat": "{{service}}",
                  "expr": "sum by (service) (count_over_time({job=\"containers\", service=~\"$service\"} [$__interval]))" } ]
              },
              {
                "type": "timeseries",
                "title": "Error output per service",
                "description": "Lines written to stderr, plus any line mentioning error or panic. Some services log normal startup messages to stderr too.",
                "gridPos": { "x": 12, "y": 0, "w": 12, "h": 7 },
                "datasource": { "type": "loki", "uid": "loki" },
                "fieldConfig": { "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } } } },
                "targets": [ { "refId": "A", "legendFormat": "{{service}}",
                  "expr": "sum by (service) (count_over_time({job=\"containers\", service=~\"$service\"} |~ \"(?i)(error|panic|fatal)\" [$__interval]))" } ]
              },
              {
                "type": "logs",
                "title": "Logs",
                "description": "Newest first. Pick services and type in Search at the top to filter.",
                "gridPos": { "x": 0, "y": 7, "w": 24, "h": 16 },
                "datasource": { "type": "loki", "uid": "loki" },
                "options": { "showLabels": false, "showCommonLabels": false, "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true },
                "targets": [ { "refId": "A",
                  "expr": "{job=\"containers\", service=~\"$service\"} |~ \"(?i)$search\"" } ]
              }
            ],
            "time": { "from": "now-6h", "to": "now" },
            "refresh": "1m"
          }
      become: yes

    # --- Tempo ---

    - name: Create Tempo config directory
      ansible.builtin.file:
        path: /etc/tempo
        state: directory
        mode: "0755"
      become: yes

    - name: Write Tempo config
      ansible.builtin.copy:
        dest: /etc/tempo/tempo.yml
        mode: "0644"
        content: |
          stream_over_http_enabled: true
          server:
            http_listen_port: 3200
            log_level: warn

          distributor:
            receivers:
              otlp:
                protocols:
                  http:
                    endpoint: 0.0.0.0:4318

          ingester:
            max_block_duration: 5m

          compactor:
            compaction:
              # Traces carry client IPs; keep them 14 days.
              block_retention: 336h

          storage:
            trace:
              backend: local
              wal:
                path: /var/tempo/wal
              local:
                path: /var/tempo/blocks

          usage_report:
            reporting_enabled: false
      notify: restart tempo
      become: yes

    # --- Loki ---

    - name: Create Loki config directory
      ansible.builtin.file:
        path: /etc/loki
        state: directory
        mode: "0755"
      become: yes

    - name: Write Loki config
      ansible.builtin.copy:
        dest: /etc/loki/loki-config.yml
        mode: "0644"
        content: |
          auth_enabled: false

          server:
            http_listen_port: 3100

          common:
            path_prefix: /loki
            storage:
              filesystem:
                chunks_directory: /loki/chunks
                rules_directory: /loki/rules
            replication_factor: 1
            ring:
              instance_addr: 127.0.0.1
              kvstore:
                store: inmemory

          schema_config:
            configs:
              - from: 2020-10-24
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          limits_config:
            # Unique-visitor queries create one series per client IP.
            max_query_series: 50000
            # Access logs contain client IPs; keep them 8 days (the
            # dashboards look back 7 at most).
            retention_period: 192h

          compactor:
            working_directory: /loki/compactor
            shared_store: filesystem
            retention_enabled: true

          analytics:
            reporting_enabled: false
      notify: restart loki
      become: yes

    # --- Umami secrets ---
    # Generated once on the server and never overwritten (force: false), so
    # the Postgres password stays in sync with the initialised database.

    - name: Create Umami config directory
      ansible.builtin.file:
        path: /etc/umami
        state: directory
        owner: myguy
        group: myguy
        mode: "0700"
      become: yes

    - name: Generate candidate Umami secrets
      # Evaluated once here; a lookup in the copy task's vars would be
      # re-evaluated on every reference and produce mismatched passwords.
      ansible.builtin.set_fact:
        umami_db_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}"
        umami_app_secret: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=48) }}"
      no_log: true

    - name: Write Umami environment file (first run only)
      ansible.builtin.copy:
        dest: /etc/umami/umami.env
        owner: myguy
        group: myguy
        mode: "0600"
        force: false
        content: |
          POSTGRES_USER=umami
          POSTGRES_DB=umami
          POSTGRES_PASSWORD={{ umami_db_password }}
          DATABASE_URL=postgresql://umami:{{ umami_db_password }}@localhost:5432/umami
          APP_SECRET={{ umami_app_secret }}
          DISABLE_TELEMETRY=1
      no_log: true
      become: yes

    # --- Containers (Podman Quadlet) ---
    # Runs after all config files above are written.  Each container is a
    # rootless systemd user service generated from a .container file; Quadlet
    # runs `podman run --replace`, so containers left from earlier deploys
    # with the same name are replaced rather than conflicting.

    - name: Remove legacy podman-generate-systemd units
      # Superseded by Quadlet; these units fail to start against a container
      # that is already running.
      ansible.builtin.file:
        path: "{{ user_systemd_dir }}/{{ item[0] }}container-{{ item[1].name }}.service"
        state: absent
      loop: "{{ ['', 'default.target.wants/'] | product(monitoring_containers) | list }}"
      loop_control:
        label: "{{ item[0] }}container-{{ item[1].name }}.service"
      become: yes
      become_user: myguy

    - name: Create Quadlet directory for myguy
      ansible.builtin.file:
        path: "{{ quadlet_dir }}"
        state: directory
        owner: myguy
        group: myguy
        mode: "0755"
      become: yes

    - name: Write Quadlet container units
      ansible.builtin.copy:
        dest: "{{ quadlet_dir }}/{{ item.name }}.container"
        owner: myguy
        group: myguy
        mode: "0644"
        content: |
          [Unit]
          Description={{ item.name }} (monitoring)
          {% if item.part_of is defined %}
          Requires={{ item.part_of }}.service
          After={{ item.part_of }}.service
          PartOf={{ item.part_of }}.service
          {% endif %}

          [Container]
          ContainerName={{ item.name }}
          Image={{ item.image }}
          {% for port in item.ports | default([]) %}
          PublishPort={{ port }}
          {% endfor %}
          {% for volume in item.volumes | default([]) %}
          Volume={{ volume }}
          {% endfor %}
          {% for key, value in (item.env | default({})).items() %}
          Environment={{ key }}={{ value }}
          {% endfor %}
          {% if item.network is defined %}
          Network={{ item.network }}
          {% endif %}
          {% if item.env_file is defined %}
          EnvironmentFile={{ item.env_file }}
          {% endif %}
          {% if item.user is defined %}
          User={{ item.user }}
          {% endif %}
          {% if item.memory is defined %}
          PodmanArgs=--memory={{ item.memory }} --memory-swap={{ item.memory }}
          {% endif %}
          {% if item.exec is defined %}
          Exec={{ item.exec }}
          {% endif %}

          [Service]
          Restart=always
          # First start pulls the image, which can exceed the 90s default.
          TimeoutStartSec=900

          [Install]
          WantedBy=default.target
      loop: "{{ monitoring_containers }}"
      loop_control:
        label: "{{ item.name }}"
      register: quadlet_units
      become: yes

    - name: Stop Zipkin (replaced by Tempo)
      ansible.builtin.systemd:
        name: zipkin.service
        state: stopped
        scope: user
      failed_when: false
      become: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ xdg_runtime_dir }}/bus"

    - name: Remove the Zipkin Quadlet unit
      ansible.builtin.file:
        path: "{{ quadlet_dir }}/zipkin.container"
        state: absent
      become: yes

    - name: Start monitoring containers (restart those whose unit changed)
      # Quadlet services are generated, so they cannot be `enabled`; the
      # [Install] section above makes them start at boot instead.
      ansible.builtin.systemd:
        name: "{{ item.item.name }}.service"
        state: "{{ 'restarted' if item.changed else 'started' }}"
        daemon_reload: yes
        scope: user
      loop: "{{ quadlet_units.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      become: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ xdg_runtime_dir }}/bus"

    # GF_SECURITY_ADMIN_PASSWORD only applies when Grafana creates its
    # database; resetting keeps the secret authoritative after that too.
    - name: Set the Grafana admin password from the secret
      ansible.builtin.command:
        cmd: podman exec -i grafana grafana cli admin reset-admin-password --password-from-stdin
        stdin: "{{ grafana_admin_password }}"
      register: grafana_password_reset
      until: grafana_password_reset.rc == 0
      retries: 10
      delay: 3
      changed_when: false
      no_log: true
      become: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: Reload Prometheus config
      ansible.builtin.command:
        cmd: podman kill --signal HUP prometheus
      changed_when: false
      failed_when: false
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
