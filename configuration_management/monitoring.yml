# monitoring.yml - Install Prometheus, Grafana, Loki, Jaeger and the blackbox prober on the monitoring instance
#
# Runs as myguy (inventory ansible_user).  System tasks (apt, file writes under
# /etc/) carry explicit become: yes.  Podman containers run rootlessly as myguy
# so a container escape stays confined to the myguy user.

---
- name: Configure monitoring instance
  hosts: monitoring
  # No play-level become: each task declares its own privilege requirement.

  vars:
    # Run as rootless Podman Quadlet units owned by myguy: systemd starts,
    # restarts and boots each container (linger is enabled in users.yml).
    # Ports listen on the VPC address (vpc_ip) only, never on every address,
    # so a firewall mistake can't expose them; the containers reach each
    # other there too.
    # memory: a hard limit with no swap.  On this 1 GB server a container
    # that outgrows it is killed and restarted (Restart=always) instead of
    # pushing the whole server into swap, where everything stalls.
    monitoring_containers:
      # Traces: the services send OTLP/HTTP to 4318; Jaeger keeps the newest
      # 20,000 in memory (lost on restart) and serves its UI on 16686.
      # Replaced Tempo, which needed more than 256 MB on this server.
      - name: jaeger
        # 20,000 stored traces measured at ~100 MB; room for richer spans.
        memory: 160m
        image: docker.io/jaegertracing/jaeger:2.22.0
        ports: ["{{ vpc_ip }}:4318:4318", "{{ vpc_ip }}:16686:16686", "{{ vpc_ip }}:8888:8888"]
        volumes:
          - /etc/jaeger/jaeger.yml:/etc/jaeger/jaeger.yml:ro
        exec: --config /etc/jaeger/jaeger.yml
      - name: prometheus
        memory: 256m
        image: docker.io/prom/prometheus:latest
        ports: ["{{ vpc_ip }}:9090:9090"]
        volumes:
          # The directory, not the file: Ansible replaces prometheus.yml
          # with a new file, and a single-file mount keeps showing the old
          # one, so the HUP reload would reread stale config.
          - /etc/prometheus:/etc/prometheus:ro
          # Named, so history survives the container being recreated (the
          # image's own anonymous volume went with each container).
          - prometheus-data:/prometheus
        exec: >-
          --config.file=/etc/prometheus/prometheus.yml
          --storage.tsdb.path=/prometheus
          --storage.tsdb.retention.time=15d
      - name: grafana
        # Its alerting engine (rules every minute) needs more than 256 MB;
        # at 256 MB it was killed in a loop.
        memory: 384m
        image: docker.io/grafana/grafana:latest
        ports: ["{{ vpc_ip }}:3000:3000"]
        volumes:
          - /etc/grafana/provisioning:/etc/grafana/provisioning:ro
          - /etc/grafana/dashboards:/etc/grafana/dashboards:ro
          # Users, passwords and preferences survive container replacement
          - grafana-data:/var/lib/grafana
        env:
          GF_AUTH_ANONYMOUS_ENABLED: "false"
          GF_SERVER_HTTP_ADDR: "0.0.0.0"
        # Admin password and Telegram secrets (repository secrets); the
        # alerting provisioning reads the Telegram ones as ${...}.
        env_file: /etc/grafana/grafana.env
      - name: loki
        memory: 320m
        image: docker.io/grafana/loki:2.9.10
        ports: ["{{ vpc_ip }}:3100:3100"]
        volumes:
          - /etc/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
          - loki-data:/loki
        exec: -config.file=/etc/loki/loki-config.yml
      # Probes the public site from outside the app server (HTTPS answer,
      # certificate expiry) for the Site down / certificate alerts.
      - name: blackbox
        memory: 64m
        image: docker.io/prom/blackbox-exporter:v0.25.0
        ports: ["{{ vpc_ip }}:9115:9115"]
        volumes:
          - /etc/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
        exec: --config.file=/etc/blackbox/blackbox.yml

  handlers:
    - name: restart grafana
      ansible.builtin.command:
        cmd: podman restart grafana
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false

    - name: restart loki
      ansible.builtin.command:
        cmd: podman restart loki
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false

    - name: restart jaeger
      ansible.builtin.command:
        cmd: podman restart jaeger
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false
      failed_when: false   # first run: the container starts later in the play

    - name: restart blackbox
      ansible.builtin.command:
        cmd: podman restart blackbox
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false
      failed_when: false   # first run: the container starts later in the play

  pre_tasks:
    # Grafana would otherwise start with admin / admin
    - name: Require the Grafana admin password
      ansible.builtin.assert:
        that: grafana_admin_password | default('') | length >= 12
        fail_msg: "Set the GRAFANA_ADMIN_PASSWORD repository secret (12+ characters) before running monitoring.yml."
        quiet: true

    - name: Get myguy user ID for XDG_RUNTIME_DIR
      ansible.builtin.command:
        cmd: id -u myguy
      register: app_user_uid_result
      changed_when: false

    - name: Set XDG_RUNTIME_DIR fact
      ansible.builtin.set_fact:
        app_user_uid: "{{ app_user_uid_result.stdout }}"
        xdg_runtime_dir: "/run/user/{{ app_user_uid_result.stdout }}"
        user_systemd_dir: "/home/myguy/.config/systemd/user"
        quadlet_dir: "/home/myguy/.config/containers/systemd"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      become: yes

    - name: Enable universe repository
      ansible.builtin.apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_facts['distribution_release'] }} universe"
        state: present
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    - name: Update apt cache after enabling universe
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    - name: Install Podman
      ansible.builtin.apt:
        name: podman
        state: present
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    # --- Journal size ---
    # Uncapped, journald grows its files (and their memory mappings) to ~10%
    # of the disk; on a 1 GB server that memory matters more than old logs.

    - name: Create journald drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"
      become: yes

    - name: Cap systemd journal size
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/size.conf
        mode: "0644"
        content: |
          [Journal]
          SystemMaxUse=100M
          SystemMaxFileSize=20M
      become: yes
      register: journald_conf

    - name: Apply journal cap now
      when: journald_conf.changed
      become: yes
      block:
        - name: Restart journald
          ansible.builtin.systemd:
            name: systemd-journald
            state: restarted

        - name: Trim existing journal files to the cap
          ansible.builtin.command:
            cmd: journalctl --vacuum-size=100M

    - name: Create user systemd directory for myguy
      ansible.builtin.file:
        path: "{{ user_systemd_dir }}"
        state: directory
        owner: myguy
        group: myguy
        mode: "0755"
      become: yes

    - name: Set otel_endpoint fact for use by other plays
      ansible.builtin.set_fact:
        otel_endpoint: "http://{{ ansible_host }}:4318"

    # --- node_exporter (this server's CPU, memory and disk) ---

    - name: Allow listening on the VPC address at boot
      ansible.builtin.include_tasks:
        file: tasks/vpc_listen.yml
        apply:
          become: yes

    - name: Install node_exporter
      ansible.builtin.include_tasks:
        file: tasks/node_exporter.yml
        apply:
          become: yes

    # --- Promtail (this server's SSH logins, sudo and security checks) ---

    - name: Install Promtail
      ansible.builtin.include_tasks:
        file: tasks/promtail.yml
        apply:
          become: yes
      vars:
        promtail_loki_url: "http://{{ vpc_ip }}:3100"
        promtail_scrape_configs: |
          {{ lookup('ansible.builtin.template', 'files/promtail-system-job.yml.j2', template_vars={'promtail_host': 'monitoring'}) }}

    # --- Prometheus ---

    - name: Create Prometheus config directory
      ansible.builtin.file:
        path: /etc/prometheus
        state: directory
        mode: "0755"
      become: yes

    - name: Write Prometheus config
      ansible.builtin.copy:
        dest: /etc/prometheus/prometheus.yml
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: node_exporter
              static_configs:
                - targets: ['{{ instance_vpc_ip }}:{{ node_exporter_port }}']
                  labels:
                    instance: app
                # This server's own node_exporter, on its VPC address.
                - targets: ['{{ vpc_ip }}:{{ node_exporter_port }}']
                  labels:
                    instance: monitoring

            - job_name: falco
              static_configs:
                - targets: ['{{ instance_vpc_ip }}:{{ falco_metrics_port }}']
                  labels:
                    instance: app

            # Account and marketplace counts (internal/metrics in each service).
            - job_name: app_counts
              scrape_interval: 60s
              static_configs:
                - targets: ['{{ instance_vpc_ip }}:9464']
                  labels:
                    service: backend
                - targets: ['{{ instance_vpc_ip }}:9465']
                  labels:
                    service: store-service

            # The public site, probed through blackbox (role: what users see).
            - job_name: site
              metrics_path: /probe
              params:
                module: [https_ok]
              static_configs:
                - targets:
                    - https://{{ domain }}/
                    - https://{{ domain }}/health
              relabel_configs: &blackbox_relabel
                - source_labels: [__address__]
                  target_label: __param_target
                - source_labels: [__param_target]
                  target_label: instance
                - target_label: __address__
                  replacement: '{{ vpc_ip }}:9115'

            # Old domains: answer with a redirect, over a valid certificate.
            - job_name: redirects
              metrics_path: /probe
              params:
                module: [https_redirect]
              static_configs:
                # Prefix and suffix, no regex backreference: in task content
                # Ansible kept the backslash, and the target became literal.
                - targets: {{ (hostvars[groups['app'][0]].redirect_domains | default([])) | map('regex_replace', '^', 'https://') | map('regex_replace', '$', '/') | list | to_json }}
              relabel_configs: *blackbox_relabel

            # Memory and CPU per app container (observability.yml).
            - job_name: podman
              static_configs:
                - targets: ['{{ instance_vpc_ip }}:9882']
                  labels:
                    instance: app

            # Jaeger's own counters (spans received and stored).
            - job_name: jaeger
              static_configs:
                - targets: ['{{ vpc_ip }}:8888']

            # Loki's own health, so "Monitoring target down" covers it too.
            - job_name: loki
              static_configs:
                - targets: ['{{ vpc_ip }}:3100']
              # Only `up` is used (it's added by Prometheus, not scraped, so
              # this keeps it); Loki's ~1,600 own series were 70% of all.
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: '.+'
                  action: drop
      become: yes

    # --- Grafana provisioning files ---

    - name: Create Grafana provisioning directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/grafana/provisioning/datasources
        - /etc/grafana/provisioning/dashboards
        - /etc/grafana/dashboards
      become: yes

    - name: Write Grafana secrets
      ansible.builtin.copy:
        dest: /etc/grafana/grafana.env
        content: |
          GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}
          TELEGRAM_BOT_TOKEN={{ telegram_bot_token | default('') }}
          TELEGRAM_CHAT_ID={{ telegram_chat_id | default('') }}
        owner: myguy
        group: myguy
        mode: "0600"
      no_log: true
      notify: restart grafana
      become: yes

    - name: Remove the old Grafana admin env file
      ansible.builtin.file:
        path: /etc/grafana/admin.env
        state: absent
      become: yes

    - name: Write Grafana Prometheus datasource
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        mode: "0644"
        content: |
          apiVersion: 1
          # A Prometheus datasource created before it had a fixed uid (and the
          # retired Tempo one) stopped Grafana from starting ("Datasource
          # provisioning error: data source not found"): delete them, then
          # create Prometheus again with uid "prometheus" (alert rules use it).
          deleteDatasources:
            - name: Prometheus
              orgId: 1
            - name: Tempo
              orgId: 1
          datasources:
            - name: Prometheus
              type: prometheus
              uid: prometheus
              access: proxy
              url: http://{{ vpc_ip }}:9090
              isDefault: true
      notify: restart grafana
      become: yes

    - name: Write Grafana Loki datasource
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/loki.yml
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://{{ vpc_ip }}:3100
              isDefault: false
      notify: restart grafana
      become: yes

    - name: Create Grafana alerting provisioning directory
      ansible.builtin.file:
        path: /etc/grafana/provisioning/alerting
        state: directory
        mode: "0755"
      become: yes

    - name: Write Grafana alert rules and Telegram contact point
      # The bot token and chat id come from grafana.env (${...} below), so
      # no secret is in this file.  Without them the rules still show in
      # Grafana > Alerting, but nothing reaches Telegram.
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/alerting/alerts.yml
        mode: "0644"
        content: !unsafe |
          {
            "apiVersion": 1,
            "contactPoints": [
              {
                "orgId": 1,
                "name": "telegram",
                "receivers": [
                  {
                    "uid": "telegram",
                    "type": "telegram",
                    "settings": {
                      "bottoken": "${TELEGRAM_BOT_TOKEN}",
                      "chatid": "${TELEGRAM_CHAT_ID}",
                      "disable_web_page_preview": true,
                      "parse_mode": "HTML",
                      "message": "{{ template \"myguy.message\" . }}"
                    }
                  }
                ]
              }
            ],
            "policies": [
              {
                "orgId": 1,
                "receiver": "telegram",
                "group_by": [
                  "alertname"
                ],
                "group_wait": "30s",
                "group_interval": "5m",
                "repeat_interval": "24h"
              }
            ],
            "groups": [
              {
                "orgId": 1,
                "name": "akalimu",
                "folder": "Alerts",
                "interval": "1m",
                "rules": [
                  {
                    "uid": "site-down",
                    "title": "Site down",
                    "condition": "C",
                    "for": "3m",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "prometheus",
                        "model": {
                          "refId": "A",
                          "expr": "min by (instance) (probe_success{job=~\"site|redirects\"})",
                          "instant": true
                        }
                      },
                      {
                        "refId": "B",
                        "relativeTimeRange": {
                          "from": 1800,
                          "to": 0
                        },
                        "datasourceUid": "loki",
                        "model": {
                          "refId": "B",
                          "expr": "sum(count_over_time({job=\"deploy\"} |= \"start\" [30m])) or vector(0)",
                          "queryType": "instant"
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "lt",
                                "params": [
                                  1
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "Alerting",
                    "execErrState": "Error",
                    "annotations": {
                      "summary": "{{ $labels.instance | html }} is not answering correctly (checked from the monitoring server). {{ if gt $values.B.Value 0.0 }}A deploy started in the last 30 minutes: likely the cause.{{ else }}No deploy in the last 30 minutes.{{ end }}",
                      "next": "Service Logs dashboard; on the app server <code>sudo appctl ps</code>."
                    },
                    "labels": {
                      "severity": "critical"
                    }
                  },
                  {
                    "uid": "cert-expiry",
                    "title": "Certificate expires soon",
                    "condition": "C",
                    "for": "1h",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "prometheus",
                        "model": {
                          "refId": "A",
                          "expr": "min by (instance) ((probe_ssl_earliest_cert_expiry{job=~\"site|redirects\"} - time()) / 86400)",
                          "instant": true
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "lt",
                                "params": [
                                  14
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "OK",
                    "execErrState": "Error",
                    "annotations": {
                      "summary": "The certificate for {{ $labels.instance | html }} expires in {{ humanize $values.A.Value }} days; renewal is failing.",
                      "next": "Run the deploy workflow by hand with scope full: deploy.yml requests missing certificates (see its certbot steps)."
                    },
                    "labels": {
                      "severity": "warning"
                    }
                  },
                  {
                    "uid": "disk-full",
                    "title": "Disk almost full",
                    "condition": "C",
                    "for": "15m",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "prometheus",
                        "model": {
                          "refId": "A",
                          "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})",
                          "instant": true
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "gt",
                                "params": [
                                  85
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "OK",
                    "execErrState": "Error",
                    "annotations": {
                      "summary": "The {{ $labels.instance | html }} server's disk is {{ humanize $values.A.Value }}% full.",
                      "next": "App server: images are pruned each deploy, so look at uploads and Postgres; monitoring: Loki and Prometheus data."
                    },
                    "labels": {
                      "severity": "warning"
                    }
                  },
                  {
                    "uid": "memory-high",
                    "title": "Memory almost full",
                    "condition": "C",
                    "for": "10m",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "prometheus",
                        "model": {
                          "refId": "A",
                          "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
                          "instant": true
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "gt",
                                "params": [
                                  90
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "OK",
                    "execErrState": "Error",
                    "annotations": {
                      "summary": "The {{ $labels.instance | html }} server's memory is {{ humanize $values.A.Value }}% used; containers may be killed.",
                      "next": "App Instance Metrics (memory by container) shows which container."
                    },
                    "labels": {
                      "severity": "warning"
                    }
                  },
                  {
                    "uid": "target-down",
                    "title": "Monitoring target down",
                    "condition": "C",
                    "for": "5m",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "prometheus",
                        "model": {
                          "refId": "A",
                          "expr": "up",
                          "instant": true
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "lt",
                                "params": [
                                  1
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "OK",
                    "execErrState": "Error",
                    "annotations": {
                      "summary": "Prometheus can't reach {{ $labels.job | html }} ({{ $labels.instance | html }}): its dashboard panels are empty.",
                      "next": "On the app server <code>sudo appctl ps</code>; Loki or Jaeger down usually means the monitoring server ran short of memory."
                    },
                    "labels": {
                      "severity": "warning"
                    }
                  },
                  {
                    "uid": "falco",
                    "title": "Falco security alert",
                    "condition": "C",
                    "for": "0m",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "loki",
                        "model": {
                          "refId": "A",
                          "expr": "sum by (rule, output_fields_proc_name, output_fields_container_name) (count_over_time({job=\"falco\", priority=~\"Emergency|Alert|Critical|Error\"} | json [10m]))",
                          "queryType": "instant"
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "gt",
                                "params": [
                                  0
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "OK",
                    "execErrState": "Error",
                    "annotations": {
                      "summary": "Falco rule <code>{{ $labels.rule | html }}</code> fired {{ humanize $values.A.Value }}× on the app server: process <code>{{ $labels.output_fields_proc_name | html }}</code> {{ with $labels.output_fields_container_name }}in container {{ . | html }}{{ else }}on the host{{ end }}.",
                      "next": "Defences dashboard (Falco events), or on the app server <code>journalctl -u 'falco*'</code>."
                    },
                    "labels": {
                      "severity": "critical"
                    }
                  }
                ]
              },
              {
                "orgId": 1,
                "name": "akalimu-logs",
                "folder": "Alerts",
                "interval": "5m",
                "rules": [
                  {
                    "uid": "server-errors",
                    "title": "Server errors",
                    "condition": "C",
                    "for": "0m",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "loki",
                        "model": {
                          "refId": "A",
                          "expr": "sum(count_over_time({job=\"nginx_access\"} | json | status >= 500 [10m]))",
                          "queryType": "instant"
                        }
                      },
                      {
                        "refId": "B",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "loki",
                        "model": {
                          "refId": "B",
                          "expr": "topk(1, sum by (method, uri) (count_over_time({job=\"nginx_access\"} | json | status >= 500 [10m])))",
                          "queryType": "instant"
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "gt",
                                "params": [
                                  10
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "OK",
                    "execErrState": "OK",
                    "annotations": {
                      "summary": "{{ humanize $values.A.Value }} requests failed with a 5xx in the last 10 minutes{{ with $values.B }}, most on <code>{{ .Labels.method | html }} {{ .Labels.uri | html }}</code> ({{ humanize .Value }}){{ end }}.",
                      "next": "Service Logs dashboard for that service; a deploy restarting containers shows as a short burst."
                    },
                    "labels": {
                      "severity": "warning"
                    }
                  },
                  {
                    "uid": "sign-in-surge",
                    "title": "Sign-in code surge",
                    "condition": "C",
                    "for": "0m",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "loki",
                        "model": {
                          "refId": "A",
                          "expr": "sum(count_over_time({job=\"nginx_access\"} | json | method=\"POST\" | uri=\"/api/v1/auth/request-code\" [10m]))",
                          "queryType": "instant"
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "gt",
                                "params": [
                                  30
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "OK",
                    "execErrState": "OK",
                    "annotations": {
                      "summary": "{{ humanize $values.A.Value }} sign-in codes requested in 10 minutes across all clients (normal: ~2 a day). Possible email bombing from many IPs: it uses the Resend quota and the domain's sending reputation. Check the Application Visitors and Service Logs dashboards.",
                      "next": "Defences dashboard (sign-in rate limits) and Service Logs. One IP behind it gets its own message from the security checks."
                    },
                    "labels": {
                      "severity": "warning"
                    }
                  },
                  {
                    "uid": "security-checks-stopped",
                    "title": "Security checks stopped",
                    "condition": "C",
                    "for": "10m",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 1200,
                          "to": 0
                        },
                        "datasourceUid": "loki",
                        "model": {
                          "refId": "A",
                          "expr": "absent_over_time({job=\"security-checks\"} |= \"check ok\" [20m])",
                          "queryType": "instant"
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "gt",
                                "params": [
                                  0
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "OK",
                    "execErrState": "OK",
                    "annotations": {
                      "summary": "The security checks haven't run for 20 minutes: attacks and unexpected SSH logins aren't being reported.",
                      "next": "On the monitoring server: <code>systemctl status myguy-security-check.timer</code> and <code>journalctl -u myguy-security-check</code>."
                    },
                    "labels": {
                      "severity": "warning"
                    }
                  }
                ]
              }
            ],
            "templates": [
              {
                "orgID": 1,
                "name": "myguy",
                "template": "{{ define \"myguy.message\" -}}\n{{ range .Alerts.Firing -}}\n{{ if eq .Labels.severity \"critical\" }}🚨{{ else }}⚠️{{ end }} <b>{{ .Labels.alertname | html }}</b> · {{ .StartsAt | tz \"Europe/Amsterdam\" | date \"Mon 15:04\" }}\n{{ .Annotations.summary }}\n{{ with .Annotations.next }}Next: {{ . }}\n{{ end }}\n{{ end -}}\n{{ range .Alerts.Resolved -}}\n✅ <b>Resolved: {{ .Labels.alertname | html }}</b> · {{ .StartsAt | tz \"Europe/Amsterdam\" | date \"Mon 15:04\" }}–{{ .EndsAt | tz \"Europe/Amsterdam\" | date \"15:04\" }}\n{{ .Annotations.summary }}\n\n{{ end -}}\n{{ end }}"
              }
            ]
          }
      notify: restart grafana
      become: yes

    - name: Warn when Telegram is not configured
      ansible.builtin.debug:
        msg: "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are not set: alerts will not reach Telegram."
      when: (telegram_bot_token | default('')) == '' or (telegram_chat_id | default('')) == ''

    # --- Blackbox prober ---

    - name: Create blackbox config directory
      ansible.builtin.file:
        path: /etc/blackbox
        state: directory
        mode: "0755"
      become: yes

    - name: Write blackbox config
      ansible.builtin.copy:
        dest: /etc/blackbox/blackbox.yml
        mode: "0644"
        content: |
          modules:
            # The page answers 2xx over a valid certificate (redirects followed).
            https_ok:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                fail_if_not_ssl: true
            # An old domain answers 301 over its own valid certificate.
            https_redirect:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                follow_redirects: false
                valid_status_codes: [301]
                fail_if_not_ssl: true
      notify: restart blackbox
      become: yes

    - name: Write Grafana dashboard provisioning config
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/dashboards/default.yml
        mode: "0644"
        content: |
          apiVersion: 1
          providers:
            - name: default
              type: file
              options:
                path: /etc/grafana/dashboards
      become: yes

