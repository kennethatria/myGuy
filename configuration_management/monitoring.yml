    - name: Write Accounts dashboard
      # Counts published by the backend (:9464) and store-service (:9465),
      # scraped as job app_counts.  No names or emails leave the app server.
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/accounts.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Accounts",
            "uid": "accounts",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "stat",
                "title": "Accounts",
                "description": "Accounts that exist. Counted from the databases every minute; history starts when this dashboard was deployed.",
                "gridPos": {
                  "x": 0,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "decimals": 0,
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "max(myguy_accounts)",
                    "instant": true
                  }
                ]
              },
              {
                "type": "stat",
                "title": "New accounts",
                "description": "Accounts created in the selected time range.",
                "gridPos": {
                  "x": 6,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
