# monitoring.yml - Install Tempo, Prometheus, Grafana, and Loki on the monitoring instance
#
# Runs as myguy (inventory ansible_user).  System tasks (apt, file writes under
# /etc/) carry explicit become: yes.  Podman containers run rootlessly as myguy
# so a container escape stays confined to the myguy user.

---
- name: Configure monitoring instance
  hosts: monitoring
  # No play-level become: each task declares its own privilege requirement.

  vars:
    # Run as rootless Podman Quadlet units owned by myguy: systemd starts,
    # restarts and boots each container (linger is enabled in users.yml).
    # memory: a hard limit with no swap.  On this 1 GB server a container
    # that outgrows it is killed and restarted (Restart=always) instead of
    # pushing the whole server into swap, where everything stalls.
    monitoring_containers:
      # Traces: the services send OTLP/HTTP to 4318; Grafana reads 3200.
      # Runs as container root (still the unprivileged myguy on the host)
      # because the image's user can't write a fresh named volume.
      - name: tempo
        memory: 256m
        image: docker.io/grafana/tempo:2.6.1
        ports: ["4318:4318", "3200:3200"]
        user: "0"
        volumes:
          - /etc/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
          - tempo-data:/var/tempo
        exec: -config.file=/etc/tempo/tempo.yml
      - name: prometheus
        memory: 256m
        image: docker.io/prom/prometheus:latest
        ports: ["9090:9090"]
        volumes:
          # The directory, not the file: Ansible replaces prometheus.yml
          # with a new file, and a single-file mount keeps showing the old
          # one, so the HUP reload would reread stale config.
          - /etc/prometheus:/etc/prometheus:ro
      - name: grafana
        memory: 256m
        image: docker.io/grafana/grafana:latest
        ports: ["3000:3000"]
        volumes:
          - /etc/grafana/provisioning:/etc/grafana/provisioning:ro
          - /etc/grafana/dashboards:/etc/grafana/dashboards:ro
          # Users, passwords and preferences survive container replacement
          - grafana-data:/var/lib/grafana
        env:
          GF_AUTH_ANONYMOUS_ENABLED: "false"
          GF_SERVER_HTTP_ADDR: "0.0.0.0"
        # Admin password and Telegram secrets (repository secrets); the
        # alerting provisioning reads the Telegram ones as ${...}.
        env_file: /etc/grafana/grafana.env
      - name: loki
        memory: 320m
        image: docker.io/grafana/loki:2.9.10
        ports: ["3100:3100"]
        volumes:
          - /etc/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
          - loki-data:/loki
        exec: -config.file=/etc/loki/loki-config.yml
      # Umami web analytics.  Umami joins umami-db's network namespace so it
      # reaches Postgres on localhost without depending on Podman DNS; the
      # Umami port (3000 in-container) is therefore published on umami-db.
      # Only the tracker endpoints are public, via nginx on the app instance.
      - name: umami-db
        memory: 128m
        image: docker.io/library/postgres:16-alpine
        ports: ["3001:3000"]
        volumes:
          - umami-db-data:/var/lib/postgresql/data
        env_file: /etc/umami/umami.env
      # Probes the public site from outside the app server (HTTPS answer,
      # certificate expiry) for the Site down / certificate alerts.
      - name: blackbox
        memory: 64m
        image: docker.io/prom/blackbox-exporter:v0.25.0
        ports: ["9115:9115"]
        volumes:
          - /etc/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
        exec: --config.file=/etc/blackbox/blackbox.yml
      - name: umami
        memory: 300m
        image: ghcr.io/umami-software/umami:postgresql-latest
        network: container:umami-db
        env_file: /etc/umami/umami.env
        # Restart with the database: a new umami-db means a new namespace.
        part_of: umami-db

  handlers:
    - name: restart grafana
      ansible.builtin.command:
        cmd: podman restart grafana
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false

    - name: restart loki
      ansible.builtin.command:
        cmd: podman restart loki
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false

    - name: restart blackbox
      ansible.builtin.command:
        cmd: podman restart blackbox
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false
      failed_when: false   # first run: the container starts later in the play

    - name: restart tempo
      ansible.builtin.command:
        cmd: podman restart tempo
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false

  pre_tasks:
    # Grafana would otherwise start with admin / admin
    - name: Require the Grafana admin password
      ansible.builtin.assert:
        that: grafana_admin_password | default('') | length >= 12
        fail_msg: "Set the GRAFANA_ADMIN_PASSWORD repository secret (12+ characters) before running monitoring.yml."
        quiet: true

    - name: Get myguy user ID for XDG_RUNTIME_DIR
      ansible.builtin.command:
        cmd: id -u myguy
      register: app_user_uid_result
      changed_when: false

    - name: Set XDG_RUNTIME_DIR fact
      ansible.builtin.set_fact:
        app_user_uid: "{{ app_user_uid_result.stdout }}"
        xdg_runtime_dir: "/run/user/{{ app_user_uid_result.stdout }}"
        user_systemd_dir: "/home/myguy/.config/systemd/user"
        quadlet_dir: "/home/myguy/.config/containers/systemd"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      become: yes

    - name: Enable universe repository
      ansible.builtin.apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_facts['distribution_release'] }} universe"
        state: present
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    - name: Update apt cache after enabling universe
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    - name: Install Podman
      ansible.builtin.apt:
        name: podman
        state: present
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    # --- Journal size ---
    # Uncapped, journald grows its files (and their memory mappings) to ~10%
    # of the disk; on a 1 GB server that memory matters more than old logs.

    - name: Create journald drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"
      become: yes

    - name: Cap systemd journal size
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/size.conf
        mode: "0644"
        content: |
          [Journal]
          SystemMaxUse=100M
          SystemMaxFileSize=20M
      become: yes
      register: journald_conf

    - name: Apply journal cap now
      when: journald_conf.changed
      become: yes
      block:
        - name: Restart journald
          ansible.builtin.systemd:
            name: systemd-journald
            state: restarted

        - name: Trim existing journal files to the cap
          ansible.builtin.command:
            cmd: journalctl --vacuum-size=100M

    - name: Create user systemd directory for myguy
      ansible.builtin.file:
        path: "{{ user_systemd_dir }}"
        state: directory
        owner: myguy
        group: myguy
        mode: "0755"
      become: yes

    - name: Set otel_endpoint fact for use by other plays
      ansible.builtin.set_fact:
        otel_endpoint: "http://{{ ansible_host }}:4318"

    # --- node_exporter (this server's CPU, memory and disk) ---

    - name: Install node_exporter
      ansible.builtin.include_tasks:
        file: tasks/node_exporter.yml
        apply:
          become: yes

    # --- Prometheus ---

    - name: Create Prometheus config directory
      ansible.builtin.file:
        path: /etc/prometheus
        state: directory
        mode: "0755"
      become: yes

    - name: Write Prometheus config
      ansible.builtin.copy:
        dest: /etc/prometheus/prometheus.yml
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: node_exporter
              static_configs:
                - targets: ['{{ instance_vpc_ip }}:{{ node_exporter_port }}']
                  labels:
                    instance: app
                # This server's own node_exporter, reached from the container.
                - targets: ['host.containers.internal:{{ node_exporter_port }}']
                  labels:
                    instance: monitoring

            - job_name: falco
              static_configs:
                - targets: ['{{ instance_vpc_ip }}:{{ falco_metrics_port }}']
                  labels:
                    instance: app

            # Account and marketplace counts (internal/metrics in each service).
            - job_name: app_counts
              scrape_interval: 60s
              static_configs:
                - targets: ['{{ instance_vpc_ip }}:9464']
                  labels:
                    service: backend
                - targets: ['{{ instance_vpc_ip }}:9465']
                  labels:
                    service: store-service

            # Tempo's own counters: spans received shows tracing works.
            # The public site, probed through blackbox (role: what users see).
            - job_name: site
              metrics_path: /probe
              params:
                module: [https_ok]
              static_configs:
                - targets:
                    - https://{{ domain }}/
                    - https://{{ domain }}/health
              relabel_configs: &blackbox_relabel
                - source_labels: [__address__]
                  target_label: __param_target
                - source_labels: [__param_target]
                  target_label: instance
                - target_label: __address__
                  replacement: host.containers.internal:9115

            # Old domains: answer with a redirect, over a valid certificate.
            - job_name: redirects
              metrics_path: /probe
              params:
                module: [https_redirect]
              static_configs:
                - targets: {{ (hostvars[groups['app'][0]].redirect_domains | default([])) | map('regex_replace', '^(.*)$', 'https://\\1/') | list | to_json }}
              relabel_configs: *blackbox_relabel

            - job_name: tempo
              static_configs:
                - targets: ['host.containers.internal:3200']

            # Memory and CPU per app container (observability.yml).
            - job_name: podman
              static_configs:
                - targets: ['{{ instance_vpc_ip }}:9882']
                  labels:
                    instance: app

            # Loki's own health, so "Monitoring target down" covers it too.
            - job_name: loki
              static_configs:
                - targets: ['host.containers.internal:3100']
      become: yes

    # --- Grafana provisioning files ---

    - name: Create Grafana provisioning directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/grafana/provisioning/datasources
        - /etc/grafana/provisioning/dashboards
        - /etc/grafana/dashboards
      become: yes

    - name: Write Grafana secrets
      ansible.builtin.copy:
        dest: /etc/grafana/grafana.env
        content: |
          GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}
          TELEGRAM_BOT_TOKEN={{ telegram_bot_token | default('') }}
          TELEGRAM_CHAT_ID={{ telegram_chat_id | default('') }}
        owner: myguy
        group: myguy
        mode: "0600"
      no_log: true
      notify: restart grafana
      become: yes

    - name: Remove the old Grafana admin env file
      ansible.builtin.file:
        path: /etc/grafana/admin.env
        state: absent
      become: yes

    - name: Write Grafana Prometheus datasource
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              uid: prometheus
              access: proxy
              url: http://host.containers.internal:9090
              isDefault: true
      notify: restart grafana
      become: yes

    - name: Write Grafana Loki datasource
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/loki.yml
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://host.containers.internal:3100
              isDefault: false
      notify: restart grafana
      become: yes

    - name: Write Grafana Tempo datasource
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/tempo.yml
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://host.containers.internal:3200
              isDefault: false
      notify: restart grafana
      become: yes

    # --- Alerts (sent to Telegram) ---

    - name: Create Grafana alerting provisioning directory
      ansible.builtin.file:
        path: /etc/grafana/provisioning/alerting
        state: directory
        mode: "0755"
      become: yes

    - name: Write Grafana alert rules and Telegram contact point
      # The bot token and chat id come from grafana.env (${...} below), so
      # no secret is in this file.  Without them the rules still show in
      # Grafana > Alerting, but nothing reaches Telegram.
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/alerting/alerts.yml
        mode: "0644"
        content: !unsafe |
          {
            "apiVersion": 1,
            "contactPoints": [
              {
                "orgId": 1,
                "name": "telegram",
                "receivers": [
                  {
                    "uid": "telegram",
                    "type": "telegram",
                    "settings": {
                      "bottoken": "${TELEGRAM_BOT_TOKEN}",
                      "chatid": "${TELEGRAM_CHAT_ID}",
                      "disable_web_page_preview": true
                    }
                  }
                ]
              }
            ],
            "policies": [
              {
                "orgId": 1,
                "receiver": "telegram",
                "group_by": [
                  "alertname"
                ],
                "group_wait": "30s",
                "group_interval": "5m",
                "repeat_interval": "12h"
              }
            ],
            "groups": [
              {
                "orgId": 1,
                "name": "akalimu",
                "folder": "Alerts",
                "interval": "1m",
                "rules": [
                  {
                    "uid": "site-down",
                    "title": "Site down",
                    "condition": "C",
                    "for": "3m",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "prometheus",
                        "model": {
                          "refId": "A",
                          "expr": "min by (instance) (probe_success{job=~\"site|redirects\"})",
                          "instant": true
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "lt",
                                "params": [
                                  1
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "Alerting",
                    "execErrState": "Error",
                    "annotations": {
                      "summary": "{{ $labels.instance }} is not answering correctly (checked from the monitoring server)."
                    },
                    "labels": {
                      "severity": "critical"
                    }
                  },
                  {
                    "uid": "cert-expiry",
                    "title": "Certificate expires soon",
                    "condition": "C",
                    "for": "1h",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "prometheus",
                        "model": {
                          "refId": "A",
                          "expr": "min by (instance) ((probe_ssl_earliest_cert_expiry{job=~\"site|redirects\"} - time()) / 86400)",
                          "instant": true
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "lt",
                                "params": [
                                  14
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "OK",
                    "execErrState": "Error",
                    "annotations": {
                      "summary": "The certificate for {{ $labels.instance }} expires in {{ humanize $values.A.Value }} days; renewal is failing."
                    },
                    "labels": {
                      "severity": "warning"
                    }
                  },
                  {
                    "uid": "server-errors",
                    "title": "Server errors",
                    "condition": "C",
                    "for": "0m",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "loki",
                        "model": {
                          "refId": "A",
                          "expr": "sum(count_over_time({job=\"nginx_access\"} | json | status >= 500 [10m]))",
                          "queryType": "instant"
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "gt",
                                "params": [
                                  10
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "OK",
                    "execErrState": "OK",
                    "annotations": {
                      "summary": "{{ humanize $values.A.Value }} requests failed with a 5xx in the last 10 minutes. See Service Logs."
                    },
                    "labels": {
                      "severity": "warning"
                    }
                  },
                  {
                    "uid": "disk-full",
                    "title": "Disk almost full",
                    "condition": "C",
                    "for": "15m",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "prometheus",
                        "model": {
                          "refId": "A",
                          "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})",
                          "instant": true
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "gt",
                                "params": [
                                  85
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "OK",
                    "execErrState": "Error",
                    "annotations": {
                      "summary": "The {{ $labels.instance }} server's disk is {{ humanize $values.A.Value }}% full."
                    },
                    "labels": {
                      "severity": "warning"
                    }
                  },
                  {
                    "uid": "memory-high",
                    "title": "Memory almost full",
                    "condition": "C",
                    "for": "10m",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "prometheus",
                        "model": {
                          "refId": "A",
                          "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
                          "instant": true
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "gt",
                                "params": [
                                  90
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "OK",
                    "execErrState": "Error",
                    "annotations": {
                      "summary": "The {{ $labels.instance }} server's memory is {{ humanize $values.A.Value }}% used; containers may be killed."
                    },
                    "labels": {
                      "severity": "warning"
                    }
                  },
                  {
                    "uid": "target-down",
                    "title": "Monitoring target down",
                    "condition": "C",
                    "for": "5m",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "prometheus",
                        "model": {
                          "refId": "A",
                          "expr": "up",
                          "instant": true
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "lt",
                                "params": [
                                  1
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "OK",
                    "execErrState": "Error",
                    "annotations": {
                      "summary": "Prometheus can't reach {{ $labels.job }} ({{ $labels.instance }}): its dashboard panels are empty."
                    },
                    "labels": {
                      "severity": "warning"
                    }
                  },
                  {
                    "uid": "falco",
                    "title": "Falco security alert",
                    "condition": "C",
                    "for": "0m",
                    "data": [
                      {
                        "refId": "A",
                        "relativeTimeRange": {
                          "from": 600,
                          "to": 0
                        },
                        "datasourceUid": "prometheus",
                        "model": {
                          "refId": "A",
                          "expr": "sum by (rule_name, priority) (increase(falcosecurity_falco_rules_matches_total[10m]))",
                          "instant": true
                        }
                      },
                      {
                        "refId": "C",
                        "datasourceUid": "__expr__",
                        "model": {
                          "refId": "C",
                          "type": "threshold",
                          "expression": "A",
                          "conditions": [
                            {
                              "evaluator": {
                                "type": "gt",
                                "params": [
                                  0
                                ]
                              }
                            }
                          ]
                        }
                      }
                    ],
                    "noDataState": "OK",
                    "execErrState": "Error",
                    "annotations": {
                      "summary": "Falco rule '{{ $labels.rule_name }}' ({{ $labels.priority }}) fired on the app server."
                    },
                    "labels": {
                      "severity": "critical"
                    }
                  }
                ]
              }
            ]
          }
      notify: restart grafana
      become: yes

    - name: Warn when Telegram is not configured
      ansible.builtin.debug:
        msg: "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are not set: alerts will not reach Telegram."
      when: (telegram_bot_token | default('')) == '' or (telegram_chat_id | default('')) == ''

    # --- Blackbox prober ---

    - name: Create blackbox config directory
      ansible.builtin.file:
        path: /etc/blackbox
        state: directory
        mode: "0755"
      become: yes

    - name: Write blackbox config
      ansible.builtin.copy:
        dest: /etc/blackbox/blackbox.yml
        mode: "0644"
        content: |
          modules:
            # The page answers 2xx over a valid certificate (redirects followed).
            https_ok:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                fail_if_not_ssl: true
            # An old domain answers 301 over its own valid certificate.
            https_redirect:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                follow_redirects: false
                valid_status_codes: [301]
                fail_if_not_ssl: true
      notify: restart blackbox
      become: yes

    - name: Write Grafana dashboard provisioning config
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/dashboards/default.yml
        mode: "0644"
        content: |
          apiVersion: 1
          providers:
            - name: default
              type: file
              options:
