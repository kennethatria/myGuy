                "gridPos": {
                  "x": 16,
                  "y": 5,
                  "w": 8,
                  "h": 9
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent",
                    "min": 0,
                    "max": 100,
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    },
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 75
                        },
                        {
                          "color": "red",
                          "value": 85
                        }
                      ]
                    },
                    "custom": {
                      "lineWidth": 2,
                      "fillOpacity": 0,
                      "thresholdsStyle": {
                        "mode": "area"
                      }
                    }
                  }
                },
                "options": {
                  "legend": {
                    "showLegend": false
                  },
                  "tooltip": {
                    "mode": "single"
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "legendFormat": "Disk",
                    "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\", instance=\"monitoring\"} / node_filesystem_size_bytes{mountpoint=\"/\", instance=\"monitoring\"})"
