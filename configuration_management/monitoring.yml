                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Disk used over time",
                "description": "A steady climb means something is filling the disk (uploads, logs, old images).",
                "gridPos": {
                  "x": 16,
                  "y": 5,
                  "w": 8,
                  "h": 9
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent",
                    "min": 0,
                    "max": 100,
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    },
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 75
                        },
                        {
                          "color": "red",
                          "value": 85
                        }
                      ]
                    },
                    "custom": {
                      "lineWidth": 2,
                      "fillOpacity": 0,
                      "thresholdsStyle": {
                        "mode": "area"
                      }
                    }
                  }
                },
                "options": {
                  "legend": {
                    "showLegend": false
                  },
                  "tooltip": {
                    "mode": "single"
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "legendFormat": "Disk",
                    "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\", instance=\"app\"} / node_filesystem_size_bytes{mountpoint=\"/\", instance=\"app\"})"
                  }
                ]
              },
              {
                "type": "bargauge",
                "title": "Memory by container now",
                "description": "Which service is using the server's memory. The app server has 1 GB in total.",
                "gridPos": {
                  "x": 0,
                  "y": 14,
                  "w": 8,
                  "h": 10
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "bytes",
                    "decimals": 0,
                    "min": 0,
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                },
                "options": {
                  "orientation": "horizontal",
                  "displayMode": "basic",
                  "namePlacement": "left",
                  "showUnfilled": true,
                  "valueMode": "text",
                  "reduceOptions": {
                    "values": false,
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sort_desc(sum by (name) (podman_container_mem_usage_bytes{instance=\"app\"}))",
                    "legendFormat": "{{name}}",
                    "instant": true
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Memory by container over time",
                "description": "A line that keeps climbing is a service leaking memory.",
                "gridPos": {
                  "x": 8,
                  "y": 14,
                  "w": 16,
                  "h": 10
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "bytes",
                    "min": 0,
                    "custom": {
                      "lineWidth": 1,
                      "fillOpacity": 0
                    }
                  }
                },
                "options": {
                  "legend": {
                    "showLegend": true,
                    "displayMode": "table",
                    "placement": "right",
                    "calcs": [
                      "lastNotNull",
                      "max"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi",
                    "sort": "desc"
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum by (name) (podman_container_mem_usage_bytes{instance=\"app\"})",
                    "legendFormat": "{{name}}"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "CPU by container",
                "description": "Share of the server's one CPU each container uses. 100% means it alone keeps the CPU busy.",
                "gridPos": {
                  "x": 0,
                  "y": 24,
                  "w": 24,
                  "h": 9
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent",
                    "min": 0,
                    "custom": {
                      "lineWidth": 1,
                      "fillOpacity": 0
                    }
                  }
                },
                "options": {
                  "legend": {
                    "showLegend": true,
                    "displayMode": "table",
                    "placement": "right",
                    "calcs": [
                      "mean",
                      "max"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi",
                    "sort": "desc"
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "100 * sum by (name) (rate(podman_container_cpu_seconds_total{instance=\"app\"}[5m]))",
                    "legendFormat": "{{name}}"
                  }
                ]
              }
            ],
            "time": {
              "from": "now-24h",
              "to": "now"
            },
            "refresh": "1m"
          }
      become: yes

