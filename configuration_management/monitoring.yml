                "fieldConfig": {
                  "defaults": {
                    "unit": "percent",
                    "min": 0,
                    "max": 100,
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    },
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 80
                        },
                        {
                          "color": "red",
                          "value": 90
                        }
                      ]
                    },
                    "custom": {
