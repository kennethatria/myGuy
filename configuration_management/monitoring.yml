    - name: Write node exporter dashboard
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/node-exporter.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "App Instance Metrics",
            "uid": "node-exporter",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "stat",
                "title": "CPU busy now",
                "description": "How hard the app server's processors are working. Under 70% is healthy; sustained over 90% means requests will slow down.",
                "gridPos": {
                  "x": 0,
                  "y": 0,
                  "w": 8,
                  "h": 5
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent",
                    "decimals": 0,
                    "min": 0,
                    "max": 100,
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 70
                        },
                        {
                          "color": "red",
                          "value": 90
                        }
                      ]
                    }
                  }
                },
                "options": {
                  "colorMode": "background",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\", instance=\"app\"}[5m])))"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Memory used now",
                "description": "Share of RAM in use (page cache the kernel can free is not counted). Under 80% is healthy; near 100% the kernel starts killing containers.",
                "gridPos": {
                  "x": 8,
                  "y": 0,
                  "w": 8,
                  "h": 5
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent",
                    "decimals": 0,
                    "min": 0,
                    "max": 100,
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 80
                        },
                        {
                          "color": "red",
                          "value": 90
                        }
                      ]
                    }
                  }
                },
                "options": {
                  "colorMode": "background",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "100 * (1 - node_memory_MemAvailable_bytes{instance=\"app\"} / node_memory_MemTotal_bytes{instance=\"app\"})"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Disk used now",
                "description": "Share of the main disk in use. Uploads, Postgres and container images all live here. Act before 85%: a full disk stops the database.",
                "gridPos": {
                  "x": 16,
                  "y": 0,
                  "w": 8,
                  "h": 5
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent",
                    "decimals": 0,
                    "min": 0,
                    "max": 100,
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
