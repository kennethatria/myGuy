# monitoring.yml - Install Tempo, Prometheus, Grafana, and Loki on the monitoring instance
#
# Runs as myguy (inventory ansible_user).  System tasks (apt, file writes under
# /etc/) carry explicit become: yes.  Podman containers run rootlessly as myguy
# so a container escape stays confined to the myguy user.

---
- name: Configure monitoring instance
  hosts: monitoring
  # No play-level become: each task declares its own privilege requirement.

  vars:
    # Run as rootless Podman Quadlet units owned by myguy: systemd starts,
    # restarts and boots each container (linger is enabled in users.yml).
    monitoring_containers:
      # Traces: the services send OTLP/HTTP to 4318; Grafana reads 3200.
      # Runs as container root (still the unprivileged myguy on the host)
      # because the image's user can't write a fresh named volume.
      - name: tempo
        image: docker.io/grafana/tempo:2.6.1
        ports: ["4318:4318", "3200:3200"]
        user: "0"
        volumes:
          - /etc/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
          - tempo-data:/var/tempo
        exec: -config.file=/etc/tempo/tempo.yml
      - name: prometheus
        image: docker.io/prom/prometheus:latest
        ports: ["9090:9090"]
        volumes:
          - /etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - name: grafana
        image: docker.io/grafana/grafana:latest
        ports: ["3000:3000"]
        volumes:
          - /etc/grafana/provisioning:/etc/grafana/provisioning:ro
          - /etc/grafana/dashboards:/etc/grafana/dashboards:ro
        env:
          GF_AUTH_ANONYMOUS_ENABLED: "false"
          GF_SERVER_HTTP_ADDR: "0.0.0.0"
      - name: loki
        image: docker.io/grafana/loki:2.9.10
        ports: ["3100:3100"]
        volumes:
          - /etc/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
          - loki-data:/loki
        exec: -config.file=/etc/loki/loki-config.yml
      # Umami web analytics.  Umami joins umami-db's network namespace so it
      # reaches Postgres on localhost without depending on Podman DNS; the
      # Umami port (3000 in-container) is therefore published on umami-db.
      # Only the tracker endpoints are public, via nginx on the app instance.
      - name: umami-db
        image: docker.io/library/postgres:16-alpine
        ports: ["3001:3000"]
        volumes:
          - umami-db-data:/var/lib/postgresql/data
        env_file: /etc/umami/umami.env
      - name: umami
        image: ghcr.io/umami-software/umami:postgresql-latest
        network: container:umami-db
        env_file: /etc/umami/umami.env
        # Restart with the database: a new umami-db means a new namespace.
        part_of: umami-db

  handlers:
    - name: restart grafana
      ansible.builtin.command:
        cmd: podman restart grafana
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false

    - name: restart loki
      ansible.builtin.command:
        cmd: podman restart loki
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false

    - name: restart tempo
      ansible.builtin.command:
        cmd: podman restart tempo
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false

  pre_tasks:
    - name: Get myguy user ID for XDG_RUNTIME_DIR
      ansible.builtin.command:
        cmd: id -u myguy
      register: app_user_uid_result
      changed_when: false

    - name: Set XDG_RUNTIME_DIR fact
      ansible.builtin.set_fact:
        app_user_uid: "{{ app_user_uid_result.stdout }}"
        xdg_runtime_dir: "/run/user/{{ app_user_uid_result.stdout }}"
        user_systemd_dir: "/home/myguy/.config/systemd/user"
        quadlet_dir: "/home/myguy/.config/containers/systemd"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      become: yes

    - name: Enable universe repository
      ansible.builtin.apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_facts['distribution_release'] }} universe"
        state: present
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    - name: Update apt cache after enabling universe
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    - name: Install Podman
      ansible.builtin.apt:
        name: podman
        state: present
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    # --- Journal size ---
    # Uncapped, journald grows its files (and their memory mappings) to ~10%
    # of the disk; on a 1 GB server that memory matters more than old logs.

    - name: Create journald drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"
      become: yes

    - name: Cap systemd journal size
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/size.conf
        mode: "0644"
        content: |
          [Journal]
          SystemMaxUse=100M
          SystemMaxFileSize=20M
      become: yes
      register: journald_conf

    - name: Apply journal cap now
      when: journald_conf.changed
      become: yes
      block:
        - name: Restart journald
          ansible.builtin.systemd:
            name: systemd-journald
            state: restarted

        - name: Trim existing journal files to the cap
          ansible.builtin.command:
            cmd: journalctl --vacuum-size=100M

    - name: Create user systemd directory for myguy
      ansible.builtin.file:
        path: "{{ user_systemd_dir }}"
        state: directory
        owner: myguy
        group: myguy
        mode: "0755"
      become: yes

    - name: Set otel_endpoint fact for use by other plays
      ansible.builtin.set_fact:
        otel_endpoint: "http://{{ ansible_host }}:4318"

    # --- Prometheus ---

    - name: Create Prometheus config directory
      ansible.builtin.file:
        path: /etc/prometheus
        state: directory
        mode: "0755"
      become: yes

    - name: Write Prometheus config
      ansible.builtin.copy:
        dest: /etc/prometheus/prometheus.yml
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: node_exporter
              static_configs:
                - targets: ['{{ instance_vpc_ip }}:{{ node_exporter_port }}']
                  labels:
                    instance: app

            - job_name: falco
              static_configs:
                - targets: ['{{ instance_vpc_ip }}:{{ falco_metrics_port }}']
                  labels:
                    instance: app
      become: yes

    # --- Grafana provisioning files ---

    - name: Create Grafana provisioning directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/grafana/provisioning/datasources
        - /etc/grafana/provisioning/dashboards
        - /etc/grafana/dashboards
      become: yes

    - name: Write Grafana Prometheus datasource
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://host.containers.internal:9090
              isDefault: true
      notify: restart grafana
      become: yes

    - name: Write Grafana Loki datasource
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/loki.yml
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://host.containers.internal:3100
              isDefault: false
      notify: restart grafana
      become: yes

    - name: Write Grafana Tempo datasource
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/tempo.yml
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://host.containers.internal:3200
              isDefault: false
      notify: restart grafana
      become: yes

    - name: Write Grafana dashboard provisioning config
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/dashboards/default.yml
        mode: "0644"
        content: |
          apiVersion: 1
          providers:
            - name: default
              type: file
              options:
                path: /etc/grafana/dashboards
      become: yes

    - name: Write node exporter dashboard
      # Plain-language health board: a "now" number per resource coloured
      # green / amber / red, then the same resource over time on a fixed
      # 0-100 % scale so a flat line reads as calm, not as a scary zoom.
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/node-exporter.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "App Instance Metrics",
            "uid": "node-exporter",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "stat",
                "title": "CPU busy now",
                "description": "How hard the app server's processors are working. Under 70% is healthy; sustained over 90% means requests will slow down.",
                "gridPos": { "x": 0, "y": 0, "w": 8, "h": 5 },
                "fieldConfig": { "defaults": { "unit": "percent", "decimals": 0, "min": 0, "max": 100,
                  "thresholds": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null }, { "color": "orange", "value": 70 }, { "color": "red", "value": 90 } ] } } },
                "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
                "targets": [ { "refId": "A", "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))" } ]
              },
              {
                "type": "stat",
                "title": "Memory used now",
                "description": "Share of RAM in use (page cache the kernel can free is not counted). Under 80% is healthy; near 100% the kernel starts killing containers.",
                "gridPos": { "x": 8, "y": 0, "w": 8, "h": 5 },
                "fieldConfig": { "defaults": { "unit": "percent", "decimals": 0, "min": 0, "max": 100,
                  "thresholds": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null }, { "color": "orange", "value": 80 }, { "color": "red", "value": 90 } ] } } },
                "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
                "targets": [ { "refId": "A", "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)" } ]
              },
              {
                "type": "stat",
                "title": "Disk used now",
                "description": "Share of the main disk in use. Uploads, Postgres and container images all live here. Act before 85%: a full disk stops the database.",
                "gridPos": { "x": 16, "y": 0, "w": 8, "h": 5 },
                "fieldConfig": { "defaults": { "unit": "percent", "decimals": 0, "min": 0, "max": 100,
                  "thresholds": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null }, { "color": "orange", "value": 75 }, { "color": "red", "value": 85 } ] } } },
                "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
                "targets": [ { "refId": "A", "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})" } ]
              },
              {
                "type": "timeseries",
                "title": "CPU busy over time",
                "description": "Shaded bands: green is healthy, amber is busy, red is overloaded.",
                "gridPos": { "x": 0, "y": 5, "w": 8, "h": 9 },
                "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "color": { "mode": "fixed", "fixedColor": "text" },
                  "thresholds": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null }, { "color": "orange", "value": 70 }, { "color": "red", "value": 90 } ] },
                  "custom": { "lineWidth": 2, "fillOpacity": 0, "thresholdsStyle": { "mode": "area" } } } },
                "options": { "legend": { "showLegend": false }, "tooltip": { "mode": "single" } },
                "targets": [ { "refId": "A", "legendFormat": "CPU", "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))" } ]
              },
              {
                "type": "timeseries",
                "title": "Memory used over time",
                "description": "Shaded bands: green is healthy, amber is tight, red is close to running out.",
                "gridPos": { "x": 8, "y": 5, "w": 8, "h": 9 },
                "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "color": { "mode": "fixed", "fixedColor": "text" },
                  "thresholds": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null }, { "color": "orange", "value": 80 }, { "color": "red", "value": 90 } ] },
                  "custom": { "lineWidth": 2, "fillOpacity": 0, "thresholdsStyle": { "mode": "area" } } } },
                "options": { "legend": { "showLegend": false }, "tooltip": { "mode": "single" } },
                "targets": [ { "refId": "A", "legendFormat": "Memory", "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)" } ]
              },
              {
                "type": "timeseries",
                "title": "Disk used over time",
                "description": "A steady climb means something is filling the disk (uploads, logs, old images).",
                "gridPos": { "x": 16, "y": 5, "w": 8, "h": 9 },
                "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "color": { "mode": "fixed", "fixedColor": "text" },
                  "thresholds": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null }, { "color": "orange", "value": 75 }, { "color": "red", "value": 85 } ] },
                  "custom": { "lineWidth": 2, "fillOpacity": 0, "thresholdsStyle": { "mode": "area" } } } },
                "options": { "legend": { "showLegend": false }, "tooltip": { "mode": "single" } },
                "targets": [ { "refId": "A", "legendFormat": "Disk", "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})" } ]
              }
            ],
            "time": { "from": "now-24h", "to": "now" },
            "refresh": "1m"
          }
      become: yes

    - name: Write Falco security alerts dashboard
      # Falco (0.38+) exports rule hits as falcosecurity_falco_rules_matches_total,
      # a series that only appears once a rule first fires, so the stat falls
      # back to 0 and "Falco running" shows the 0 is real, not a dead scrape.
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/falco.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Falco Security Alerts",
            "uid": "falco-alerts",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "stat",
                "title": "Falco running",
                "description": "Whether Prometheus can reach Falco on the app server. If this is Down, an alert count of 0 means nothing.",
                "gridPos": { "x": 0, "y": 0, "w": 8, "h": 5 },
                "fieldConfig": { "defaults": {
                  "mappings": [ { "type": "value", "options": {
                    "0": { "text": "Down", "color": "red" }, "1": { "text": "Running", "color": "green" } } } ],
                  "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } } },
                "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
                "targets": [ { "refId": "A", "expr": "max(up{job=\"falco\"}) or vector(0)" } ]
              },
              {
                "type": "stat",
                "title": "Alerts in this time range",
                "description": "Suspicious activity Falco caught on the app server (unexpected shells, sensitive file reads, privilege changes). 0 is normal.",
                "gridPos": { "x": 8, "y": 0, "w": 16, "h": 5 },
                "fieldConfig": { "defaults": { "decimals": 0,
                  "thresholds": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 10 } ] } } },
                "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
                "targets": [ { "refId": "A", "instant": true,
                  "expr": "sum(increase(falcosecurity_falco_rules_matches_total[$__range])) or vector(0)" } ]
              },
              {
                "type": "timeseries",
                "title": "Alerts by rule",
                "description": "Which Falco rules fired and when. Empty means no alerts.",
                "gridPos": { "x": 0, "y": 5, "w": 24, "h": 9 },
                "fieldConfig": { "defaults": { "decimals": 0, "noValue": "No alerts",
                  "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } } } },
                "targets": [ { "refId": "A", "legendFormat": "{{priority}} · {{rule_name}}",
                  "expr": "sum by (priority, rule_name) (increase(falcosecurity_falco_rules_matches_total[$__interval]))" } ]
              }
            ],
            "time": { "from": "now-24h", "to": "now" },
            "refresh": "1m"
          }
      become: yes

    - name: Write WAF dashboard
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/waf-modsecurity.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "WAF - ModSecurity Detections",
            "uid": "waf-modsecurity",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "logs",
                "title": "Recent Detections",
                "gridPos": { "x": 0, "y": 0, "w": 24, "h": 10 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "expr": "{job=\"modsecurity\"} |~ \"ModSecurity: Warning\"",
                    "refId": "A"
                  }
                ],
                "options": {
                  "showLabels": true,
                  "showTime": true,
                  "wrapLogMessage": true
                }
              },
              {
                "type": "timeseries",
                "title": "Requests Exceeding Anomaly Threshold",
                "gridPos": { "x": 0, "y": 10, "w": 16, "h": 8 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "expr": "sum(count_over_time({job=\"modsecurity\"} |~ \"Anomaly Score Exceeded\"[5m]))",
                    "legendFormat": "detections",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Total Detections (last 1h)",
                "gridPos": { "x": 16, "y": 10, "w": 8, "h": 8 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "expr": "sum(count_over_time({job=\"modsecurity\"} |~ \"Anomaly Score Exceeded\"[1h]))",
                    "refId": "A"
                  }
                ]
              }
            ],
            "time": { "from": "now-6h", "to": "now" },
            "refresh": "30s"
          }
      notify: restart grafana
      become: yes

    - name: Write Visitors dashboard
      # Built from the nginx JSON access log (job="nginx_access").  Any unknown
      # path is answered with the app page, so scanners posing as browsers
      # would count as visitors; a visitor is therefore an IP whose browser
      # ran the app (downloaded /assets/*.js or made a successful API call).
      # Visitors are approximated by distinct client IP.
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/visitors.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Visitors",
            "uid": "visitors",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "stat",
                "title": "Visitors",
                "description": "People whose browser actually ran the app (downloaded its code or used it signed in), counted by IP address. Scanners that only fetch the home page are left out.",
                "gridPos": {
                  "x": 0,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "count(count by (remote_addr) (count_over_time({job=\"nginx_access\"} | json | uri =~ \"/assets/.*[.]js|/(api|store/api|chat/api)/.*\" | status < 400 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range])))"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Signed-in users",
                "description": "IP addresses that used the app while signed in (made a successful API call).",
                "gridPos": {
                  "x": 6,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "count(count by (remote_addr) (count_over_time({job=\"nginx_access\"} | json | uri =~ \"/(api|store/api|chat/api)/.*\" | status < 400 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range])))"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "App requests",
                "description": "Successful calls the app made to the backend, store and chat. A good measure of how much the app is used.",
                "gridPos": {
                  "x": 12,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | uri =~ \"/(api|store/api|chat/api)/.*\" | status < 400 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range]))"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Server errors (5xx)",
                "description": "Requests the server failed to answer. Should be close to 0; see Service Logs for the cause.",
                "gridPos": {
                  "x": 18,
                  "y": 0,
                  "w": 6,
                  "h": 5
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "decimals": 0,
                    "color": {
                      "mode": "thresholds"
                    },
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        }
                      ]
                    }
                  }
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | status >= 500 [$__range])) or vector(0)"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Visitors per hour",
                "gridPos": {
                  "x": 0,
                  "y": 5,
                  "w": 12,
                  "h": 8
                },
                "interval": "1h",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "custom": {
                      "drawStyle": "bars",
                      "fillOpacity": 60
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "legend": {
                    "showLegend": false
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "legendFormat": "visitors",
                    "expr": "count(count by (remote_addr) (count_over_time({job=\"nginx_access\"} | json | uri =~ \"/assets/.*[.]js|/(api|store/api|chat/api)/.*\" | status < 400 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [1h])))"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "App requests per hour",
                "description": "Activity: how much the app was used each hour.",
                "gridPos": {
                  "x": 12,
                  "y": 5,
                  "w": 12,
                  "h": 8
                },
                "interval": "1h",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "custom": {
                      "drawStyle": "bars",
                      "fillOpacity": 60
                    },
                    "decimals": 0
                  }
                },
                "options": {
                  "legend": {
                    "showLegend": false
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "legendFormat": "requests",
                    "expr": "sum(count_over_time({job=\"nginx_access\"} | json | uri =~ \"/(api|store/api|chat/api)/.*\" | status < 400 | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [1h]))"
                  }
                ]
              },
              {
                "type": "bargauge",
                "title": "Pages opened directly",
                "description": "App pages loaded from a link, bookmark or refresh (moving around inside the app isn't counted). The home page includes scanners.",
                "gridPos": {
                  "x": 0,
                  "y": 13,
                  "w": 12,
                  "h": 10
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "displayName": "${__field.labels.uri}",
                    "decimals": 0,
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    },
                    "min": 0
                  }
                },
                "options": {
                  "orientation": "horizontal",
                  "displayMode": "basic",
                  "namePlacement": "left",
                  "showUnfilled": true,
                  "valueMode": "text",
                  "reduceOptions": {
                    "values": false,
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "sort_desc(topk(10, sum by (uri) (count_over_time({job=\"nginx_access\"} | json | method=\"GET\" | status < 400 | uri =~ \"/(dashboard|login|register|messages|profile(/[0-9]+)?|reviews(/[0-9]+|/create/[0-9]+)?|my-gigs(/(created|assigned|applications))?|store(/new|/[0-9]+|/requests/(new|[0-9]+))?|tasks(/create|/[0-9]+)?|(edit|posted)/(task|item|request)/[0-9]+)?/?\" | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" [$__range]))))"
                  }
                ]
              },
              {
                "type": "bargauge",
                "title": "Top referrers",
                "description": "Sites people came from (links to the bare server IP, used by scanners, are left out). Includes your own domain for internal links.",
                "gridPos": {
                  "x": 12,
                  "y": 13,
                  "w": 12,
                  "h": 10
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "fieldConfig": {
                  "defaults": {
                    "displayName": "${__field.labels.referer}",
                    "decimals": 0,
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    },
                    "min": 0
                  }
                },
                "options": {
                  "orientation": "horizontal",
                  "displayMode": "basic",
                  "namePlacement": "left",
                  "showUnfilled": true,
                  "valueMode": "text",
                  "reduceOptions": {
                    "values": false,
                    "calcs": [
                      "lastNotNull"
                    ]
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "instant",
                    "expr": "sort_desc(topk(10, sum by (referer) (count_over_time({job=\"nginx_access\"} | json | method=\"GET\" | status < 400 | uri =~ \"/(dashboard|login|register|messages|profile(/[0-9]+)?|reviews(/[0-9]+|/create/[0-9]+)?|my-gigs(/(created|assigned|applications))?|store(/new|/[0-9]+|/requests/(new|[0-9]+))?|tasks(/create|/[0-9]+)?|(edit|posted)/(task|item|request)/[0-9]+)?/?\" | user_agent !~ \"(?i).*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless).*\" | referer != \"\" | referer !~ \"https?://[0-9.]+([:/].*)?\" [$__range]))))"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Responses by status",
                "description": "Every response nginx sent, by status code (200 OK, 304 unchanged, 404 not found, 5xx failed). Includes scanners.",
                "gridPos": {
                  "x": 0,
                  "y": 23,
                  "w": 24,
                  "h": 8
                },
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "targets": [
                  {
                    "refId": "A",
                    "legendFormat": "{{status}}",
                    "expr": "sum by (status) (count_over_time({job=\"nginx_access\"} | json [$__interval]))"
                  }
                ]
              }
            ],
            "time": {
              "from": "now-7d",
              "to": "now"
            },
            "refresh": "5m"
          }
      become: yes

    - name: Write Service Logs dashboard
      # Container output shipped by Promtail (job="containers"), labelled by
      # compose service and stream (stdout / stderr).
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/service-logs.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Service Logs",
            "uid": "service-logs",
            "schemaVersion": 36,
            "templating": { "list": [
              { "name": "service", "label": "Service", "type": "query",
                "datasource": { "type": "loki", "uid": "loki" },
                "query": "label_values({job=\"containers\"}, service)",
                "includeAll": true, "multi": true, "allValue": ".+",
                "current": { "text": "All", "value": "$__all" }, "refresh": 2 },
              { "name": "search", "label": "Search", "type": "textbox", "query": "" }
            ] },
            "panels": [
              {
                "type": "timeseries",
                "title": "Log lines per service",
                "description": "How much each service is logging. A sudden spike often means something is failing in a loop.",
                "gridPos": { "x": 0, "y": 0, "w": 12, "h": 7 },
                "datasource": { "type": "loki", "uid": "loki" },
                "fieldConfig": { "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } } } },
                "targets": [ { "refId": "A", "legendFormat": "{{service}}",
                  "expr": "sum by (service) (count_over_time({job=\"containers\", service=~\"$service\"} [$__interval]))" } ]
              },
              {
                "type": "timeseries",
                "title": "Error output per service",
                "description": "Lines written to stderr, plus any line mentioning error or panic. Some services log normal startup messages to stderr too.",
                "gridPos": { "x": 12, "y": 0, "w": 12, "h": 7 },
                "datasource": { "type": "loki", "uid": "loki" },
                "fieldConfig": { "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } } } },
                "targets": [ { "refId": "A", "legendFormat": "{{service}}",
                  "expr": "sum by (service) (count_over_time({job=\"containers\", service=~\"$service\"} |~ \"(?i)(error|panic|fatal)\" [$__interval]))" } ]
              },
              {
                "type": "logs",
                "title": "Logs",
                "description": "Newest first. Pick services and type in Search at the top to filter.",
                "gridPos": { "x": 0, "y": 7, "w": 24, "h": 16 },
                "datasource": { "type": "loki", "uid": "loki" },
                "options": { "showLabels": false, "showCommonLabels": false, "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true },
                "targets": [ { "refId": "A",
                  "expr": "{job=\"containers\", service=~\"$service\"} |~ \"(?i)$search\"" } ]
              }
            ],
            "time": { "from": "now-6h", "to": "now" },
            "refresh": "1m"
          }
      become: yes

    # --- Tempo ---

    - name: Create Tempo config directory
      ansible.builtin.file:
        path: /etc/tempo
        state: directory
        mode: "0755"
      become: yes

    - name: Write Tempo config
      ansible.builtin.copy:
        dest: /etc/tempo/tempo.yml
        mode: "0644"
        content: |
          stream_over_http_enabled: true
          server:
            http_listen_port: 3200
            log_level: warn

          distributor:
            receivers:
              otlp:
                protocols:
                  http:
                    endpoint: 0.0.0.0:4318

          ingester:
            max_block_duration: 5m

          compactor:
            compaction:
              # Traces carry client IPs; keep them 14 days.
              block_retention: 336h

          storage:
            trace:
              backend: local
              wal:
                path: /var/tempo/wal
              local:
                path: /var/tempo/blocks

          usage_report:
            reporting_enabled: false
      notify: restart tempo
      become: yes

    # --- Loki ---

    - name: Create Loki config directory
      ansible.builtin.file:
        path: /etc/loki
        state: directory
        mode: "0755"
      become: yes

    - name: Write Loki config
      ansible.builtin.copy:
        dest: /etc/loki/loki-config.yml
        mode: "0644"
        content: |
          auth_enabled: false

          server:
            http_listen_port: 3100

          common:
            path_prefix: /loki
            storage:
              filesystem:
                chunks_directory: /loki/chunks
                rules_directory: /loki/rules
            replication_factor: 1
            ring:
              instance_addr: 127.0.0.1
              kvstore:
                store: inmemory

          schema_config:
            configs:
              - from: 2020-10-24
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          limits_config:
            # Unique-visitor queries create one series per client IP.
            max_query_series: 50000
            # Access logs contain client IPs; keep them 90 days.
            retention_period: 2160h

          compactor:
            working_directory: /loki/compactor
            shared_store: filesystem
            retention_enabled: true

          analytics:
            reporting_enabled: false
      notify: restart loki
      become: yes

    # --- Umami secrets ---
    # Generated once on the server and never overwritten (force: false), so
    # the Postgres password stays in sync with the initialised database.

    - name: Create Umami config directory
      ansible.builtin.file:
        path: /etc/umami
        state: directory
        owner: myguy
        group: myguy
        mode: "0700"
      become: yes

    - name: Generate candidate Umami secrets
      # Evaluated once here; a lookup in the copy task's vars would be
      # re-evaluated on every reference and produce mismatched passwords.
      ansible.builtin.set_fact:
        umami_db_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}"
        umami_app_secret: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=48) }}"
      no_log: true

    - name: Write Umami environment file (first run only)
      ansible.builtin.copy:
        dest: /etc/umami/umami.env
        owner: myguy
        group: myguy
        mode: "0600"
        force: false
        content: |
          POSTGRES_USER=umami
          POSTGRES_DB=umami
          POSTGRES_PASSWORD={{ umami_db_password }}
          DATABASE_URL=postgresql://umami:{{ umami_db_password }}@localhost:5432/umami
          APP_SECRET={{ umami_app_secret }}
          DISABLE_TELEMETRY=1
      no_log: true
      become: yes

    # --- Containers (Podman Quadlet) ---
    # Runs after all config files above are written.  Each container is a
    # rootless systemd user service generated from a .container file; Quadlet
    # runs `podman run --replace`, so containers left from earlier deploys
    # with the same name are replaced rather than conflicting.

    - name: Remove legacy podman-generate-systemd units
      # Superseded by Quadlet; these units fail to start against a container
      # that is already running.
      ansible.builtin.file:
        path: "{{ user_systemd_dir }}/{{ item[0] }}container-{{ item[1].name }}.service"
        state: absent
      loop: "{{ ['', 'default.target.wants/'] | product(monitoring_containers) | list }}"
      loop_control:
        label: "{{ item[0] }}container-{{ item[1].name }}.service"
      become: yes
      become_user: myguy

    - name: Create Quadlet directory for myguy
      ansible.builtin.file:
        path: "{{ quadlet_dir }}"
        state: directory
        owner: myguy
        group: myguy
        mode: "0755"
      become: yes

    - name: Write Quadlet container units
      ansible.builtin.copy:
        dest: "{{ quadlet_dir }}/{{ item.name }}.container"
        owner: myguy
        group: myguy
        mode: "0644"
        content: |
          [Unit]
          Description={{ item.name }} (monitoring)
          {% if item.part_of is defined %}
          Requires={{ item.part_of }}.service
          After={{ item.part_of }}.service
          PartOf={{ item.part_of }}.service
          {% endif %}

          [Container]
          ContainerName={{ item.name }}
          Image={{ item.image }}
          {% for port in item.ports | default([]) %}
          PublishPort={{ port }}
          {% endfor %}
          {% for volume in item.volumes | default([]) %}
          Volume={{ volume }}
          {% endfor %}
          {% for key, value in (item.env | default({})).items() %}
          Environment={{ key }}={{ value }}
          {% endfor %}
          {% if item.network is defined %}
          Network={{ item.network }}
          {% endif %}
          {% if item.env_file is defined %}
          EnvironmentFile={{ item.env_file }}
          {% endif %}
          {% if item.user is defined %}
          User={{ item.user }}
          {% endif %}
          {% if item.exec is defined %}
          Exec={{ item.exec }}
          {% endif %}

          [Service]
          Restart=always
          # First start pulls the image, which can exceed the 90s default.
          TimeoutStartSec=900

          [Install]
          WantedBy=default.target
      loop: "{{ monitoring_containers }}"
      loop_control:
        label: "{{ item.name }}"
      register: quadlet_units
      become: yes

    - name: Stop Zipkin (replaced by Tempo)
      ansible.builtin.systemd:
        name: zipkin.service
        state: stopped
        scope: user
      failed_when: false
      become: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ xdg_runtime_dir }}/bus"

    - name: Remove the Zipkin Quadlet unit
      ansible.builtin.file:
        path: "{{ quadlet_dir }}/zipkin.container"
        state: absent
      become: yes

    - name: Start monitoring containers (restart those whose unit changed)
      # Quadlet services are generated, so they cannot be `enabled`; the
      # [Install] section above makes them start at boot instead.
      ansible.builtin.systemd:
        name: "{{ item.item.name }}.service"
        state: "{{ 'restarted' if item.changed else 'started' }}"
        daemon_reload: yes
        scope: user
      loop: "{{ quadlet_units.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      become: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ xdg_runtime_dir }}/bus"

    - name: Reload Prometheus config
      ansible.builtin.command:
        cmd: podman kill --signal HUP prometheus
      changed_when: false
      failed_when: false
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
