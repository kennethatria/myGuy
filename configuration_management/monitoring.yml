# monitoring.yml - Install Zipkin, Prometheus, Grafana, and Loki on the monitoring instance
#
# Runs as myguy (inventory ansible_user).  System tasks (apt, file writes under
# /etc/) carry explicit become: yes.  Podman containers run rootlessly as myguy
# so a container escape stays confined to the myguy user.

---
- name: Configure monitoring instance
  hosts: monitoring
  # No play-level become: each task declares its own privilege requirement.

  vars:
    # Run as rootless Podman Quadlet units owned by myguy: systemd starts,
    # restarts and boots each container (linger is enabled in users.yml).
    monitoring_containers:
      - name: zipkin
        image: docker.io/openzipkin/zipkin
        ports: ["9411:9411"]
      - name: prometheus
        image: docker.io/prom/prometheus:latest
        ports: ["9090:9090"]
        volumes:
          - /etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - name: grafana
        image: docker.io/grafana/grafana:latest
        ports: ["3000:3000"]
        volumes:
          - /etc/grafana/provisioning:/etc/grafana/provisioning:ro
          - /etc/grafana/dashboards:/etc/grafana/dashboards:ro
        env:
          GF_AUTH_ANONYMOUS_ENABLED: "false"
          GF_SERVER_HTTP_ADDR: "0.0.0.0"
      - name: loki
        image: docker.io/grafana/loki:2.9.10
        ports: ["3100:3100"]
        volumes:
          - /etc/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
          - loki-data:/loki
        exec: -config.file=/etc/loki/loki-config.yml

  handlers:
    - name: restart grafana
      ansible.builtin.command:
        cmd: podman restart grafana
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false

  pre_tasks:
    - name: Get myguy user ID for XDG_RUNTIME_DIR
      ansible.builtin.command:
        cmd: id -u myguy
      register: app_user_uid_result
      changed_when: false

    - name: Set XDG_RUNTIME_DIR fact
      ansible.builtin.set_fact:
        app_user_uid: "{{ app_user_uid_result.stdout }}"
        xdg_runtime_dir: "/run/user/{{ app_user_uid_result.stdout }}"
        user_systemd_dir: "/home/myguy/.config/systemd/user"
        quadlet_dir: "/home/myguy/.config/containers/systemd"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      become: yes

    - name: Enable universe repository
      ansible.builtin.apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_facts['distribution_release'] }} universe"
        state: present
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    - name: Update apt cache after enabling universe
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    - name: Install Podman
      ansible.builtin.apt:
        name: podman
        state: present
      when: ansible_facts['os_family'] == "Debian"
      become: yes

    - name: Create user systemd directory for myguy
      ansible.builtin.file:
        path: "{{ user_systemd_dir }}"
        state: directory
        owner: myguy
        group: myguy
        mode: "0755"
      become: yes

    - name: Set zipkin_url fact for use by other plays
      ansible.builtin.set_fact:
        zipkin_url: "http://{{ ansible_host }}:9411/api/v2/spans"

    # --- Prometheus ---

    - name: Create Prometheus config directory
      ansible.builtin.file:
        path: /etc/prometheus
        state: directory
        mode: "0755"
      become: yes

    - name: Write Prometheus config
      ansible.builtin.copy:
        dest: /etc/prometheus/prometheus.yml
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: node_exporter
              static_configs:
                - targets: ['{{ instance_vpc_ip }}:{{ node_exporter_port }}']
                  labels:
                    instance: app

            - job_name: falco
              static_configs:
                - targets: ['{{ instance_vpc_ip }}:{{ falco_metrics_port }}']
                  labels:
                    instance: app
      become: yes

    # --- Grafana provisioning files ---

    - name: Create Grafana provisioning directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/grafana/provisioning/datasources
        - /etc/grafana/provisioning/dashboards
        - /etc/grafana/dashboards
      become: yes

    - name: Write Grafana Prometheus datasource
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://host.containers.internal:9090
              isDefault: true
      notify: restart grafana
      become: yes

    - name: Write Grafana Loki datasource
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/loki.yml
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://host.containers.internal:3100
              isDefault: false
      notify: restart grafana
      become: yes

    - name: Write Grafana dashboard provisioning config
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/dashboards/default.yml
        mode: "0644"
        content: |
          apiVersion: 1
          providers:
            - name: default
              type: file
              options:
                path: /etc/grafana/dashboards
      become: yes

    - name: Write node exporter dashboard
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/node-exporter.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "App Instance Metrics",
            "uid": "node-exporter",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "timeseries",
                "title": "CPU Usage (%)",
                "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[2m])) * 100)",
                    "legendFormat": "{{instance}}"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Memory Usage (%)",
                "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "100 - ((node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100)",
                    "legendFormat": "{{instance}}"
                  }
                ]
              }
            ],
            "time": { "from": "now-1h", "to": "now" },
            "refresh": "30s"
          }
      become: yes

    - name: Write Falco security alerts dashboard
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/falco.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "Falco Security Alerts",
            "uid": "falco-alerts",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "timeseries",
                "title": "Security Alerts by Priority",
                "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 },
                "targets": [
                  {
                    "expr": "rate(falco_events_total[5m])",
                    "legendFormat": "{{priority}} - {{rule}}"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Total Alerts (last 1h)",
                "gridPos": { "x": 0, "y": 8, "w": 8, "h": 4 },
                "targets": [
                  {
                    "expr": "increase(falco_events_total[1h])"
                  }
                ]
              }
            ],
            "time": { "from": "now-1h", "to": "now" },
            "refresh": "30s"
          }
      become: yes

    - name: Write WAF dashboard
      ansible.builtin.copy:
        dest: /etc/grafana/dashboards/waf-modsecurity.json
        mode: "0644"
        content: !unsafe |
          {
            "title": "WAF - ModSecurity Detections",
            "uid": "waf-modsecurity",
            "schemaVersion": 36,
            "panels": [
              {
                "type": "logs",
                "title": "Recent Detections",
                "gridPos": { "x": 0, "y": 0, "w": 24, "h": 10 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "expr": "{job=\"modsecurity\"} |~ \"ModSecurity: Warning\"",
                    "refId": "A"
                  }
                ],
                "options": {
                  "showLabels": true,
                  "showTime": true,
                  "wrapLogMessage": true
                }
              },
              {
                "type": "timeseries",
                "title": "Requests Exceeding Anomaly Threshold",
                "gridPos": { "x": 0, "y": 10, "w": 16, "h": 8 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "expr": "sum(count_over_time({job=\"modsecurity\"} |~ \"Anomaly Score Exceeded\"[5m]))",
                    "legendFormat": "detections",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Total Detections (last 1h)",
                "gridPos": { "x": 16, "y": 10, "w": 8, "h": 8 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "expr": "sum(count_over_time({job=\"modsecurity\"} |~ \"Anomaly Score Exceeded\"[1h]))",
                    "refId": "A"
                  }
                ]
              }
            ],
            "time": { "from": "now-6h", "to": "now" },
            "refresh": "30s"
          }
      notify: restart grafana
      become: yes

    # --- Loki ---

    - name: Create Loki config directory
      ansible.builtin.file:
        path: /etc/loki
        state: directory
        mode: "0755"
      become: yes

    - name: Write Loki config
      ansible.builtin.copy:
        dest: /etc/loki/loki-config.yml
        mode: "0644"
        content: |
          auth_enabled: false

          server:
            http_listen_port: 3100

          common:
            path_prefix: /loki
            storage:
              filesystem:
                chunks_directory: /loki/chunks
                rules_directory: /loki/rules
            replication_factor: 1
            ring:
              instance_addr: 127.0.0.1
              kvstore:
                store: inmemory

          schema_config:
            configs:
              - from: 2020-10-24
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          analytics:
            reporting_enabled: false
      become: yes

    # --- Containers (Podman Quadlet) ---
    # Runs after all config files above are written.  Each container is a
    # rootless systemd user service generated from a .container file; Quadlet
    # runs `podman run --replace`, so containers left from earlier deploys
    # with the same name are replaced rather than conflicting.

    - name: Remove legacy podman-generate-systemd units
      # Superseded by Quadlet; these units fail to start against a container
      # that is already running.
      ansible.builtin.file:
        path: "{{ user_systemd_dir }}/{{ item[0] }}container-{{ item[1].name }}.service"
        state: absent
      loop: "{{ ['', 'default.target.wants/'] | product(monitoring_containers) | list }}"
      loop_control:
        label: "{{ item[0] }}container-{{ item[1].name }}.service"
      become: yes
      become_user: myguy

    - name: Create Quadlet directory for myguy
      ansible.builtin.file:
        path: "{{ quadlet_dir }}"
        state: directory
        owner: myguy
        group: myguy
        mode: "0755"
      become: yes

    - name: Write Quadlet container units
      ansible.builtin.copy:
        dest: "{{ quadlet_dir }}/{{ item.name }}.container"
        owner: myguy
        group: myguy
        mode: "0644"
        content: |
          [Unit]
          Description={{ item.name }} (monitoring)

          [Container]
          ContainerName={{ item.name }}
          Image={{ item.image }}
          {% for port in item.ports | default([]) %}
          PublishPort={{ port }}
          {% endfor %}
          {% for volume in item.volumes | default([]) %}
          Volume={{ volume }}
          {% endfor %}
          {% for key, value in (item.env | default({})).items() %}
          Environment={{ key }}={{ value }}
          {% endfor %}
          {% if item.exec is defined %}
          Exec={{ item.exec }}
          {% endif %}

          [Service]
          Restart=always
          # First start pulls the image, which can exceed the 90s default.
          TimeoutStartSec=900

          [Install]
          WantedBy=default.target
      loop: "{{ monitoring_containers }}"
      loop_control:
        label: "{{ item.name }}"
      register: quadlet_units
      become: yes

    - name: Start monitoring containers (restart those whose unit changed)
      # Quadlet services are generated, so they cannot be `enabled`; the
      # [Install] section above makes them start at boot instead.
      ansible.builtin.systemd:
        name: "{{ item.item.name }}.service"
        state: "{{ 'restarted' if item.changed else 'started' }}"
        daemon_reload: yes
        scope: user
      loop: "{{ quadlet_units.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      become: yes
      become_user: myguy
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ xdg_runtime_dir }}/bus"

    - name: Reload Prometheus config
      ansible.builtin.command:
        cmd: podman kill --signal HUP prometheus
      changed_when: false
      failed_when: false
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
