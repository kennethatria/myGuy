name: Run tests and check code coverage

on:
  workflow_call:

# Read-only by default; jobs that need more ask for it.
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests (Go)
    runs-on: ubuntu-latest
    env:
      GOWORK: off

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run tests with coverage
        working-directory: ./backend
        run: |
          go test ./internal/... -v -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out

      - name: Check coverage threshold
        working-directory: ./backend
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"

          # Check if coverage is above 70%
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

          echo "::notice::Coverage ${COVERAGE}% meets the 70% threshold"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

  store-service-tests:
    name: Store Service Tests (Go)
    runs-on: ubuntu-latest
    env:
      GOWORK: off

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: store-service/go.sum

      - name: Download dependencies
        working-directory: ./store-service
        run: go mod download

      - name: Run tests with coverage
        working-directory: ./store-service
        run: |
          go test ./internal/... -v -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out

      - name: Check coverage threshold
        working-directory: ./store-service
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"

          # Check if coverage is above 70% (store-service threshold)
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

          echo "::notice::Coverage ${COVERAGE}% meets the 70% threshold"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: store-service-coverage
          path: store-service/coverage.out
          retention-days: 7

  proximity-service-tests:
    name: Proximity Service Tests (Go)
    runs-on: ubuntu-latest
    env:
      GOWORK: off

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: proximity-service/go.sum

      - name: Download dependencies
        working-directory: ./proximity-service
        run: go mod download

      - name: Run tests with coverage
        working-directory: ./proximity-service
        run: |
          go test ./internal/... -v -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out

      - name: Check coverage threshold
        working-directory: ./proximity-service
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"

          # Check if coverage is above 70% (proximity-service threshold)
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

          echo "::notice::Coverage ${COVERAGE}% meets the 70% threshold"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: proximity-service-coverage
          path: proximity-service/coverage.out
          retention-days: 7

  chat-service-tests:
    name: Chat Service Tests (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chat-websocket-service/package-lock.json

      - name: Install dependencies
        working-directory: ./chat-websocket-service
        run: npm ci

      - name: Run linter
        working-directory: ./chat-websocket-service
        run: npm run lint --if-present

      - name: Run tests
        working-directory: ./chat-websocket-service
        run: npm test --if-present
        env:
          NODE_ENV: test

  frontend-tests:
    name: Frontend Tests (Vue/TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run type check
        working-directory: ./frontend
        run: npm run type-check --if-present

      - name: Run linter
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test:unit --if-present
        env:
          NODE_ENV: test

  # The production frontend bundle (the tests above don't build it). Runs
  # alongside the tests rather than after them; the Go services are compiled
  # by their tests and by the Docker builds below.
  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  # Builds every service image the way main will, without pushing, so a
  # broken Dockerfile fails the pull request instead of the deploy. Reads
  # the layer cache main's builds write (pull requests can't write one main
  # could use, so they don't).
  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            image: myguy-api
          - service: store-service
            image: myguy-store-service
          - service: chat-websocket-service
            image: myguy-chat-websocket-service
          - service: proximity-service
            image: myguy-proximity-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
