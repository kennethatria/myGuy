name: Run ansible

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: string

  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev

env:
  TF_VERSION: '1.14.6'
  TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
  REGISTRY: ${{ vars.REGISTRY }}

jobs:
  deploy:
    name: Run Ansible Deploy Playbook
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_version: ${{ env.TF_VERSION }}

      - name: Get server IP from Terraform output
        id: get_ip
        working-directory: infra
        run: |
          terraform init -input=false
          echo "SERVER_IP=$(terraform output -raw instance_ip_address)" >> $GITHUB_ENV

      - name: Inject server IP into inventory
        run: |
          sed -i "s/APP_INSTANCE_PUBLIC_IP/$SERVER_IP/g" configuration_management/inventory.ini

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://${{ vars.DOMAIN }}/api/v1
          VITE_STORE_API_URL: https://${{ vars.DOMAIN }}/store/api/v1
          VITE_STORE_API_BASE_URL: https://${{ vars.DOMAIN }}/store
          VITE_CHAT_WS_URL: https://${{ vars.DOMAIN }}
          VITE_CHAT_API_URL: https://${{ vars.DOMAIN }}/chat/api/v1
          # Optional: set after creating the website in the Umami dashboard.
          VITE_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}

      - name: Install Ansible
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ansible rsync

      - name: Install Ansible collections
        run: ansible-galaxy collection install containers.podman

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Get image tag
        id: get_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if LATEST_TAG=$(gh release view --repo ${{ github.repository }} --json tagName --jq '.tagName' 2>/dev/null); then
            echo "image_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          else
            echo "image_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Verify images are signed
        run: |
          for IMAGE in \
            ${{ env.REGISTRY }}/myguy-api:${{ steps.get_tag.outputs.image_tag }} \
            ${{ env.REGISTRY }}/myguy-store-service:${{ steps.get_tag.outputs.image_tag }} \
            ${{ env.REGISTRY }}/myguy-chat-websocket-service:${{ steps.get_tag.outputs.image_tag }}; do
            echo "Verifying $IMAGE..."
            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$IMAGE"
          done

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          # Write to ~/.ssh/linode to match the path hardcoded in inventory.ini
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/linode
          chmod 600 ~/.ssh/linode
          # Derive public key from private key — used to authorize myguy on both instances
          ssh-keygen -y -f ~/.ssh/linode > ~/.ssh/linode.pub
          # Add app instance to known_hosts — monitoring is VPC-only and
          # is reached via ProxyJump through the app instance (handled in inventory)
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

      - name: Bootstrap users and harden SSH
        # Connects as root (remote_user: root inside users.yml overrides inventory).
        # Creates myguy on both instances and disables root login.
        # Must run before all other playbooks.
        # Keys are passed as JSON: -e "key=value" splits on spaces, which would
        # truncate an SSH public key to just its type ("ssh-ed25519").
        env:
          OPS_SSH_PUBLIC_KEY: ${{ secrets.OPS_SSH_PUBLIC_KEY }}
        run: |
          ansible-playbook \
            -i configuration_management/inventory.ini \
            configuration_management/users.yml \
            -e "$(jq -n \
                  --arg ci "$(cat ~/.ssh/linode.pub)" \
                  --arg ops "$OPS_SSH_PUBLIC_KEY" \
                  '{ci_cd_public_key: $ci, ops_ssh_public_key: $ops}')"

      - name: Configure monitoring instance
        run: |
          ansible-playbook \
            -i configuration_management/inventory.ini \
            configuration_management/monitoring.yml

      - name: Configure app instance base
        run: |
          ansible-playbook \
            -i configuration_management/inventory.ini \
            configuration_management/site.yml \
            -e "target=app"

      - name: Configure app instance security
        run: |
          ansible-playbook \
            -i configuration_management/inventory.ini \
            configuration_management/security.yml \
            -e "target=app"

      - name: Configure app instance observability
        run: |
          ansible-playbook \
            -i configuration_management/inventory.ini \
            configuration_management/observability.yml \
            -e "target=app"

      - name: Deploy application
        # Values are passed as JSON via env so spaces or shell metacharacters
        # in secrets can't truncate or break them (see bootstrap step).
        env:
          REPO_URL: ${{ secrets.REPO_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          IMAGE_TAG: ${{ steps.get_tag.outputs.image_tag }}
          DOMAIN: ${{ vars.DOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
        run: |
          ansible-playbook \
            -i configuration_management/inventory.ini \
            configuration_management/deploy.yml \
            -e "$(jq -n \
                  --arg repo_url "$REPO_URL" \
                  --arg jwt_secret "$JWT_SECRET" \
                  --arg db_password "$DB_PASSWORD" \
                  --arg internal_api_key "$INTERNAL_API_KEY" \
                  --arg registry "$REGISTRY" \
                  --arg image_tag "$IMAGE_TAG" \
                  --arg github_repository "$GITHUB_REPOSITORY" \
                  --arg domain "$DOMAIN" \
                  --arg certbot_email "$CERTBOT_EMAIL" \
                  --arg smtp_host "$SMTP_HOST" \
                  --arg smtp_port "$SMTP_PORT" \
                  --arg smtp_username "$SMTP_USERNAME" \
                  --arg smtp_password "$SMTP_PASSWORD" \
                  --arg smtp_from "$SMTP_FROM" \
                  '{target: "app"} + $ARGS.named')"

      - name: Upload frontend dist
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/linode -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            myguy@$SERVER_IP:/opt/myguy/frontend/dist/

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/linode
