name: Run CodeQL analysis

on:
  workflow_call:
  schedule:
    - cron: '37 1 * * 5'

# Read-only by default; jobs that need more ask for it.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go', 'javascript-typescript' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby', 'swift' ]
        # Use only 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use only 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Tests and generated reports aren't shipped code
        config: |
          paths-ignore:
            - '**/tests/**'
            - '**/__tests__/**'
            - '**/e2e/**'
            - '**/coverage/**'
            - '**/node_modules/**'
            - '**/dist/**'
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    - name: Setup Go
      if: matrix.language == 'go'
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Build Go modules
      if: matrix.language == 'go'
      run: |
        # Using the go.work file to build the specific service packages
        go build ./backend/...
        go build ./store-service/...
        go build ./proximity-service/...

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        # One category for every run (schedule, pull request, push to main)
        # so pull requests are compared with main and fixes close alerts.
        # It keeps the name main's existing alerts were filed under.
        category: .github/workflows/component.security.codeql.yml:analyze/language:${{ matrix.language }}
