name: Build and push images to registry

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'backend/**'
  #     - 'store-service/**'
  #     - 'chat-websocket-service/**'
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}

jobs:
  get-tag:
    name: Get Image Tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.get_release.outputs.image_tag }}
    steps:
      - name: Get latest release tag
        id: get_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if LATEST_TAG=$(gh release view --repo ${{ github.repository }} --json tagName --jq '.tagName' 2>/dev/null); then
            echo "Found latest release: $LATEST_TAG"
            echo "image_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          else
            echo "No releases found, using 'latest'"
            echo "image_tag=latest" >> $GITHUB_OUTPUT
          fi

  # One job per service, all in parallel (they used to run one after
  # another). Layers are cached in the GitHub Actions cache per service, so
  # a build only redoes what changed.
  build-push:
    needs: get-tag
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: API Service
            context: ./backend
            image: myguy-api
          - name: Store Service
            context: ./store-service
            image: myguy-store-service
          - name: Chat Websocket Service
            context: ./chat-websocket-service
            image: myguy-chat-websocket-service
          - name: Proximity Service
            context: ./proximity-service
            image: myguy-proximity-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # The GitHub Actions cache below needs the buildx container driver
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ needs.get-tag.outputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Sign image with Cosign
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
