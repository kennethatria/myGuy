name: Build and push images to registry

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'backend/**'
  #     - 'store-service/**'
  #     - 'chat-websocket-service/**'
  workflow_dispatch:
    inputs:
      services:
        description: JSON list of compose services to build
        required: false
        default: '["api", "store-service", "chat-websocket-service", "proximity-service"]'
        type: string
  workflow_call:
    inputs:
      services:
        description: JSON list of compose services to build (the pipeline passes what changed)
        required: false
        default: '["api", "store-service", "chat-websocket-service", "proximity-service"]'
        type: string

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}

jobs:
  get-tag:
    name: Get Image Tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.get_release.outputs.image_tag }}
    steps:
      - name: Get latest release tag
        id: get_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if LATEST_TAG=$(gh release view --repo ${{ github.repository }} --json tagName --jq '.tagName' 2>/dev/null); then
            echo "Found latest release: $LATEST_TAG"
            echo "image_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          else
            echo "No releases found, using 'latest'"
            echo "image_tag=latest" >> $GITHUB_OUTPUT
          fi

  # One job per requested service, all in parallel. Each service builds from
  # the directory of the same name (api from backend/) into myguy-<service>.
  # Layers are cached in the GitHub Actions cache per service, so a build
  # only redoes what changed.
  build-push:
    needs: get-tag
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    env:
      CONTEXT: ./${{ matrix.service == 'api' && 'backend' || matrix.service }}
      IMAGE: myguy-${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # The GitHub Actions cache below needs the buildx container driver
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ needs.get-tag.outputs.image_tag }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}

      - name: Sign image with Cosign
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
