---
name: Run release please

concurrency:
  group: please-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
    workflow_call:

# Read-only by default; jobs that need more ask for it.
permissions:
  contents: read

jobs:
    release-please:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write
        steps:
            - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445
              with:
                  release-type: simple