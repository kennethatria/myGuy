---
name: Run release please

concurrency:
  group: please-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
    workflow_call:

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
              with:
                  release-type: simple