# IMAGE_TAG is set by the deploy (configuration_management/deploy.yml) to the
# tag CI pushed and whose signature it verified; local runs default to latest.
services:
  api:
    image: docker.io/katria47/myguy-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Account / marketplace counts for Prometheus (monitoring server only)
      - "9464:9464"
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - DB_CONNECTION=host=postgres-db user=postgres password=${DB_PASSWORD} dbname=my_guy port=5432 sslmode=disable
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-otlp}
      # Task events (applications, decisions) are posted into Messages via chat
      - CHAT_API_URL=http://chat-websocket-service:8082/api/v1
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Rough locations of gigs; "false" turns distance sorting off (rollback)
      - PROXIMITY_URL=http://proximity-service:8083
      - PROXIMITY_SORT_ENABLED=true
      # Login-code email. Unset SMTP_HOST logs codes instead (local dev only).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - myguy-network

  store-service:
    image: docker.io/katria47/myguy-store-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8081:8081"
      # Account / marketplace counts for Prometheus (monitoring server only)
      - "9465:9465"
    environment:
      - PORT=8081
      - JWT_SECRET=${JWT_SECRET}
      # Separate store database
      - DB_CONNECTION=host=postgres-db user=postgres password=${DB_PASSWORD} dbname=my_guy_store port=5432 sslmode=disable
      # Chat service integration for booking notifications
      - CHAT_API_URL=http://chat-websocket-service:8082/api/v1
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Rough locations of listings and requests; "false" turns distance
      # sorting off (rollback)
      - PROXIMITY_URL=http://proximity-service:8083
      - PROXIMITY_SORT_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-otlp}
    volumes:
      - store-uploads:/app/uploads
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - myguy-network

  chat-websocket-service:
    image: docker.io/katria47/myguy-chat-websocket-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET}
      # Separate chat database
      - DB_CONNECTION=postgresql://postgres:${DB_PASSWORD}@postgres-db:5432/my_guy_chat
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres-db:5432/my_guy_chat
      - CLIENT_URL=http://localhost:5173
      # API URLs for cross-service validation
      - MAIN_API_URL=http://api:8080/api/v1
      - STORE_API_URL=http://store-service:8081/api/v1
      # Internal API key for secure inter-service communication
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Redis for horizontal scaling (optional - enables multi-instance mode)
      - REDIS_URL=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-otlp}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      store-service:
        condition: service_started
    networks:
      - myguy-network

  # Rough locations of gigs, listings and requests. Internal only: no
  # published ports; the backend and store-service call it.
  proximity-service:
    image: docker.io/katria47/myguy-proximity-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - PORT=8083
      - GIN_MODE=release
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - REDIS_ADDR=proximity-redis:6379
      - REDIS_PASSWORD=${PROXIMITY_REDIS_PASSWORD}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-otlp}
    depends_on:
      proximity-redis:
        condition: service_healthy
    networks:
      - myguy-network

  # The proximity service's own Redis (chat's is separate): password set,
  # append-only file synced every second, no published ports.
  proximity-redis:
    image: docker.io/redis:7-alpine
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${PROXIMITY_REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - proximity-redis-data:/data
    networks:
      - myguy-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - myguy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Optional: Redis persistence configuration
    command: redis-server --appendonly yes

  postgres-db:
    image: docker.io/postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=my_guy
      # Create multiple databases for microservices
      - POSTGRES_MULTIPLE_DATABASES=my_guy,my_guy_chat,my_guy_store
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Script to create multiple databases on startup
      - ./scripts/create-multiple-databases.sh:/docker-entrypoint-initdb.d/create-databases.sh
    networks:
      - myguy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  store-uploads:
  redis-data:
  proximity-redis-data:

networks:
  myguy-network:
    driver: bridge
