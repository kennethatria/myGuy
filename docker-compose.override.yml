# Local development additions, loaded automatically by `podman compose` /
# `docker compose` alongside docker-compose.yml.
#
# Production deploys with `-f docker-compose.yml` only, so none of this runs
# there: services send traces to the monitoring server's Jaeger instead
# (OTEL_EXPORTER_OTLP_ENDPOINT in the server's .env).
services:
  # A fixed password so the proximity Redis starts without a .env entry;
  # production sets PROXIMITY_REDIS_PASSWORD from a repository secret.
  proximity-service:
    environment:
      - REDIS_PASSWORD=local-dev-only
  proximity-redis:
    environment:
      - REDIS_PASSWORD=local-dev-only

  # Traces: services send OTLP to jaeger:4318; view them at
  # http://localhost:16686 (Jaeger's UI).  Same Jaeger as production.
  jaeger:
    image: docker.io/jaegertracing/jaeger:2.22.0
    restart: unless-stopped
    command: ["--config", "/etc/jaeger/jaeger.yml"]
    volumes:
      - ./configuration_management/files/jaeger.yml:/etc/jaeger/jaeger.yml:ro
    ports:
      - "4318:4318"
      - "16686:16686"
    networks:
      - myguy-network
