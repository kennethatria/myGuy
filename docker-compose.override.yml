# Local development additions, loaded automatically by `podman compose` /
# `docker compose` alongside docker-compose.yml.
#
# Production deploys with `-f docker-compose.yml` only, so none of this runs
# there: services send traces to the monitoring server's Tempo instead
# (OTEL_EXPORTER_OTLP_ENDPOINT in the server's .env).
services:
  # A fixed password so the proximity Redis starts without a .env entry;
  # production sets PROXIMITY_REDIS_PASSWORD from a repository secret.
  proximity-service:
    environment:
      - REDIS_PASSWORD=local-dev-only
  proximity-redis:
    environment:
      - REDIS_PASSWORD=local-dev-only

  # Traces: services send OTLP to tempo:4318; view them in Grafana at
  # http://localhost:3000 (Explore → Tempo).
  tempo:
    image: docker.io/grafana/tempo:2.6.1
    restart: unless-stopped
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo-local.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "4318:4318"
    networks:
      - myguy-network

  grafana:
    image: docker.io/grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana-local-datasources.yml:/etc/grafana/provisioning/datasources/tempo.yml:ro
    ports:
      - "3000:3000"
    networks:
      - myguy-network
